# ABOUTME: The #480 spike's in-cluster processor: tool-pin Deployment and Service in namespace agent.
# ABOUTME: Applied by live-check.sh only, never by Argo CD; nothing in gitops/ references this directory.
#
# No image of its own: the watch-it-burn:tool-pin-grpcio-1.84.1 image (images/tool-pin/Dockerfile) was never
# pushed, and the live check should not wait on a publish. The pod runs tool_pin.py from the tool-pin-src ConfigMap, which
# live-check.sh creates from images/tool-pin/tool_pin.py and requirements.txt, on the python:3.12-slim mirror
# guard-proxy already runs (so the nodes have it and the admin cluster's registry and signature policies admit it).
# An init container installs grpcio from requirements.txt by hash, which needs egress to PyPI once at start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-pin
  labels: { app.kubernetes.io/name: tool-pin, app.kubernetes.io/component: mcp-guardrail }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: tool-pin } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tool-pin, app.kubernetes.io/component: mcp-guardrail }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: deps
          image: ghcr.io/peopleforrester/watch-it-burn:python-3.12-slim@sha256:6c4dd321d176d61ea848dc8c73a4f7dbae8f70e0ee48bb411ea2f045b599fa8e
          command: ["python", "-m", "pip", "install", "--target", "/deps", "--only-binary=:all:", "--no-deps",
                    "--require-hashes", "-r", "/app/requirements.txt"]
          env:
            - { name: HOME, value: /tmp }
            - { name: PIP_NO_CACHE_DIR, value: "1" }
            - { name: PIP_DISABLE_PIP_VERSION_CHECK, value: "1" }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: src, mountPath: /app, readOnly: true }
            - { name: deps, mountPath: /deps }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: tool-pin
          image: ghcr.io/peopleforrester/watch-it-burn:python-3.12-slim@sha256:6c4dd321d176d61ea848dc8c73a4f7dbae8f70e0ee48bb411ea2f045b599fa8e
          command: ["python", "/app/tool_pin.py", "serve"]
          env:
            - { name: PIN_MODE, value: strip } # live-check.sh flips this to deny for the JSON-RPC error check
            - { name: PIN_PORT, value: "9001" }
            - { name: PIN_BASELINE, value: /etc/tool-pin/baseline.json }
            - { name: PYTHONPATH, value: /deps }
            - { name: PYTHONUNBUFFERED, value: "1" }
          ports: [{ name: grpc, containerPort: 9001 }]
          # Limits are required: require-resource-limits is Enforce on admin clusters.
          resources: { requests: { cpu: 20m, memory: 48Mi }, limits: { cpu: 200m, memory: 128Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe: { tcpSocket: { port: grpc }, initialDelaySeconds: 2, periodSeconds: 5 }
          volumeMounts:
            - { name: baseline, mountPath: /etc/tool-pin, readOnly: true }
            - { name: src, mountPath: /app, readOnly: true }
            - { name: deps, mountPath: /deps, readOnly: true }
      volumes:
        - name: baseline
          configMap: { name: tool-pin-baseline }
        - name: src
          configMap: { name: tool-pin-src }
        - name: deps
          emptyDir: { sizeLimit: 64Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tool-pin
  labels: { app.kubernetes.io/name: tool-pin }
spec:
  selector: { app.kubernetes.io/name: tool-pin }
  ports:
    - { name: grpc, port: 9001, targetPort: grpc, appProtocol: grpc }
