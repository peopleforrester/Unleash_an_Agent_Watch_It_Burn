# ABOUTME: The #480 spike's in-cluster processor: tool-pin Deployment and Service in namespace agent.
# ABOUTME: Applied by live-check.sh only, never by Argo CD; nothing in gitops/ references this directory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-pin
  labels: { app.kubernetes.io/name: tool-pin, app.kubernetes.io/component: mcp-guardrail }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: tool-pin } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tool-pin, app.kubernetes.io/component: mcp-guardrail }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: tool-pin
          # Tag only, because this image has not been built yet. live-check.sh swaps in IMAGE, which should
          # be the digest reference the push printed (images/tool-pin/Dockerfile has the build steps).
          image: ghcr.io/peopleforrester/watch-it-burn:tool-pin
          imagePullPolicy: Always
          env:
            - { name: PIN_MODE, value: strip } # live-check.sh flips this to deny for the JSON-RPC error check
            - { name: PIN_PORT, value: "9001" }
            - { name: PIN_BASELINE, value: /etc/tool-pin/baseline.json }
          ports: [{ name: grpc, containerPort: 9001 }]
          # Limits are required: require-resource-limits is Enforce on admin clusters.
          resources: { requests: { cpu: 20m, memory: 48Mi }, limits: { cpu: 200m, memory: 128Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe: { tcpSocket: { port: grpc }, initialDelaySeconds: 2, periodSeconds: 5 }
          volumeMounts:
            - { name: baseline, mountPath: /etc/tool-pin, readOnly: true }
      volumes:
        - name: baseline
          configMap: { name: tool-pin-baseline }
---
apiVersion: v1
kind: Service
metadata:
  name: tool-pin
  labels: { app.kubernetes.io/name: tool-pin }
spec:
  selector: { app.kubernetes.io/name: tool-pin }
  ports:
    - { name: grpc, port: 9001, targetPort: grpc, appProtocol: grpc }
