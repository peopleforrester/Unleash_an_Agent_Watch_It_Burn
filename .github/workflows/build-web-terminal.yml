# ABOUTME: Build the attendee web-terminal image (ttyd + kubectl) and push it to GHCR under ttyd's version, with a -<n> suffix
# ABOUTME: for a rebuild of new source (#838), never over an existing tag (#816). Runs on images/web-terminal/** changes.
name: build-web-terminal

on:
  workflow_dispatch: {}
  push:
    branches: [staging, main]
    paths:
      - 'images/web-terminal/**'
      - '.github/workflows/build-web-terminal.yml'
      - 'scripts/ghcr_version_tag.py'

permissions:
  contents: read
  packages: write

# One build at a time: the push step takes the first free web-terminal-ttyd-<v>-<n>, and two runs at once could
# both take the same one (#838).
concurrency:
  group: build-web-terminal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # STANDING CREDENTIAL, and worth removing. GHCR_TOKEN is a long-lived PAT with write:packages.
      # If it is a classic PAT it is account-wide, so it can push to every package under
      # peopleforrester, including the sister repo's. The image it guards is pulled with
      # imagePullPolicy: Always by every attendee cluster, into a shell holding the attendee's AWS key,
      # so whoever holds this token owns the terminal image fleet-wide on the next pod restart, with no
      # expiry. The permissions block above already grants packages: write, so the per-run GITHUB_TOKEN
      # would do this job with a credential that dies when the job does.
      #
      # It is still the PAT only because the peopleforrester/watch-it-burn package predates Actions and
      # is not linked to this repo, so GITHUB_TOKEN cannot write to it. That is a one-time fix in the
      # GitHub UI, not a code change:
      #   1. github.com/users/peopleforrester/packages/container/watch-it-burn/settings
      #   2. "Manage Actions access" -> add this repository -> Write
      #   3. change username to ${{ github.actor }} and password to ${{ secrets.GITHUB_TOKEN }}
      #   4. delete the GHCR_TOKEN secret
      # Do steps 1 and 2 BEFORE step 3, or the next build cannot push. Tracked in issue #91.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: peopleforrester
          password: ${{ secrets.GHCR_TOKEN }}
      # The image is labelled with the git tree id of images/web-terminal, which changes exactly when a file under it
      # does. The push step tells this build's source from each existing tag's by it (#838).
      - name: Read the source tree of images/web-terminal
        id: tree
        run: echo "tree=$(git rev-parse HEAD:images/web-terminal)" >> "${GITHUB_OUTPUT}"
      # The tag names the software inside (#714), read from the image just built and never written down by hand:
      # web-terminal-ttyd-<the version its ttyd reports>. verify/test_image_version_tags.py holds the tag
      # gitops/ai-layer/resources.yaml pins against the same reading of the pinned digest.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: images/web-terminal
          load: true
          tags: web-terminal:built
          labels: io.github.peopleforrester.watch-it-burn.source-tree=${{ steps.tree.outputs.tree }}
      - name: Read ttyd's version from the built image
        id: version
        run: |
          out="$(docker run --rm --entrypoint /usr/local/bin/ttyd web-terminal:built --version)"
          v="$(printf '%s\n' "${out}" | sed -nE 's/^ttyd version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          [ -n "${v}" ] || { echo "ttyd reported no version: ${out}" >&2; exit 1; }
          echo "tag=ghcr.io/peopleforrester/watch-it-burn:web-terminal-ttyd-${v}" >> "${GITHUB_OUTPUT}"
      # The build is not reproducible, so a push over the existing tag moves it off the digest
      # gitops/ai-layer/resources.yaml pins and signs (#816). scripts/ghcr_version_tag.py pushes only to a tag
      # ghcr.io does not have yet, and puts a pinned tag that has moved back on its pinned digest. TAG is the version
      # tag; when a tag of that version already carries this build's source tree, the build is not pushed, and when
      # none does, it goes to the first free one: web-terminal-ttyd-<v>, then web-terminal-ttyd-<v>-1, -2 (#838).
      - name: Push new source to a free version tag, or keep the pinned one on its digest
        env:
          GHCR_USER: peopleforrester
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/ghcr_version_tag.py web-terminal:built "${TAG}" gitops/ai-layer/resources.yaml images.lock
