# ABOUTME: Hecaton's CI path for this repo (#1020): the offline suite and the E2E tools suite on Tanjiro's runner, on
# ABOUTME: every push to agent/** or staging, so validation leaves netcup. Push only: never a pull_request trigger.
#
# Why push only. This repo is public. A pull_request or pull_request_target trigger would run a fork's code on
# Tanjiro, a self-hosted runner on Michael's own machine. Only accounts with write access can push a branch here, and
# hecaton's dispatcher pushes each candidate to its run's agent/<issue>-<run> branch and waits for these two checks on
# that exact SHA. verify/test_verify_suites_workflow.py fails if a trigger other than push is added, if either job
# leaves the tanjiro label, or if either job stops running its suite.
#
# Each job computes HECATON_BASE_SHA, the merge base of the pushed commit and origin/staging, with
# verify/ci-base-sha.sh, so the runners scoped by #1018 run only what the push touched. A push to staging scopes by
# the newest first-parent ancestor whose run of this workflow on staging finished success (#1195), so the changes of a
# run the next push cancelled (#1113) fall in the next run's scope; with no such ancestor it is unset and runs
# everything. The step reads those runs with gh and the job's own token, which is why every job has actions: read.
#
# The workspace persists between jobs on a self-hosted runner, so checkout does not clean it; the step after it
# removes every untracked and ignored file (#1123). The tools tier's pinned binaries are in no workspace: since #1188
# run-e2e-tools.sh runs the tier inside ghcr.io/peopleforrester/wib-e2e-tools, through the runner's rootless podman,
# which keeps the image between jobs, so the first job on a runner host pulls it and every later one pulls nothing. That cache, WIB_ARTIFACT_CACHE, is set by
# verify/ci-artifact-cache.sh to $RUNNER_TOOL_CACHE/wib-artifacts, outside the workspace and every checkout, and is
# the same step on the tanjiro and megumi runners. It holds the pinned tools and charts (#1118), checked against
# e2e-tools.lock and verify/charts.lock on every hit, uv's release archive (#1331), the PyYAML wheel (#1121), and the
# Terraform provider mirror and plugin cache, about 2.4 GB, which the lock-init test reads warm instead of downloading
# every provider again (#1114, #1119). verify/test_workflow_artifact_cache.py holds every workflow to this.
#
# Staging tests only its newest tip (#1113). Hecaton merges into staging every few minutes and the e2e job takes about
# 45 minutes on Tanjiro's one runner, so queued staging runs fell further behind with each merge. The workflow's own
# concurrency group is the workflow and the ref, and on staging a newer push cancels the queued and running run before
# it. An agent/** branch gets a group of its own run, so no run there is ever cancelled: hecaton's dispatcher waits on
# the checks of that exact SHA and reads a cancelled one as red. The per-job groups below still queue each ref's pushes
# in order. GitHub refuses `queue: max` beside `cancel-in-progress: true` in one block, so the two stay in separate
# blocks.
name: verify-suites

on:
  push:
    branches:
      - 'agent/**'
      - staging

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref != 'refs/heads/staging' && format('-run-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/staging' }}

jobs:
  offline:
    name: offline suite (verify/run-tests.sh)
    runs-on: [self-hosted, Linux, X64, tanjiro]
    timeout-minutes: 60
    # One per ref; a later push waits its turn (queue: max holds up to 100). Nothing here cancels a job; on staging
    # the workflow's group above cancels the whole superseded run.
    concurrency:
      group: verify-suites-offline-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      # Actions pinned to commit SHAs, not tags, as in plan-policy.yml (#200).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Clean the workspace of everything git does not track
        run: |
          set -euo pipefail
          git clean -ffdx
          git submodule foreach --recursive 'git clean -ffdx && git reset --hard'

      # The runner's artifact cache (verify/artifact_cache.py, #1117), $RUNNER_TOOL_CACHE/wib-artifacts, outside the
      # workspace, so the clean step never removes it and it outlives the job (#1123). The script refuses a path inside
      # the workspace or a checkout. Set in a step, not in the job's env: the runner context is not available there,
      # and a job env naming it failed the whole workflow file (Actions run 42427273324).
      - name: WIB_ARTIFACT_CACHE, the runner's artifact cache outside the workspace
        run: bash verify/ci-artifact-cache.sh

      # uv 0.13.7 (latest, 2026-11-07) brings Python 3.13; the suite's only package beyond the standard library is
      # PyYAML. verify/package_cache.py installs the wheel verify/python.lock pins, served from the host artifact cache
      # by its SHA-256 and installed offline with --require-hashes, so a warm runner fetches no package (#1121).
      # uv itself comes from the same cache by its SHA-256 (#1331): the setup action it replaces was downloaded again
      # for every job, before any step, and on Tanjiro's link that download timed out and failed the job.
      - name: uv 0.13.7 from the runner's artifact cache
        run: bash verify/ci-uv.sh

      - name: Python 3.13 with PyYAML first on PATH
        run: |
          set -euo pipefail
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" verify/package_cache.py install pyyaml --python "$RUNNER_TEMP/venv/bin/python"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: HECATON_BASE_SHA, the merge base with origin/staging, or the newest green staging ancestor
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash verify/ci-base-sha.sh

      - name: bash verify/run-tests.sh
        run: bash verify/run-tests.sh

  e2e-tools:
    name: e2e tools suite (verify/run-e2e-tools.sh)
    runs-on: [self-hosted, Linux, X64, tanjiro]
    # run-e2e-tools.sh runs the offline suite first, then the tier; on netcup it took 36 to 73 minutes.
    timeout-minutes: 150
    # The tier's cause-comment tests read issues through verify/gh_comments.py, which needs gh with a token and never
    # reads anonymously (#863). Tanjiro has gh (hecaton deploy/tanjiro/tools.sh) and no login for the runner user, so
    # the job hands gh this run's own token, with read access to issues added to contents: read (#1047). The token
    # expires with the job, and gh reads the other public repo's issue (guard-proxy-agenticburn#63) with it too. A
    # job's permissions replace the workflow's, so actions: read, which the base step reads staging's runs with
    # (#1195), is named here again.
    permissions:
      contents: read
      issues: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    concurrency:
      group: verify-suites-e2e-tools-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Clean the workspace of everything git does not track
        run: |
          set -euo pipefail
          git clean -ffdx
          git submodule foreach --recursive 'git clean -ffdx && git reset --hard'

      # The runner's artifact cache (verify/artifact_cache.py, #1117), $RUNNER_TOOL_CACHE/wib-artifacts, outside the
      # workspace, so the clean step never removes it and it outlives the job (#1123). The script refuses a path inside
      # the workspace or a checkout. Set in a step, not in the job's env: the runner context is not available there,
      # and a job env naming it failed the whole workflow file (Actions run 42427273324).
      - name: WIB_ARTIFACT_CACHE, the runner's artifact cache outside the workspace
        run: bash verify/ci-artifact-cache.sh

      # uv from the runner's artifact cache by its SHA-256, as in the offline job (#1331).
      - name: uv 0.13.7 from the runner's artifact cache
        run: bash verify/ci-uv.sh

      - name: Python 3.13 with PyYAML first on PATH
        run: |
          set -euo pipefail
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" verify/package_cache.py install pyyaml --python "$RUNNER_TEMP/venv/bin/python"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: HECATON_BASE_SHA, the merge base with origin/staging, or the newest green staging ancestor
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash verify/ci-base-sha.sh

      # The suite's scratch goes in the job's temp directory, which the runner empties for each job. Unset, TMPDIR
      # would be the checkout's tmp/, 119 bytes on Tanjiro, and a Terraform provider's socket there passes Linux's
      # 107-byte limit on a socket path, so no provider starts (#1313); run-e2e-tools.sh refuses a TMPDIR over 90.
      # Set through GITHUB_ENV, since the suite's own step takes no env.
      - name: TMPDIR, the job's temp directory, short enough for a provider's socket
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # When the push touches what a tier test reads, run-e2e-tools.sh runs the offline suite and the tier inside the
      # wib-e2e-tools image (#1188), through verify/e2e-image.sh and the runner user's podman, and fetches no binary;
      # with no image on the host and none pullable, it fails naming the image. A push no tier test reads runs the
      # offline suite here alone and pulls nothing. The job installs no Node and unpacks no Chromium libraries
      # (#1359): the image holds Node and Playwright's Chromium, and the offline suite needs neither.
      - name: bash verify/run-e2e-tools.sh
        run: bash verify/run-e2e-tools.sh
