# ABOUTME: Weaver span-group contract for the guard-proxy spans (PRD #20 M6 / #22 M1, M3).
# ABOUTME: The HTTP SERVER hop, the gen_ai "sanitize" and "chat" INTERNAL spans, ref'd to OTel semconv v1.41.1.
#
# This is the source of truth for what guard-proxy/proxy.py emits. `weaver registry check` resolves every
# ref against the pinned upstream registry (manifest.yaml -> otel v1.41.1); a typo or a renamed upstream
# attribute fails the check in CI. `weaver live-check` (docs/weaver-live-check.md) then compares real
# telemetry from the running proxy against this same contract. Keep these groups in lockstep with the
# set_attribute(...) and _stamp(...) calls in proxy.py; verify/test_weaver_guard_proxy_stamps.py holds the
# server span's _stamp attributes and witb.guard.decision's members to proxy.py offline (#710).
groups:
  # --- The inbound HTTP hop. agentgateway -> guard-proxy, joined to the upstream trace via W3C context. ---
  - id: span.witb.guard_proxy.http
    type: span
    span_kind: server
    stability: development
    brief: >-
      The guard-proxy HTTP SERVER span (`POST <path>`). Emitted by proxy.py do_POST after extracting the
      upstream W3C context, so the guard hop appears in the agentgateway -> agent waterfall.
    attributes:
      - ref: http.request.method
        requirement_level: required
        note: Always "POST" for the A2A JSON-RPC path the proxy guards.
      - ref: url.path
        requirement_level: recommended
        note: The request path (e.g. the A2A endpoint or "/toggle"); set from self.path.
      - ref: url.scheme
        requirement_level: recommended
        note: >-
          Part of the HTTP SERVER contract (PRD #22 M3). proxy.py does not currently set it (the scheme is
          implied http for the in-cluster A2A hop); declared Recommended so the contract stays complete and
          a future emit conforms. Recommended-and-absent is not a live-check violation.
      - ref: http.response.status_code
        requirement_level: required
        note: Set by _send at every exit (200 pass, 403 block, 502 upstream failure).
      - ref: session.id
        requirement_level:
          conditionally_required: When the /chat request body carries a string `session`.
        note: >-
          The storefront's per-browser-session id, set by proxy.py's _stamp on the /chat root, so a dashboard
          can join one browser session's traces. A blocked turn ends before any agent span exists, so this
          span is the only place the session is recorded for it.
      - ref: witb.guard.decision
        requirement_level:
          conditionally_required: When a guard blocked or rewrote the turn.
        note: Absent on a turn no guard touched. Set by proxy.py's _stamp.

  # --- Attributes the watch-it-burn proxy defines itself (no upstream semconv equivalent). ---
  - id: registry.witb.guard
    type: attribute_group
    stability: development
    brief: Attributes guard-proxy sets to name which guardrail decided a /chat turn.
    attributes:
      - id: witb.guard.decision
        type:
          members:
            - id: input_blocklist
              value: input_blocklist
              brief: The input guard's blocklist refused the prompt.
              stability: development
            - id: input_classifier
              value: input_classifier
              brief: The input guard's prompt-injection classifier refused the prompt.
              stability: development
            - id: topic
              value: topic
              brief: The topic guard refused a prompt outside BurritoBot's subject.
              stability: development
            - id: rate_limit
              value: rate_limit
              brief: A rate limit refused the turn, the per-session one or the proxy-wide one.
              stability: development
            - id: budget
              value: budget
              brief: The Challenge 4 budget guard refused the turn, this session's spend having passed its cap.
              stability: development
            - id: cost_cap
              value: cost_cap
              brief: The cluster-wide cost cap refused the turn, the backstop every conversation shares (the finale cap).
              stability: development
            - id: output_redacted
              value: output_redacted
              brief: The output guard redacted or withheld the agent's reply.
              stability: development
        stability: development
        brief: Which guardrail decided the turn, on the guard-proxy HTTP SERVER span.
        examples: [input_classifier, output_redacted]

  # --- The guard decision + forward, modelled as a gen_ai "chat" span so Datadog renders the LLM panel. ---
  #
  # LIVE-CHECK ACCEPTANCE (PRD #22 M3, manual step, NOT a CI gate): to validate that the opt-in
  # gen_ai.input/output.messages are actually present and conform to schema on a running proxy, run a beat
  # against a cluster with guard-proxy armed for content capture
  # (OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=SPAN_ONLY), capture the sanitize span, and run
  # `weaver registry live-check --registry weaver/registry/ --input-source <spans.json> --input-format json`.
  # See docs/weaver-live-check.md for the exact sample-telemetry format and the pass/fail semantics.
  - id: span.witb.guard_proxy.sanitize
    type: span
    span_kind: internal
    stability: development
    brief: >-
      The guard-proxy `sanitize` INTERNAL span. Wraps the block-or-pass decision and the forward.
      gen_ai.operation.name is fixed to "chat" so Datadog LLM Observability classifies it as an llm-kind
      span and renders the before/after message panel. The proxy forwards the prompt UNCHANGED, so the
      input (original) and output (forwarded) messages are equal here; the re-leak redaction is the
      Collector OTTL Act-2 step (PRD #22 M2), not in-proxy.
    attributes:
      - ref: gen_ai.operation.name
        requirement_level: required
        note: >-
          Fixed to the "chat" enum member. This is the classification signal Datadog uses to treat the
          span as an LLM operation; it is NOT "sanitize" (that is the span NAME, not the operation).
      - ref: gen_ai.input.messages
        requirement_level: opt_in
        note: >-
          The original inbound prompt as a single OTel GenAI message envelope, emitted as a JSON string
          ([{role:user, parts:[{type:text, content:...}]}]). OPT-IN: only present when content capture is
          armed (OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT in SPAN_ONLY/EVENT_ONLY/SPAN_AND_EVENT).
          This is the attribute the Act-2 OTTL processor (PRD #22 M2) replaces with [DEMO-REDACTED].
      - ref: gen_ai.output.messages
        requirement_level: opt_in
        note: >-
          The forwarded prompt, emitted as a JSON string. Equal to gen_ai.input.messages because the proxy
          forwards unchanged. Same opt-in content-capture gating as the input messages.

  # --- The storefront turn's model-call wrapper: /chat's "chat" INTERNAL span (proxy.py _handle_chat). ---
  #
  # Datadog's Agent Observability maps gen_ai.operation.name "chat" to an llm span and reads its token counts from
  # gen_ai.usage.input_tokens / gen_ai.usage.output_tokens (docs.datadoghq.com/llm_observability/instrumentation/
  # otel_instrumentation, read 2026-11-03). Those two are the GenAI attributes #784 adopts on guard-proxy; they are in
  # semconv v1.37 and v1.41.1 alike. The pinned proxy.py (fb6e2bf) does not set them yet; the guard-proxy-agenticburn
  # change #784 asks for does, from kagent_usage_metadata, and a repin brings it here. Agent Observability's copy
  # (#746) drops this span (filter/llmobs_one_root in gitops/otel-collector/values.yaml), so the counts are APM's to
  # show and never add to kagent's generate_content counts, which are the ones Agent Observability prices.
  - id: span.witb.guard_proxy.chat
    type: span
    span_kind: internal
    stability: development
    brief: >-
      The guard-proxy `chat` INTERNAL span the storefront's POST /chat wraps around the forward to the agent. It
      carries the student's prompt and the bot's final reply, and the turn's token counts.
    attributes:
      - ref: gen_ai.operation.name
        requirement_level: required
        note: Fixed to the "chat" enum member, so Datadog classifies the span as an llm span.
      - ref: gen_ai.request.model
        requirement_level: required
        note: The Bedrock model id the agent calls (MODEL_NAME, or the tier's full id).
      - ref: gen_ai.provider.name
        requirement_level: recommended
        note: >-
          aws.bedrock. Stamped by the collector's transform/set_genai_provider on every span with an operation
          name, not by proxy.py.
      - ref: gen_ai.input.messages
        requirement_level: opt_in
        note: The student's prompt as one user message, JSON. Same content-capture gating as the sanitize span.
      - ref: gen_ai.output.messages
        requirement_level: opt_in
        note: The bot's final reply as one assistant message, JSON. Same content-capture gating.
      - ref: gen_ai.usage.input_tokens
        requirement_level: recommended
        note: >-
          The turn's input tokens, summed from the agent's kagent_usage_metadata (promptTokenCount). Absent on the
          pinned proxy.py (fb6e2bf) until the guard-proxy-agenticburn change #784 asks for is repinned.
      - ref: gen_ai.usage.output_tokens
        requirement_level: recommended
        note: >-
          The turn's output tokens (candidatesTokenCount), as above.

  # --- The outbound CLIENT hop. guard-proxy -> agentgateway (the next hop fronting the kagent agent). ---
  #
  # Emitted by proxy.py inside the forward call (PRD #27 M2). peer.service names the downstream node so the
  # Datadog Service Map draws the guard-proxy -> agentgateway edge. peer.service is derived from AGENT_URL's
  # host in code, so it reduces to "agentgateway" exactly when AGENT_URL fronts agentgateway (the target
  # topology); until agentgateway is deployed it names the real next hop (the kagent agent) instead.
  - id: span.witb.guard_proxy.egress
    type: span
    span_kind: client
    stability: development
    brief: >-
      The guard-proxy outbound CLIENT span (`agent.forward`). Wraps the HTTP POST that forwards the guarded
      A2A request to the next hop (agentgateway in the target topology). Creates the guard-proxy -> next-hop
      edge in the Datadog Service Map via peer.service.
    attributes:
      - ref: http.request.method
        requirement_level: required
        note: Always "POST" for the A2A JSON-RPC forward.
      - ref: url.full
        requirement_level: required
        note: The full forward URL (AGENT_URL + request path); set from the proxy's outbound request.
      - ref: http.response.status_code
        requirement_level: required
        note: >-
          The downstream response status on success; on a connection-level forward failure it is absent
          (the span instead carries error.type and an ERROR status), so this is required-on-success.
      - ref: peer.service
        requirement_level: required
        note: >-
          The logical name of the downstream service ("agentgateway" in the target topology). This is the
          Service Map edge signal; defined in the upstream OTel semconv registry (resolved via the
          manifest.yaml dependency), no local definition needed. Deprecated from semconv v1.38 (renamed to
          service.peer.name) and kept on purpose: Datadog's service map reads peer.service, and Datadog documents
          no mapping for service.peer.name (#784).
