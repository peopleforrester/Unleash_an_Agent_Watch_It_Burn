nodeLinker: node-modules
npmMinimalAgeGate: 3d
npmPreapprovedPackages:
  - '@backstage/*'

yarnPath: .yarn/releases/yarn-4.13.0.cjs

# Yarn 4 hashes no platform-conditional package (a native binary such as @esbuild/linux-x64). This plugin fails every
# install in the app before the link step when one of those differs from yarn-plugins/conditional-checksums.lock
# (#1167, #1245).
plugins:
  - path: yarn-plugins/conditional-checksums.cjs
