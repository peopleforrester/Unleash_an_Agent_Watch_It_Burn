# ABOUTME: The fleet monitors in the INSTRUCTOR Datadog org, one alert group per kube_cluster_name (#267).
# ABOUTME: Applied by infra/datadog-fleet/fleet_monitors.py (dry run by default); never edited in the UI.
#
# Why the instructor org. Since #242 every attendee and presenter cluster dual-ships its metrics, logs,
# traces and Kubernetes events to the instructor org, and instructor clusters ship there natively, so this
# org is the one place that can answer "is cluster 37 alive" for the whole room. The per-attendee orgs only
# ever see one cluster each and get none of this.
#
# Every query is filtered to kube_cluster_name:watch-it-burn-* and grouped by kube_cluster_name, so each
# cluster alerts on its own and a dead cluster is named in the alert rather than averaged into the room.
# The bare "watch-it-burn" name (the DatadogAgent literal a cluster reports before its cluster-identity
# ConfigMap exists) is deliberately outside the filter: it is not a cluster anybody can be sent to.
#
# Where each signal comes from, so a renamed metric is found here and not on the day:
#   datadog.agent.running            the node Agent's heartbeat; kube_cluster_name is a host tag from
#                                    DD_CLUSTER_NAME (gitops/manifests/datadog/datadog-agent.yaml).
#   kubernetes_state.*               kube-state-metrics core, on by default in the DatadogAgent CR.
#   traces.span.metrics.calls        the collector's span_metrics connector; the metrics pipeline's
#                                    resource processor stamps k8s.cluster.name, which the Datadog exporter
#                                    maps to kube_cluster_name (gitops/otel-collector/values.yaml).
#   guard-proxy logs, status:error   guard-proxy logs JSON with "level", which Datadog maps to status;
#                                    every forward failure is log.error(..., event=forward_error).
#
# A key is the monitor's identity across applies: the script finds the live monitor by the tag
# wib-monitor:<key> and updates it in place, so renaming a monitor here never duplicates it. A monitor
# removed from this file is deleted from the org on the next apply.
#
# session: true marks a monitor that only means something while students are at their keyboards. Outside
# the declared session window the script mutes it with a downtime (see fleet_monitors.py, --session).
cluster_filter: "kube_cluster_name:watch-it-burn-*"

monitors:
  - key: cluster-silent
    priority: 1
    name: "[WIB fleet] Cluster stopped reporting"
    type: metric alert
    query: "max(last_5m):max:datadog.agent.running{kube_cluster_name:watch-it-burn-*} by {kube_cluster_name} < 1"
    message: |
      {{#is_alert}}{{kube_cluster_name.name}}: the Datadog Agent heartbeat is at zero.{{/is_alert}}
      {{#is_no_data}}{{kube_cluster_name.name}} has sent nothing to the instructor org for 5 minutes. The node,
      the Agent or the whole cluster is gone; nothing else on this dashboard is trustworthy for it until this clears.{{/is_no_data}}
      If the cluster was torn down on purpose, this fires once per cluster; resolve it from the monitor page.
    options:
      thresholds: { critical: 1 }
      notify_no_data: true
      no_data_timeframe: 5
      new_group_delay: 600
      require_full_window: false

  - key: console-unavailable
    priority: 1
    name: "[WIB fleet] Console Deployment unavailable"
    type: metric alert
    query: "max(last_5m):max:kubernetes_state.deployment.replicas_available{kube_cluster_name:watch-it-burn-*,kube_namespace:agent,kube_deployment:console} by {kube_cluster_name} < 1"
    message: |
      {{kube_cluster_name.name}}: the console Deployment (namespace agent) has had no available replica for 5 minutes.
      The student's link serves a 502: no lab page, no BurritoBot, no terminal.
    options:
      thresholds: { critical: 1 }
      notify_no_data: false
      new_group_delay: 600
      require_full_window: false

  - key: burritobot-not-ready
    priority: 2
    name: "[WIB fleet] BurritoBot agent pod not ready"
    type: metric alert
    # kagent runs the Agent workshop-agent (gitops/ai-layer/resources.yaml) as a Deployment of the same name.
    query: "max(last_5m):max:kubernetes_state.deployment.replicas_available{kube_cluster_name:watch-it-burn-*,kube_namespace:agent,kube_deployment:workshop-agent} by {kube_cluster_name} < 1"
    message: |
      {{kube_cluster_name.name}}: the BurritoBot agent (kagent Agent workshop-agent, namespace agent) has had no ready pod for 5 minutes.
      The console loads but every chat fails.
    options:
      thresholds: { critical: 1 }
      notify_no_data: false
      new_group_delay: 600
      require_full_window: false

  - key: guard-proxy-erroring
    priority: 2
    name: "[WIB fleet] guard-proxy erroring"
    type: log alert
    query: 'logs("kube_cluster_name:watch-it-burn-* kube_namespace:agent kube_deployment:guard-proxy status:error").index("*").rollup("count").by("kube_cluster_name").last("5m") > 2'
    message: |
      {{kube_cluster_name.name}}: guard-proxy logged {{value}} errors in 5 minutes. A forward_error means the agent behind it
      did not answer, so the student sees "BurritoBot's kitchen isn't answering".
    options:
      thresholds: { critical: 2 }
      enable_logs_sample: true
      groupby_simple_monitor: false

  - key: node-not-ready
    priority: 2
    name: "[WIB fleet] Node NotReady"
    type: metric alert
    query: "max(last_5m):max:kubernetes_state.node.by_condition{kube_cluster_name:watch-it-burn-*,condition:ready,!status:true} by {kube_cluster_name} > 0"
    message: |
      {{kube_cluster_name.name}}: a node has reported Ready=false or Ready=unknown for 5 minutes. Pods on it stop being scheduled
      and its DaemonSets (the Datadog Agent among them) stop reporting.
    options:
      thresholds: { critical: 0 }
      notify_no_data: false
      new_group_delay: 600
      require_full_window: false

  - key: no-traces
    priority: 3
    session: true
    name: "[WIB fleet] No traces from a cluster for 10 minutes"
    type: metric alert
    query: "sum(last_10m):sum:traces.span.metrics.calls{kube_cluster_name:watch-it-burn-*} by {kube_cluster_name}.as_count() < 1"
    message: |
      {{kube_cluster_name.name}}: not one span has reached the collector in 10 minutes of the session.
      Either nobody is using this cluster (walk over and look) or the trace path is broken: BurritoBot uninstrumented
      (the OTel webhook raced the pod), the collector down, or the Datadog key dead.
    options:
      thresholds: { critical: 1 }
      notify_no_data: true
      no_data_timeframe: 10
      new_group_delay: 600
      require_full_window: false
