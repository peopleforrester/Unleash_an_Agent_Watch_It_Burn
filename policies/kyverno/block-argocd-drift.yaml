# ABOUTME: Beat-1 control. Blocks out-of-band mutation of ArgoCD-managed resources.
# ABOUTME: Enforce from the start (no toggle); ArgoCD self-heal is defense in depth.
# verify-at-build: confirmed approach against Kyverno v1.19.0 + Argo CD v3.4.3
# (the research spikes (removed 2026-08-30; recover with `git log --diff-filter=D -- research/`)). Background
# evaluation MUST be off: the excludes read request.userInfo, which only exists at admission.
#
# Kyverno CEL ValidatingPolicy (policies.kyverno.io/v1), migrated from the deprecated ClusterPolicy (#206).
# The ClusterPolicy's precondition and subject excludes are the matchConditions below: a request that fails
# any of them is not this policy's business, and every request that passes all of them is denied.
#
# The exclude block is load-bearing: denying every non-ArgoCD principal on UPDATE/DELETE
# would also block the built-in controllers (deployment/replicaset/garbage-collector) and
# kubelet from maintaining the managed object, breaking it. So system service accounts,
# nodes, and cluster admins are excluded; everything else (the agent, ad-hoc kubectl) is
# denied. This was corrected during live build on the test cluster (2026-06-17).
#
# [SPIKE] The excluded ArgoCD principal is the identity the controller acts as when it
# reconciles the managed resource. Each cluster runs its own in-cluster ArgoCD, so this is the
# local argocd-application-controller SA (confirmed on the test cluster); confirm per cluster in
# Phase 4b.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-argocd-drift
  annotations:
    policies.kyverno.io/title: Block ArgoCD Drift
    policies.kyverno.io/category: Workshop / Beat 1
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    # NO label selector here. An earlier `app.kubernetes.io/instance Exists` selector made this policy
    # INERT on these clusters: ArgoCD here uses ANNOTATION tracking (argocd.argoproj.io/tracking-id), not
    # label tracking, so managed resources never carry that label and the match never fired -- the agent
    # could freely drift guard-proxy etc. (caught live 2026-06-27 via a server dry-run patch as agent-sa,
    # which was ADMITTED). The argocd-managed matchCondition below is the correct, author-intended scoping:
    # it gates on the tracking-id annotation ArgoCD actually writes on every synced object.
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE", "DELETE"]
        resources: ["deployments"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE", "DELETE"]
        resources: ["configmaps", "services"]
  matchConditions:
    # Scope the block to resources ArgoCD ACTUALLY manages: those carry the
    # `argocd.argoproj.io/tracking-id` annotation (ArgoCD writes it on every synced object).
    # ArgoCD's OWN install components (argocd-server, repo-server, etc.) do NOT carry it -- they
    # are Helm-installed by the bootstrap, not synced by an Application, so they are not "drift"
    # and must remain configurable (e.g. the Datadog Autodiscovery annotation). Without this the
    # broad app.kubernetes.io/instance selector wrongly treated ArgoCD's own pods as managed.
    # Verified live 2026-06-25: managed resources carry the annotation, argocd-server does not.
    # Both UPDATE and DELETE carry the stored object as oldObject, so an UPDATE that strips the annotation
    # is still caught. Only an UPDATE has a new object; on DELETE Kyverno hands CEL an empty map, not
    # null, which is why this tests the operation rather than `object != null`.
    - name: argocd-managed
      expression: >-
        'argocd.argoproj.io/tracking-id' in oldObject.metadata.?annotations.orValue({}) ||
        (request.operation == 'UPDATE' &&
        'argocd.argoproj.io/tracking-id' in object.metadata.?annotations.orValue({}))
    # The ArgoCD controller owns these resources - it must be able to reconcile.
    - name: not-argocd-controller
      expression: >-
        request.userInfo.username != 'system:serviceaccount:argocd:argocd-application-controller'
    # The kagent controller owns the agent Deployments it generates from Agent CRs and must be
    # able to reconcile their pod spec (env, image). Those generated Deployments INHERIT the
    # Agent CR's argocd.argoproj.io/tracking-id annotation, so without this exclude the
    # controller's own UPDATE is wrongly treated as drift and blocked - which froze agent OTel
    # config (tracing/logging/content-capture could never propagate). Same rationale as the
    # ArgoCD controller exclusion above. The Beat-1 drift scenario is unaffected: the agent
    # attacks ArgoCD-managed apps as agent-sa / its own pod SA, never as kagent-controller.
    - name: not-kagent-controller
      expression: >-
        request.userInfo.username != 'system:serviceaccount:kagent:kagent-controller'
    # Built-in controllers and kubelet must keep the managed object healthy (kube-system service
    # accounts, nodes), and cluster admins can always intervene to fix things (system:masters).
    - name: not-system-or-admin
      expression: >-
        !request.userInfo.?groups.orValue([]).exists(g,
        g in ['system:serviceaccounts:kube-system', 'system:nodes', 'system:masters'])
  validations:
    - expression: "false"
      message: >-
        This resource is managed by ArgoCD. Change it in Git, not in the cluster.
        Direct mutation by a non-ArgoCD principal is rejected.
