# ABOUTME: Structural control on the AI plane's bypass (#490): a workload the agent creates in its own namespace
# ABOUTME: may not borrow a Bedrock identity, nor wear a label a NetworkPolicy trusts (egress or ingress).
#
# The bypass this closes. The agent (agent-sa, and workshop-mcp, which its tools run as) can create
# Pods and Deployments in `agent`. A pod it makes there can reach a model around every guard-proxy toggle by
# two routes, and deny-llm-endpoint-bypass sees neither, because neither needs an endpoint env var:
#
#   * Bedrock, over the in-VPC PrivateLink endpoint, with the AWS SDK's default regional hostname. The
#     egress allowlist has to let 10.0.0.0/16:443 through (workshop-agent and agentgateway call Bedrock on
#     that path), so the network cannot tell this pod from them. What it CAN be told apart by is identity:
#     Bedrock credentials come only from EKS Pod Identity, and only to the ServiceAccounts with an
#     association (infra/terraform/aws/cluster/main.tf). Creating a Pod needs no RBAC on the ServiceAccount
#     it names, so an agent that may create Pods may run one as agent-sa and inherit the agent's grant.
#   * A public API, with the SDK's default endpoint or one read from a ConfigMap or Secret. The egress
#     allowlist covers the whole namespace (#108), so an ordinary pod cannot get out. But NetworkPolicy
#     allows are additive, and platform-console-egress (gitops/ai-layer/resources.yaml) gives `egress: [{}]`
#     to any pod labelled app.kubernetes.io/name=console. A label is the creator's to choose.
#
# A third route ran through the platform's own pods (#552): agentgateway's :3002 bind signs Bedrock calls with
# its own credentials, and agentgateway :3000 and workshop-agent :8080 are the agent over A2A without
# guard-proxy's guards. gitops/ai-layer/chat-path-ingress.yaml now admits those ports only from the hop before
# them, by label: guard-proxy to agentgateway, agentgateway to workshop-agent, workshop-agent to agentgateway.
# Those labels are as forgeable as the console's, so they are refused the same way.
#
# So the rule is on who asks, which the API server authenticates and the agent cannot forge: a request from
# a ServiceAccount of the agent namespace may not create or change a pod (or, through autogen, a Deployment,
# StatefulSet, DaemonSet, ReplicaSet, Job or CronJob) that runs as a Bedrock-bound ServiceAccount or carries
# a label a NetworkPolicy selects. Nothing on the guarded path is caught by it: ArgoCD, the kagent controller
# and the kube controllers that create the real pods are not agent-namespace identities. web-terminal is the
# attendee's own terminal, not the agent's, and is left out on purpose.
#
# SHIPS AS DENY, unlike deny-llm-endpoint-bypass. That policy matches on pod content, so a wrong expression
# could have failed guard-proxy itself; this one matches only requests from the agent's identities, and no
# workload the agent legitimately makes (C2's villain Deployment included) runs as one of these accounts or
# carries one of these labels. A report of a bypass that already ran is not a control.
#
# Closed elsewhere: the shell the agent already has, workshop-mcp's run_shell, would hold the same credentials
# with no new pod if it ran as agent-sa. It runs as its own ServiceAccount, workshop-mcp, which is bound to
# the agent's Role and has no Pod Identity association (#553), so it is not in the list below.
#
# A fourth route ran around Challenge 8's scoped Role (#604, #606): it limits agent-sa's API read of Secrets to get
# on ceo-personal-record, but keeps create on pods, and the kubelet reads a mounted Secret with the node's
# credentials, so the creator's RBAC is never asked about the mount. A pod on the default ServiceAccount could
# mount terminal-auth, console-tls or llm-guard-auth and print it. So a workload the agent creates may reference
# no Secret but ceo-personal-record: not as a secret volume, a projected volume's secret source, an env
# secretKeyRef or an envFrom secretRef, in any container, init container or ephemeral container. That is the
# scoped Role's line drawn again at admission. Under the broad Role the agent reads every Secret through the API
# anyway, so the rule takes nothing from a challenge; no workload the agent legitimately makes mounts a Secret.
# imagePullSecrets is left alone: the kubelet uses it to pull, and the pod never sees it.
#
# Background evaluation is off: the rule reads request.userInfo, which exists only at admission.
#
# The two lists below are held to their sources by verify/test_agent_bypass_shapes.py: the Pod Identity
# associations in namespace `agent`, and every label a NetworkPolicy in `agent` selects on. Fixture cases
# run through the Kyverno CLI in verify/test_kyverno_cel_policies.py; the live shapes in
# verify/test_llm_bypass_live.py. readableSecrets is held to the scoped Role's resourceNames, and the Secret
# routes run through the Kyverno CLI, in verify/test_c8_pod_secret_mount.py.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-agent-spawned-workloads
  annotations:
    policies.kyverno.io/title: Restrict Agent-Spawned Workloads
    policies.kyverno.io/category: Workshop / AI plane
    policies.kyverno.io/description: >-
      A workload the agent creates in its own namespace may not run as a ServiceAccount that holds Bedrock
      credentials, and may not carry a label that a NetworkPolicy trusts. Either one lets the agent reach a
      model around guard-proxy. Nor may it mount or read through env any Secret but ceo-personal-record, the one
      the agent's scoped Role reads, because the kubelet resolves a mounted Secret with the node's credentials.
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - agent
  matchConditions:
    # The agent's identities: every ServiceAccount in its namespace but the attendee's terminal. Wider than
    # agent-sa alone, so a Role granted later to another agent-plane account is covered the day it lands.
    - name: requested-by-an-agent-namespace-identity
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:agent:') &&
        request.userInfo.username != 'system:serviceaccount:agent:web-terminal'
  variables:
    # The ServiceAccounts with an EKS Pod Identity association in namespace `agent`.
    - name: modelIdentities
      expression: "['agent-sa', 'agentgateway', 'web-terminal']"
    # Every label a NetworkPolicy in namespace `agent` selects pods on, with the values it matches: console for
    # platform-console-egress, the other three for chat-path-ingress (a peer it trusts, or a pod it guards).
    - name: egressLabels
      expression: "{'app.kubernetes.io/name': ['agentgateway', 'console', 'guard-proxy', 'workshop-agent']}"
    - name: labels
      expression: "object.metadata.?labels.orValue({})"
    # The one Secret c8-scoped-role.yaml lets agent-sa read (get, by name). Mounting it reads nothing more.
    - name: readableSecrets
      expression: "['ceo-personal-record']"
    - name: containers
      expression: >-
        object.spec.?containers.orValue([]) + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    # serviceAccount is the deprecated alias; the API server defaults one from the other, but read both.
    - expression: >-
        !(object.spec.?serviceAccountName.orValue('') in variables.modelIdentities) &&
        !(object.spec.?serviceAccount.orValue('') in variables.modelIdentities)
      message: >-
        A workload the agent creates may not run as a ServiceAccount that holds Bedrock credentials
        (agent-sa, agentgateway, web-terminal). That pod could call the model directly, around guard-proxy.
    - expression: >-
        !variables.egressLabels.exists(k, k in variables.labels && variables.labels[k] in variables.egressLabels[k])
      message: >-
        A workload the agent creates may not carry a label that a NetworkPolicy trusts
        (app.kubernetes.io/name=agentgateway, app.kubernetes.io/name=console, app.kubernetes.io/name=guard-proxy,
        app.kubernetes.io/name=workshop-agent). That pod could reach a public model API, agentgateway's model
        bind or the agent itself, around guard-proxy.
    - expression: >-
        !object.spec.?volumes.orValue([]).exists(v,
          (has(v.secret) && !(v.secret.?secretName.orValue('') in variables.readableSecrets)) ||
          (has(v.projected) && v.projected.?sources.orValue([]).exists(s,
            has(s.secret) && !(s.secret.?name.orValue('') in variables.readableSecrets))))
      message: >-
        A workload the agent creates may not mount a Secret other than ceo-personal-record, as a secret volume or a
        projected volume's secret source. The kubelet reads a mounted Secret with the node's credentials, so the pod
        would read a Secret the agent's Role does not let it read.
    - expression: >-
        !variables.containers.exists(c,
          c.?env.orValue([]).exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) &&
            !(e.valueFrom.secretKeyRef.?name.orValue('') in variables.readableSecrets)) ||
          c.?envFrom.orValue([]).exists(f, has(f.secretRef) &&
            !(f.secretRef.?name.orValue('') in variables.readableSecrets)))
      message: >-
        A workload the agent creates may not take an env var from a Secret other than ceo-personal-record, through
        secretKeyRef or envFrom secretRef. The kubelet resolves it with the node's credentials, so the pod would
        read a Secret the agent's Role does not let it read.
