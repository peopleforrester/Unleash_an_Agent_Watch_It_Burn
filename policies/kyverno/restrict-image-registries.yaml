# ABOUTME: Kyverno policy restricting container images to trusted registries.
# ABOUTME: Applies in the apps and agent namespaces; allows Harbor, ghcr.io, the agentgateway/kagent registries, registry.k8s.io, ECR,
# ABOUTME: and refuses lab-platform's promo/ path, where the C2 villains live, on whichever registry serves it.
#
# Kyverno's CEL ValidatingPolicy (policies.kyverno.io/v1), which replaced the deprecated kyverno.io/v1
# ClusterPolicy (#206). Written against Kyverno v1.19.0.
#
# The policy is written against Pods. Kyverno generates the matching rules for Deployments, StatefulSets,
# DaemonSets, ReplicaSets, Jobs and CronJobs on its own (autogen), so BurritoBot's deploy_app is refused
# at the Deployment, before any Pod exists, and the refusal names this policy.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Only allow images from trusted registries in the apps and agent namespaces.
spec:
  # Audit by default so an attendee cluster still DEPLOYS the villain image (C2 "watch it burn") until the
  # student flips this to Deny live, and fleet.sh flips it on an admin cluster at bootstrap
  # (toggle-kyverno-enforce.sh; ArgoCD ignoreDifferences on /spec/validationActions keeps the
  # flip from being self-healed).
  validationActions:
    - Audit
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - apps
            - agent # the ai-layer namespace where BurritoBot's deploy_app lands the C2 villain image
  variables:
    # Allow-list covers EVERY real ai-layer image in the agent namespace (ghcr.io/peopleforrester,
    # cr.agentgateway.dev, cr.kagent.dev) plus the apps registries.
    # Harbor images are additionally signature-checked by verify-image-signatures.
    # Docker Hub is not on it (#714): nothing this lab runs is pulled from there, so neither may the agent pull.
    - name: allowedRegistries
      expression: >-
        ['harbor.agenticburn.com/', 'ghcr.io/', 'cr.agentgateway.dev/', 'cr.kagent.dev/',
        'registry.k8s.io/']
    # ECR is any account in any region: <account>.dkr.ecr.<region>.amazonaws.com/<repo>.
    - name: ecr
      expression: "r'^[^/]+\\.dkr\\.ecr\\.[^/]+\\.amazonaws\\.com/'"
    # The C2 villains are lab-platform's promo/ images, ghcr.io/peopleforrester/lab-platform/promo/<villain>:v1
    # (#653): an allowed host and our own org, on a path nothing vetted. The lesson is the path, so the path is
    # refused wherever it appears, which also covers it pulled through an ECR cache
    # (<account>.dkr.ecr.<region>.amazonaws.com/<prefix>/peopleforrester/lab-platform/promo/...). The rest of
    # ghcr.io stays allowed: lab-platform's mirror/ copies and its web image run in these namespaces. festival-ops/ is
    # this repo's own unvetted path, where Challenge 3's page-serving Joker lives (#671).
    - name: refusedPaths
      expression: "['/peopleforrester/lab-platform/promo/', '/peopleforrester/festival-ops/']"
    - name: imageAllowed
      expression: >-
        object.spec.containers.all(c,
        (variables.allowedRegistries.exists(r, c.image.startsWith(r)) || c.image.matches(variables.ecr))
        && !variables.refusedPaths.exists(p, c.image.contains(p)))
    # An UPDATE to a Pod that was already in violation is let through, so turning this to Deny never
    # wedges a workload that predates the flip. A compliant Pod still cannot be updated into violation.
    - name: alreadyViolating
      expression: >-
        request.?operation.orValue('') == 'UPDATE' && !oldObject.spec.containers.all(c,
        (variables.allowedRegistries.exists(r, c.image.startsWith(r)) || c.image.matches(variables.ecr))
        && !variables.refusedPaths.exists(p, c.image.contains(p)))
  validations:
    - expression: "variables.imageAllowed || variables.alreadyViolating"
      message: >-
        Images must come from allowed registries:
        the internal Harbor, ghcr.io, cr.agentgateway.dev, cr.kagent.dev,
        registry.k8s.io, or ECR, and not from the lab-platform/promo/ or festival-ops/ paths.
