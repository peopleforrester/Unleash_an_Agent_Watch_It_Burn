# ABOUTME: Kyverno policy requiring readiness and liveness probes.
# ABOUTME: Enforced only in apps namespace for production-ready workloads.
#
# Kyverno CEL ValidatingPolicy (policies.kyverno.io/v1), migrated from the deprecated ClusterPolicy (#206).
# The two ClusterPolicy rules are the two validations below, each with its original message.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Require readiness and liveness probes on all containers in apps namespace.
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - apps
  variables:
    - name: isUpdate
      expression: "request.?operation.orValue('') == 'UPDATE'"
  validations:
    # Each also passes when the Pod being updated already lacked the probe (pre-existing violation).
    - expression: >-
        object.spec.containers.all(c, has(c.readinessProbe)) ||
        (variables.isUpdate && !oldObject.spec.containers.all(c, has(c.readinessProbe)))
      message: "A readinessProbe is required for all containers in apps namespace."
    - expression: >-
        object.spec.containers.all(c, has(c.livenessProbe)) ||
        (variables.isUpdate && !oldObject.spec.containers.all(c, has(c.livenessProbe)))
      message: "A livenessProbe is required for all containers in apps namespace."
