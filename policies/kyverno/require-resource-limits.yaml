# ABOUTME: Beat-1 target policy. Requires CPU+memory limits on pods.
# ABOUTME: Starts in Audit (admits + reports); the beat-1 toggle flips it to Deny.
#
# Kyverno's CEL ValidatingPolicy (policies.kyverno.io/v1), which replaced the deprecated kyverno.io/v1
# ClusterPolicy (#206). Written against Kyverno v1.19.0. The action is the policy-level
# spec.validationActions list; the beat-1 toggle (challenges/01-cncf-wall/toggle-kyverno-enforce.sh)
# replaces /spec/validationActions, ["Audit"] <-> ["Deny"].
#
# Written against Pods; Kyverno generates the Deployment/StatefulSet/DaemonSet/ReplicaSet/Job/CronJob
# rules itself (autogen), which is what makes `kubectl create deployment` fail at the Deployment in Beat 1.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Workshop / Beat 1
spec:
  validationActions:
    - Audit
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  # KubeArmor's workloads are judged at their Pods, not at the Job, DaemonSet, Deployment or ReplicaSet (#1236).
  # The operator builds them with no limits, and KubeArmorConfig has no field to give them any. #1081's LimitRange
  # (gitops/kubearmor-config/templates/limitrange.yaml) fills defaults into every Pod in the kubearmor namespace,
  # but a LimitRange touches Pods only, and autogen judges the workload object's pod template, so with this policy at
  # Deny the operator's per-node snitch Job was refused before any Pod existed. The snitch is what puts the
  # kubearmor.io/* labels the enforcer DaemonSet selects on, so a new node on watch-it-burn-private got no enforcer
  # (2026-11-08, #1042, run 18828). The Pods there are still judged by this policy, with the LimitRange's limits.
  # Autogen copies matchConditions into the rules it generates, so the one condition covers both sides: a workload
  # object in kubearmor is skipped, and a Pod there is not.
  matchConditions:
    - name: kubearmor-workloads-judged-at-their-pods
      expression: "!(request.namespace == 'kubearmor' && request.kind.kind != 'Pod')"
  variables:
    - name: limitsSet
      expression: >-
        object.spec.containers.all(c,
        'memory' in c.?resources.?limits.orValue({}) && 'cpu' in c.?resources.?limits.orValue({}))
    # An UPDATE to a Pod that was already in violation is let through, so flipping to Deny never wedges a
    # platform workload that predates the flip. A compliant Pod still cannot be updated into violation.
    - name: alreadyViolating
      expression: >-
        request.?operation.orValue('') == 'UPDATE' && !oldObject.spec.containers.all(c,
        'memory' in c.?resources.?limits.orValue({}) && 'cpu' in c.?resources.?limits.orValue({}))
  validations:
    - expression: "variables.limitsSet || variables.alreadyViolating"
      message: >-
        CPU and memory resource limits are required on every container.
