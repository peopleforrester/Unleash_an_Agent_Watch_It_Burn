# ABOUTME: Kyverno policy auditing NetworkPolicy existence for deployments.
# ABOUTME: Audit mode only (not enforce) — informational check in apps namespace.
#
# Kyverno CEL ValidatingPolicy (policies.kyverno.io/v1), migrated from the deprecated ClusterPolicy (#206).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-networkpolicy
  annotations:
    policies.kyverno.io/title: Require NetworkPolicy
    policies.kyverno.io/category: Networking
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Audit whether deployments in apps namespace have associated NetworkPolicies.
spec:
  validationActions:
    - Audit
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - apps
  validations:
    - expression: "object.metadata.?labels.?app.orValue('') != ''"
      message: "A NetworkPolicy should exist for this application."
