# ABOUTME: Kyverno image-signature verification: every image from our own registry, and lab-platform's llm-guard
# ABOUTME: at ghcr.io or an ECR cache, must carry a cosign signature made with the key in policies/cosign/.
#
# This is Enforce, and it is scoped so that it can be. Two facts make that safe rather than reckless:
#
#   1. matchImageReferences names ONLY ghcr.io/peopleforrester/watch-it-burn*, Harbor, and lab-platform's
#      llm-guard image (at ghcr.io or an ECR pull-through cache). Third-party images the allowlist permits
#      (docker.io/library, cr.agentgateway.dev, the OTel autoinstrumentation image) do not match
#      this rule and are unaffected by it. Neither are lab-platform's other paths, the demo apps' web
#      image (#715) among them: see LAB-PLATFORM below.
#   2. All eight tags the manifests reference were signed and verified before this was flipped on, and
#      llm-guard's pinned digest verified under the Kyverno CLI before it was added (#669).
#      An unsigned image from our registry is now denied, which is the point.
#
# LAB-PLATFORM (#669)
#
# Since #652 the llm-guard Deployment runs ghcr.io/peopleforrester/lab-platform/llm-guard:v1 by digest,
# at whatever registry the root passes as imageRegistry, which may be an ECR pull-through cache
# (<account>.dkr.ecr.<region>.amazonaws.com/<prefix>/peopleforrester/lab-platform). lab-platform signs
# with this same workshop key (its deploy/images/cosign.pub is this key byte for byte, and its
# decisions.md entry "Images are signed with the workshop key" says why), so no second attestor is
# needed: the one below verifies it, offline, as it does ours.
#
# Only llm-guard is matched, not lab-platform/* (question 878). Kyverno's glob crosses the slash, so
# lab-platform/* would also catch the 14 vendor copies under lab-platform/mirror/ (Falco's sidekick and
# Talon, KubeArmor, the collectors, Grafana, Tempo, kagent's postgres), which carry no signature, and
# deny all of them. A further lab-platform image gets its own pattern once its signature is checked.
#
# WHY A KEY AND NOT KEYLESS
#
# The version of this file before this one carried a keyless attestor whose subject was the literal
# placeholder "https://github.com/<org>/<repo>/.github/workflows/*", while its own header claimed the
# policy started in Audit and its rule said Enforce. It could never have verified anything, and nothing
# failed only because no matching image was being admitted (#331).
#
# Keyless binds a signature to a CI identity, which is the better model when CI does the building. Six
# of our eight images are built by hand on netcup, so a keyless subject would name an identity that
# does not sign them.
#
# The load-bearing reason is Challenge 1. Attendees apply a default-deny egress NetworkPolicy, so any
# control that has to reach the internet at admission time AFTER that point is a control that stops
# working halfway through the workshop. Key-based verification needs only the registry, and the
# signature bundles carry an offline transparency-log inclusion proof, so ctlog.insecureIgnoreTlog below
# is what keeps this working on a cluster the students have just sealed. In Kyverno 1.19 a key attestor
# with the transparency log ignored skips Sigstore's TUF, Rekor and CT log entirely, so nothing at
# admission time needs the internet. Signatures ARE uploaded to the public Rekor log, because these
# are public images and the audit trail is worth having; admission simply does not depend on reaching it.
#
# Kyverno's CEL ImageValidatingPolicy (policies.kyverno.io/v1), which replaced the deprecated
# ClusterPolicy verifyImages rule (#206). Written against Kyverno v1.19.0. Like the ClusterPolicy it is
# written against Pods and Kyverno generates the Deployment/StatefulSet/etc. rules itself (autogen).
#
# Signing procedure and key custody: policies/cosign/README.md. Render gate: verify/test_image_signing.py.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/category: Supply Chain / CNCF
    policies.kyverno.io/description: >-
      Requires a valid cosign signature on every image from ghcr.io/peopleforrester/watch-it-burn and on
      lab-platform's llm-guard image, in any namespace. Verification is key-based and needs no Sigstore
      network access.
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  # Both registries we publish to, and lab-platform's llm-guard, under ONE key. Deliberately NOT
  # namespaced: an image of ours running in any namespace must be signed, so the control cannot be
  # sidestepped by deploying somewhere else. Only images matching these globs are verified; every other
  # image is left to restrict-image-registries.
  #
  # Harbor is here because the version of this policy before this one enforced signatures on
  # harbor.agenticburn.com and nothing else. Harbor is documented (infra/harbor/) and permitted by the
  # registry allowlist but deployed nowhere, which is why that rule never fired. Rescoping to ghcr alone
  # would have quietly dropped a requirement, so both are listed and both are signed with the key in
  # policies/cosign/. infra/harbor/sign-and-push.sh signs with that key too.
  matchImageReferences:
    - glob: "ghcr.io/peopleforrester/watch-it-burn*"
    - glob: "harbor.agenticburn.com/*"
    # lab-platform's llm-guard (#669), by tag or by digest, and the same path through an ECR pull-through
    # cache. The ':' and '@' keep a lookalike such as llm-guard-next out; the '*' before peopleforrester
    # takes the cache rule's prefix, or none. A cache serves the upstream manifest, so the digest and the
    # sha256-<digest>.sig tag Kyverno reads are the same there; that read through a real cache is still owed.
    - glob: "ghcr.io/peopleforrester/lab-platform/llm-guard:*"
    - glob: "ghcr.io/peopleforrester/lab-platform/llm-guard@*"
    - glob: "*.dkr.ecr.*.amazonaws.com/*peopleforrester/lab-platform/llm-guard:*"
    - glob: "*.dkr.ecr.*.amazonaws.com/*peopleforrester/lab-platform/llm-guard@*"
  validationConfigurations:
    required: true
    verifyDigest: true
    mutateDigest: true
  attestors:
    - name: workshopKey
      cosign:
        key:
          data: |-
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEY6GWxIIKvm+YJ5NBdShf0/tu5b12
            9xxmGEdvEIlFN+1+NN57nfI3u5Xi0k8ogOj2173Vzbvt+v9I2JnexTct5Q==
            -----END PUBLIC KEY-----
        ctlog:
          # The bundle carries its own inclusion proof, so this verifies offline, which a cluster running
          # Challenge 1's default-deny egress requires.
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers).all(image,
        verifyImageSignatures(image, [attestors.workshopKey]) > 0)
      message: >-
        Images from ghcr.io/peopleforrester/watch-it-burn and harbor.agenticburn.com, and lab-platform's
        llm-guard image, must carry a valid cosign signature made with the workshop key
        (policies/cosign/watch-it-burn.pub).
