# ABOUTME: Admission control for the AI plane: a pod in the agent namespace may not point itself at a
# ABOUTME: public LLM endpoint, which is how the guard-proxy gets routed around entirely.
#
# What it sees, and what it does not. Every AI guardrail in this workshop is a RUNTIME toggle on the path
# guard-proxy -> agentgateway -> kagent: input block-list, injection classifier, output scrubbing, MCP
# tool authorization. The agent, which by design can create Pods and Deployments in its namespace, can
# stand up a second pod that talks to a model off that path. This policy reports one shape of that pod:
# one that DECLARES a public model endpoint as a literal env value.
#
# It is a visibility signal, not the control (#490). A pod that bypasses the path needs no such env var:
#   * an SDK used with its default endpoint, which already is the public API;
#   * Bedrock over the in-VPC PrivateLink endpoint, with the AWS SDK's default regional hostname;
#   * the endpoint read from a ConfigMap or Secret through envFrom or valueFrom, which CEL here cannot
#     resolve.
# All three pass this policy. The structural controls are elsewhere:
#   * The network. agent-egress-allowlist selects EVERY pod in the namespace (#108), not just
#     workshop-agent, so a pod cannot reach a public API at all, however its endpoint is configured.
#     (The MCP servers' PyPI install at startup, which once kept it narrow, is baked into the image now.)
#     The one way past it is a label: platform-console-egress opens egress to a pod labelled
#     app.kubernetes.io/name=console.
#   * Identity. The network must let the in-VPC Bedrock endpoint through, because workshop-agent and
#     agentgateway call it there. A pod gets Bedrock credentials only through EKS Pod Identity, by running
#     as a ServiceAccount with an association (agent-sa, agentgateway, web-terminal).
# restrict-agent-spawned-workloads closes both: a workload the agent's identities create may not run as one
# of those ServiceAccounts, nor wear the console label. verify/test_llm_bypass_live.py exercises all three
# shapes above against it on a live cluster.
#
# SHIPS AS AUDIT, and is NOT flipped by the Beat-1 toggle. Two separate reasons, both deliberate:
#
#   * The Beat-1 toggle (challenges/01-cncf-wall/toggle-kyverno-enforce.sh) flips a fixed list of two
#     policies: require-resource-limits and restrict-image-registries. Those two ARE the CNCF wall the
#     beat demonstrates. This policy is a different concern, so adding it to that list would change what
#     the beat shows on stage.
#   * Enforce on an unvalidated policy can block a legitimate deploy. If the expression matched a pod on
#     the guarded path, guard-proxy itself would fail admission and the whole demo would be dead. Audit
#     reports the violation without that risk, which is the larger half of the value here anyway: the
#     bypass becomes visible in a policy report instead of invisible.
#
# Round 1 is unaffected either way; the burn profile ships no Kyverno at all, so this exists only on the
# rounds that claim to be guarded.
#
# TO PROMOTE TO ENFORCE: run verify/test_llm_bypass_live.py on a live cluster (it reads the PolicyReports of
# the running guard-proxy and agentgateway pods and needs a pass on each), then change validationActions
# here to Deny. Do not promote it blind.
#
# Kyverno CEL ValidatingPolicy (policies.kyverno.io/v1), migrated from the deprecated ClusterPolicy (#206).
# Two tests, one per question:
#   * verify/test_kyverno_cel_policies.py runs the expression through the Kyverno CLI on fixture requests.
#   * verify/test_llm_bypass_live.py (#333) creates pods of the bypass shape on a cluster and reads the
#     PolicyReport Kyverno writes for each. First run 2026-10-24 against Kyverno v1.19.1 (chart 3.9.1, the
#     version gitops/apps/kyverno.yaml deploys) on a local kube-apiserver 1.35.9 with the chart's own
#     controller args: a bare Pod and a Deployment's Pod each got `fail` with the message below, through
#     both the admission webhook and the background scan.
#
# No name exemption, on purpose (#333). This used to skip any pod whose name started with `guard-proxy` or
# `agentgateway`. The live run showed what that cost: a Deployment the agent names `guard-proxy-anything`
# gets pods that start with that prefix, and the API server names them BEFORE admission, so the bypass
# pod was skipped at admission and in the background scan, and no report recorded it at all. The
# exemption protected nothing either: neither guard-proxy nor agentgateway sets any of the env vars below
# (they reach the model through agentgateway and Bedrock), so both pass the expression as it stands.
#
# Pods only, deliberately: autogen is switched off below, as the ClusterPolicy this replaced never had
# Deployment rules. A Deployment is still caught, at the Pods its ReplicaSet creates; the live test proves
# that case on its own.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-llm-endpoint-bypass
  annotations:
    policies.kyverno.io/title: Deny Direct LLM Endpoint Bypass
    policies.kyverno.io/category: Workshop / AI plane
    policies.kyverno.io/description: >-
      Pods in the agent namespace must reach models through the guarded path, not by pointing an SDK at
      a public API. Catches the env vars the common SDKs read at construction time.
spec:
  validationActions:
    - Audit
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - agent
  variables:
    # Matches the env vars every mainstream SDK reads when constructed with no explicit base URL, which
    # is the shape that does not show up in a grep for an API call.
    - name: publicEndpoints
      expression: >-
        {'OPENAI_BASE_URL': ['api.openai.com', 'api.anthropic.com', 'generativelanguage.googleapis.com'],
        'ANTHROPIC_BASE_URL': ['api.anthropic.com'],
        'OPENAI_API_BASE': ['api.openai.com']}
  validations:
    # Init containers too: one runs to completion before the pod's own containers start, which is time
    # enough to call a model.
    - expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([])).all(c, !c.?env.orValue([]).exists(e,
        e.name in variables.publicEndpoints &&
        variables.publicEndpoints[e.name].exists(host, e.?value.orValue('').contains(host))))
      message: >-
        This pod sets an LLM endpoint pointing at a public API. Models must be reached through
        guard-proxy so the input guards, output scrubbing and cost metering apply. Remove the
        override, or route it at guard-proxy.
