# ABOUTME: Kyverno policy disallowing privileged containers.
# ABOUTME: Enforced only in apps namespace as defense-in-depth with PSS labels.
#
# Kyverno CEL ValidatingPolicy (policies.kyverno.io/v1), migrated from the deprecated ClusterPolicy (#206).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Disallow privileged containers in the apps namespace.
spec:
  validationActions:
    - Deny
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - apps
  variables:
    - name: unprivileged
      expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([])).all(c,
        !c.?securityContext.?privileged.orValue(false))
    # Pre-existing violations may still be updated; a compliant Pod cannot be updated into one.
    - name: alreadyViolating
      expression: >-
        request.?operation.orValue('') == 'UPDATE' &&
        !(oldObject.spec.containers + oldObject.spec.?initContainers.orValue([])).all(c,
        !c.?securityContext.?privileged.orValue(false))
  validations:
    - expression: "variables.unprivileged || variables.alreadyViolating"
      message: "Privileged containers are not allowed in the apps namespace."
