# ABOUTME: Attack-1 (exfil) control for the AGENT layer. Egress allowlist for the agent namespace:
# ABOUTME: in-VPC only (Bedrock via its PrivateLink endpoint + the kube-apiserver ENI). S3 PutObject
# ABOUTME: goes to the public internet, which has no allow here, so the agent's exfil is denied.
#
# This is the agent-namespace twin of apps-egress-allowlist.yaml. The AI layer (guard-proxy,
# agentgateway, kagent/workshop-agent, workshop-mcp) runs in `agent`, NOT `apps`, so the apps-only
# policies left agent egress wide open even under Round 2 — that was the C1 gap. Selecting agent pods
# with an Egress policy makes them default-deny-egress; the rules below are the only permitted egress.
#
# Bedrock reachability depends on the interface endpoint in infra/terraform/aws/network/main.tf
# (aws_vpc_endpoint.bedrock_runtime, private DNS on): the agent resolves
# bedrock-runtime.<region>.amazonaws.com to an in-VPC ENI (10.0.0.0/16), matched below on 443.
# CAVEAT: this control holds only while there is NO S3 gateway/interface endpoint in this VPC
# (see the terraform comment); an S3 endpoint would make S3 look in-VPC and defeat the CIDR allow.
#
# Companion egress allows (DNS, OTLP, intra-namespace) live in the sibling agent-*.yaml files; this
# file is egress-only and deliberately does not touch ingress to the agent layer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress-allowlist
  namespace: agent
spec:
  # COVERS THE WHOLE NAMESPACE, and that change is the point of issue #108.
  #
  # This used to select only `app.kubernetes.io/name: workshop-agent`, because the MCP servers installed
  # their SDK from PyPI at pod start and a namespace-wide deny stopped them binding (found live
  # 2026-06-26: agentgateway -> workshop-mcp "connection refused"). That narrowing quietly voided the
  # control it exists to provide.
  #
  # Challenge 1's exfil is NOT performed by the agent. The agent asks a tool, and the tool lives in
  # workshop-mcp, which is labelled `app=workshop-mcp` and matched none of these policies. Measured on
  # watch-it-burn-r2-1 2026-08-27: the beacon count moved 5 -> 6 on a GUARDED cluster, and from inside
  # the cluster the agent pod was blocked (curl exit 28) while the MCP pod reached the internet (200).
  # The control was real, enforced, and aimed at the wrong pod, so "same attack, now blocked" was false.
  #
  # An empty podSelector selects every pod in the namespace, which is now safe because the MCP servers
  # no longer need egress to start: their dependencies are baked into images/workshop-mcp. Removing the
  # runtime install is what made closing this possible, so do not reintroduce one.
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # In-VPC only: AWS VPC endpoints (Bedrock via PrivateLink) + the kube-apiserver ENI. NOT the
    # internet. cidr is the lab VPC CIDR (NOT 0.0.0.0/0). S3 has no endpoint, so it is not in here.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - { protocol: TCP, port: 443 }
    # The in-cluster Kubernetes API, reached on the SERVICE CIDR (kubernetes.default = 172.20.0.1 on
    # EKS), not the VPC CIDR. Easy to miss because "the apiserver is in the VPC" is true of the ENI and
    # false of the ClusterIP the pods actually dial.
    #
    # Required once this policy went namespace-wide: the ai-layer PreSync hook (kubearmor-gate) runs in
    # this namespace and calls the API to wait for the KubeArmor webhook. Without this allow it times
    # out, the hook fails, and ai-layer never syncs at all, so widening the deny silently froze the
    # whole layer rather than just blocking exfil. Caught on watch-it-burn-r2-1 2026-08-28.
    #
    # This does NOT reopen Challenge 1: the exfil target is a public host, and the service CIDR is
    # cluster-internal. It is the same in-cluster access the pods already have via their ServiceAccount.
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - { protocol: TCP, port: 443 }
    # EKS Pod Identity credentials endpoint (link-local, AWS_CONTAINER_CREDENTIALS_FULL_URI =
    # http://169.254.170.23/v1/credentials). The agent fetches its AWS creds here to call Bedrock; without
    # this allow the Bedrock call fails "Error retrieving credentials from container-role" (found live
    # 2026-06-26). Link-local node-local endpoint, not an internet path, so C1 still holds.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - { protocol: TCP, port: 80 }
