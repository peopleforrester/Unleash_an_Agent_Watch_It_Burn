# ABOUTME: Allow ingress to apps namespace from ALB and ingress controller.
# ABOUTME: Permits traffic from VPC CIDR (ALB target-type: ip) and kube-system on app ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: apps
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # ALB with target-type: ip sends traffic directly from VPC ENIs
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 5000
        # The party apps served on 80 when the console nginx (agent namespace, in-VPC) began proxying the
        # <app>-<cluster>.agenticburn.com hostnames to them (#233); without 80 here every party hostname on a
        # full-profile cluster timed out behind default-deny (2026-09-06). Since #715 they run lab-platform's
        # web image on 8080, above, behind the same Service port 80. 80 stays for a pod that still listens
        # there, such as games/villain-apps' villain-app.
        - protocol: TCP
          port: 80
    # Also allow from kube-system for internal ingress controller routing
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 5000
        # The party apps served on 80 when the console nginx (agent namespace, in-VPC) began proxying the
        # <app>-<cluster>.agenticburn.com hostnames to them (#233); without 80 here every party hostname on a
        # full-profile cluster timed out behind default-deny (2026-09-06). Since #715 they run lab-platform's
        # web image on 8080, above, behind the same Service port 80. 80 stays for a pod that still listens
        # there, such as games/villain-apps' villain-app.
        - protocol: TCP
          port: 80
