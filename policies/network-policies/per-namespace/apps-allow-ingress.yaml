# ABOUTME: Allow ingress to apps namespace from ALB and ingress controller.
# ABOUTME: Permits traffic from VPC CIDR (ALB target-type: ip) and kube-system on app ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: apps
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # ALB with target-type: ip sends traffic directly from VPC ENIs
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 5000
        # The party apps serve on 8080, the entry above, since they moved from nginx to lab-platform's web (#668).
        # The console (agent namespace, in-VPC) proxies the <app>-<cluster>.agenticburn.com hostnames to them
        # (#233); without their pod port here every party hostname timed out behind default-deny (2026-09-06,
        # when it was nginx's 80). Nothing in apps serves 80 now, so 80 is no longer admitted.
    # Also allow from kube-system for internal ingress controller routing
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 5000
        # The party apps serve on 8080, the entry above, since they moved from nginx to lab-platform's web (#668).
        # The console (agent namespace, in-VPC) proxies the <app>-<cluster>.agenticburn.com hostnames to them
        # (#233); without their pod port here every party hostname timed out behind default-deny (2026-09-06,
        # when it was nginx's 80). Nothing in apps serves 80 now, so 80 is no longer admitted.
