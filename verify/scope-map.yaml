bounds:
  verify/app_render.py:
    why: source_docs() and helm_render() read each gitops/bootstrap/apps Application source's path, REPO / src["path"], and each $values/ file it names (#1078)
    paths:
      - gitops
      - policies
      - backstage
      - observability-idp
      - security
  verify/bootstrap_chart.py:
    why: source_files() reads each Application source of this repo, REPO / source["path"]
    paths:
      - gitops
      - policies
      - backstage
      - observability-idp
      - security
  verify/collector_render.py:
    why: value_files() reads each $values/ file the collector Applications name
    paths:
      - gitops/otel-collector
  verify/git_mirror.py:
    why: submodules() reads .gitmodules and each gitlink of this tree; its other git calls read a mirror or a submodule
    paths:
      - .gitmodules
      - gitops/ai-layer/guard-proxy
      - images/llm-guard
  verify/sister_tree.py:
    why: its git calls clone the sister repo into a temporary directory and run ls-tree in that clone; it reads nothing of this tree (#1078)
    paths: []
  verify/test_bootstrap_chart_render.py:
    why: REPO / f"gitops/manifests/{n}" is built with kustomize for each demo-app-* the burn profile lists (#1078)
    paths:
      - gitops/manifests
  verify/test_datadog_log_services_render.py:
    why: render_app() reads each gitops/bootstrap/apps Application source's path, REPO / src["path"], and each $values/ file it names (#1078)
    paths:
      - gitops
      - policies
      - backstage
      - observability-idp
      - security
  verify/test_enforce_floor.py:
    why: it reads each gitops/bootstrap/apps Application source's path and each $values/ file it names, and REPO / "infra" / values for the two Helm releases infra/deploy-full-idp.sh installs outside Argo CD (#1078)
    paths:
      - gitops
      - policies
      - backstage
      - observability-idp
      - security
      - infra/argocd-values.yaml
      - infra/aws-load-balancer-controller-values.yaml
  verify/test_image_registry_render.py:
    why: chart_render() and source_render() read each gitops/bootstrap/apps Application source's path, REPO / src["path"], and each $values/ file it names (#1078)
    paths:
      - gitops
      - policies
      - backstage
      - observability-idp
      - security
  verify/test_kubearmor_config_render.py:
    why: REPO / config["path"] is the kubearmor Application's local chart source, the one whose path is gitops/kubearmor-config (#1078)
    paths:
      - gitops/kubearmor-config
  verify/test_platform_baseline.py:
    why: REPO / c["installed_by"] is each platform-baseline.yaml component's installed_by script (#1078)
    paths:
      - infra/deploy-full-idp.sh
