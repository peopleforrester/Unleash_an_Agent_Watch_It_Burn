# ABOUTME: The pinned linux/x86_64 binaries the cluster-free E2E tier fetches into verify/.tools (#572), each with
# ABOUTME: the SHA-256 the release publishes. Versions are VERSIONS.lock's or the deployed image's; a test holds that.
#
# One tool per line: name, version, SHA-256 of the downloaded file, URL, and the archive member that is the
# binary ("-" when the URL is the binary itself). Checked against each release's own checksum file on
# 2026-10-25: kyverno checksums.txt, conftest checksums.txt, terraform_1.15.6_SHA256SUMS, kubectl.sha256 and
# helm-v4.2.1-linux-amd64.tar.gz.sha256sum. otelcol-contrib (#647) is the collector image the three
# gitops/bootstrap/apps/otel-collector*.yaml files run, which VERSIONS.lock's otel-collector lines record since #666; its
# SHA-256 was checked against the release asset's published digest on 2026-10-29. ttyd (#770) is the terminal binary
# images/web-terminal/Dockerfile downloads, 1.7.7; its SHA-256 is the release's SHA256SUMS line for ttyd.x86_64, checked
# on 2026-11-02, and the same bytes as /usr/local/bin/ttyd in the web-terminal image gitops/ai-layer/resources.yaml pins.
# crane (#775) is go-containerregistry 0.22.1, the crane images/villains/build.sh pushes the Jokers with; its SHA-256 is
# the release's checksums.txt line for go-containerregistry_Linux_x86_64.tar.gz, checked on 2026-11-03. With it,
# verify/test_joker_build_digest.py rebuilds both Jokers and holds them to the digests images.lock pins.
# weaver (#782) is the version and SHA-256 .github/workflows/weaver-registry-check.yml pins, which
# test_weaver_registry_check.py runs in the tier, so the gate checks weaver/registry, the contract the Go guard-proxy
# generates its attribute keys from.
# agentgateway (#864) is the release binary of the gateway version gitops/ai-layer/agentgateway.yaml runs, v1.7.0;
# its SHA-256 is the release's agentgateway-linux-amd64.sha256, checked on 2026-11-05. The image's /app/agentgateway
# is a separate build of the same tag (other bytes, the same version), so the pin is the version, not the digest.
# test_agentgateway_tracing_e2e.py runs both gateway ConfigMaps on it.
# caddy (#986) is the Caddy the apex router image runs (apex-agenticburn's Dockerfile pins caddy:2-alpine by digest,
# Caddy v2.11.4); its SHA-256 is of the release's caddy_2.11.4_linux_amd64.tar.gz, whose SHA-512 matched the release's
# caddy_2.11.4_checksums.txt on 2026-11-06. verify/failover_drill.py runs the router's cluster leg on it, so a failover
# drill reloads the same router a promotion reloads on Railway.
