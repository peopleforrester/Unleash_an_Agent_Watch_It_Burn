# ABOUTME: Every fetch call site under verify/, .github/workflows/ and scripts/, by file, classed as a pinned artifact,
# ABOUTME: a live check, a loopback fetch or a line that runs none (#1116, part of #1115). verify/fetch_inventory.py reads it.
#
# verify/fetch_inventory.py scans each line of every file git tracks or would track under those three directories
# for the command families its PATTERNS name, and test_fetch_inventory.py fails, naming the file and line, on a line no
# entry here claims. An entry's `match` is a regular expression searched in the line; a line belongs to the first entry
# of its file that matches it, and `lines` is how many lines the entry claims, so a new call site always changes a count.
#
#   pinned    kind (tool, terraform-provider, helm-chart, browser, python-package, node-package, container-image,
#             git-commit, release-file, cache-fill), pin (the file holding the pin), cached (true when the fetch goes through the
#             host artifact cache of #1117 today)
#   live      kind (cluster, lab-endpoint, registry, saas-api, upstream-index, github, public-web), target
#   loopback  why: a server on 127.0.0.1, or a repository on this host, that the test made itself
#   none      why: the line names the command and runs none
#
# Drift on a file fails once the file was last changed under the inventory's rule; drift on a file last changed in a
# commit made before the inventory existed is named, not failed on, until a change touches that file again.
#
# A new fetch: run `python3 verify/fetch_inventory.py draft`, which prints a stub for each unclaimed line, class it and
# give it the right count. `python3 verify/fetch_inventory.py summary` prints the counts decisions.md's #1115 entry gives.
sites:
  .github/workflows/build-kyverno-counter-fix.yml:
  - match: setup-go
    lines: 1
    class: pinned
    kind: tool
    pin: .github/workflows/build-kyverno-counter-fix.yml (its go-version, and build.sh's GOTOOLCHAIN=go1.26.6)
    cached: false
  - match: pinned crane|\^crane|= crane \]|artifact-cache\.sh get
    lines: 4
    class: pinned
    kind: tool
    pin: verify/e2e-tools.lock (crane's row, fetched through artifact-cache.sh get)
    cached: true
  - match: 127\.0\.0\.1:5000/v2/
    lines: 2
    class: loopback
    why: crane's own registry on 127.0.0.1:5000, which the job starts
  - match: .
    lines: 3
    class: none
    why: 'a step name, a comment on where build.sh reads its bases and source (#1216), and the call that hands scripts/ghcr_version_tag.py a crane: build on loopback, whose fetches are classed there'
  .github/workflows/iam-policy.yml:
  - match: setup-python
    lines: 1
    class: pinned
    kind: tool
    pin: .github/workflows/iam-policy.yml (the action's commit and its python-version)
    cached: false
