# ABOUTME: Every fetch call site under verify/, .github/workflows/ and scripts/ (#1116, the first child of #1115),
# ABOUTME: classified: a pinned artifact (kind, pin file), an unpinned one, a live check (what it reaches), or no fetch.
#
# verify/fetch_inventory.py finds the sites: a line of a tracked file under those three directories that one of its
# PATTERNS matches (curl, wget, urlopen and http.client, the helm verbs that reach a repository and chart_fetch.pull,
# terraform init, pip and uv installs, npm and npx, playwright install, docker and podman pull, crane, git clone and
# submodule update, a workflow's `uses:`), comment lines left out. Each file below lists entries; `match` is a regular
# expression searched in the line, and a site takes the class of the first entry of its file that matches it.
# verify/test_fetch_inventory.py fails, naming file:line, on a site no entry covers, an entry with no class or a
# missing field, a pin that is no file, and an entry that matches no site. `python3 verify/fetch_inventory.py counts`
# prints the table decisions.md's #1115 entry gives.
#
#   pinned    kind (KINDS in fetch_inventory.py) and pin, the tracked file holding the version, digest or checksum
#   unpinned  kind and why: an artifact at a moving reference (a major tag, a `~>` range with no lock, no version)
#   live      service: our own service, a cluster, or an account's API, reached on purpose
#   none      why: the line names a fetch tool and fetches nothing (a stub, an assertion, a docstring, loopback)
#
# A new fetch needs an entry here in the same commit. #1115's later children move each pinned kind to the per-host
# cache, and its last child turns this inventory into the guard that a pinned fetch goes through that cache.
