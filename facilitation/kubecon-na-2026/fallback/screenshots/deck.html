<!doctype html>
<!-- ABOUTME: The worst-case screenshots deck for the KubeCon breakout (#452): opens from disk in any browser with
     ABOUTME: no network, and steps through the screenshots taken on the live clusters, segment by segment. -->
<!-- Open it straight from the checkout: file:///.../facilitation/kubecon-na-2026/fallback/screenshots/deck.html
     Right arrow, space or a click goes forward; left arrow goes back; F toggles full screen.
     The shot list below is written from ../assets.yaml (verify/test_replay_prompts.py checks they match). A shot
     that is not on disk shows as a red MISSING card naming the file, so a gap is seen in rehearsal, not on stage. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>BurritoBot Said Let's Dance, the Platform Said No: recorded fallback</title>
<style>
  html,body{margin:0;height:100%;background:#120d18;color:#f4ece4;font:20px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  #slide{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  #slide img{max-width:96vw;max-height:84vh;object-fit:contain;box-shadow:0 0 30px #000}
  #cap{margin-top:14px;font-size:24px;text-align:center;max-width:90vw}
  #seg{position:fixed;top:10px;left:16px;font-size:16px;opacity:.7}
  #num{position:fixed;bottom:10px;right:16px;font-size:16px;opacity:.7}
  .title h1{font-size:48px;margin:0 0 12px;text-align:center}
  .title p{opacity:.8;margin:4px;text-align:center}
  .missing{background:#7a1010;border:4px solid #ff5050;padding:40px 60px;font-size:28px;text-align:center}
</style>
</head>
<body>
<div id="seg"></div>
<div id="slide"></div>
<div id="num"></div>
<!-- Both lists are written from ../assets.yaml by `python3 scripts/check-fallback-assets.py --write-deck`. -->
<script type="application/json" id="segments">
{
  "1": "Opening and the rules of the room",
  "2": "Challenge 1, the CEO's secret",
  "3": "Challenge 2, the Kubernetes catch-all",
  "4": "Challenge 3, prompt injection through a support ticket",
  "5": "Challenge 4, the poisoned weather tool",
  "6": "The OWASP close, burritos only, and break it"
}
</script>
<script type="application/json" id="shots">
[
  {
    "segment": 1,
    "file": "screenshots/01-1-order.png",
    "caption": "The public bot, wide open: it answers as the burrito chain."
  },
  {
    "segment": 1,
    "file": "screenshots/01-2-off-topic-linked-list.png",
    "caption": "The room's off-topic ask, answered in full: a burrito bot reversing a linked list."
  },
  {
    "segment": 1,
    "file": "screenshots/01-3-prompt-wall.png",
    "caption": "The prompt wall: every prompt the room sends, from both clusters, without a name."
  },
  {
    "segment": 2,
    "file": "screenshots/02-1-ceo-address.png",
    "caption": "Challenge 1: the CEO's home address comes back in the chat."
  },
  {
    "segment": 3,
    "file": "screenshots/03-2-c3-recipe-read.png",
    "caption": "Challenge 2: the house recipe, read back out of a file on the box."
  },
  {
    "segment": 3,
    "file": "screenshots/03-3-c1-beacon-posted.png",
    "caption": "Challenge 2: the customer breakdown, posted to an outside webhook."
  },
  {
    "segment": 3,
    "file": "screenshots/03-5-ceo-forbidden.png",
    "caption": "After the switch, Challenge 1 again: the scoped Role keeps the CEO's record out of reach."
  },
  {
    "segment": 4,
    "file": "screenshots/04-1-hc666-joker.png",
    "caption": "Challenge 3: an innocent ticket question, and the ticket's hidden paragraph deploys a Joker."
  },
  {
    "segment": 4,
    "file": "screenshots/04-2-hc666-withheld.png",
    "caption": "guard-input-on: the ticket comes back withheld, and nothing is deployed."
  },
  {
    "segment": 5,
    "file": "screenshots/05-1-weather-chained.png",
    "caption": "Challenge 4: the weather tool's description chains in a tool nobody asked for."
  },
  {
    "segment": 5,
    "file": "screenshots/05-2-weather-mcp-guard.png",
    "caption": "guard-mcp-on: the gateway allows the weather tool and nothing else."
  },
  {
    "segment": 6,
    "file": "screenshots/06-1-burritos-only.png",
    "caption": "guard-topic-on: the off-topic ask comes back to the menu, the hours and the locations."
  }
]
</script>
<script>
(function(){
  var SEGMENTS=JSON.parse(document.getElementById('segments').textContent);
  var shots=JSON.parse(document.getElementById('shots').textContent);
  var slide=document.getElementById('slide'), seg=document.getElementById('seg'), num=document.getElementById('num');
  var i=0, total=shots.length+1;
  function text(tag,t,cls){var e=document.createElement(tag);e.textContent=t;if(cls)e.className=cls;return e;}
  function show(){
    slide.replaceChildren();
    num.textContent=(i+1)+' / '+total;
    if(i===0){
      seg.textContent='';
      var t=document.createElement('div');t.className='title';
      t.appendChild(text('h1',"BurritoBot Said Let's Dance, the Platform Said No"));
      t.appendChild(text('p','Captured on the live KubeCon clusters. Every screen here was live when it was taken.'));
      t.appendChild(text('p','Michael Forrester and Whitney Lee'));
      slide.appendChild(t);
      return;
    }
    var s=shots[i-1];
    seg.textContent='Segment '+s.segment+': '+(SEGMENTS[s.segment]||'');
    var img=new Image();
    img.alt=s.caption;
    img.onerror=function(){img.replaceWith(text('div','MISSING: '+s.file,'missing'));};
    img.src=s.file.replace(/^screenshots\//,'');
    slide.appendChild(img);
    slide.appendChild(text('div',s.caption,'')).id='cap';
  }
  function go(d){i=Math.max(0,Math.min(total-1,i+d));show();}
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);}
    else if(e.key==='Home'){i=0;show();}
    else if(e.key==='f'||e.key==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}
  });
  slide.addEventListener('click',function(){go(1);});
  show();
})();
</script>
</body>
</html>
