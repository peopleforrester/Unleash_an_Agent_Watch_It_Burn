# ABOUTME: The NetworkPolicy deltas that make the egress waypoint the only path to the public internet for the
# ABOUTME: agent namespace (#727), while leaving the stage-2 L3/L4 egress allowlist and the DNS allow intact.
#
# WHAT THIS CHANGES, AND WHAT IT LEAVES ALONE
# The stage-2 control set (policies/network-policies/per-namespace/agent-*.yaml, applied by the student in
# C1 stage 2 or managed by Argo CD on admin) stays as it is. In particular:
#   - agent-egress-allowlist (the L3/L4 allowlist: 10.0.0.0/16:443 for Bedrock over PrivateLink and the
#     apiserver, 172.20.0.0/16:443 for the service CIDR, 169.254.170.23/32:80 for Pod Identity) is NOT
#     touched. Bedrock keeps its in-VPC allow and does not pass through the waypoint.
#   - agent-allow-dns (UDP/TCP 53 to kube-system) is NOT touched. It already allows only the cluster
#     resolver, and floor C (resolver-lockdown.yaml) locks that resolver, so the allow already points at a
#     resolver that refuses arbitrary names.
#   - agent-allow-otel-egress, agent-allow-kagent-egress and agent-allow-intra-namespace are NOT touched;
#     none reaches a public host.
#
# The one companion the fix rewrites is the weather feed's egress. In stage 2 agent-allow-weather-feed-egress
# lets the weather-feed pod open TCP 443 to ANY address, because a NetworkPolicy cannot name a host. That
# broad allow is the last direct door to the public internet. The fix closes it: the weather feed reaches
# Open-Meteo only through the egress waypoint now (intra-namespace to the waypoint, already allowed by
# agent-allow-intra-namespace), and the waypoint is the one pod permitted a public 443, narrowed to the
# Open-Meteo hosts by the AuthorizationPolicy in egress-waypoint.yaml.
#
# Apply this together with resolver-lockdown.yaml and egress-waypoint.yaml. See README.md for order.
---
# Replaces the stage-2 agent-allow-weather-feed-egress: the weather feed no longer gets a direct public 443.
# Its traffic to Open-Meteo goes to the waypoint over the mesh (ambient captures it), and the waypoint
# egresses. Keeping the object name identical means `kubectl apply` updates the stage-2 policy in place.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-allow-weather-feed-egress
  namespace: agent
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: weather-feed }
  policyTypes: [Egress]
  # No public egress rule. The weather feed reaches Open-Meteo only through the waypoint, and the waypoint
  # is reached intra-namespace (agent-allow-intra-namespace). This object exists to REPLACE the stage-2
  # broad TCP-443-to-anywhere allow, so leaving egress empty here is the point: the direct door is shut.
  egress: []
---
# The egress waypoint is the single chokepoint allowed a public 443. It is an Istio-managed Deployment the
# Gateway (egress-waypoint.yaml) creates; its pods carry the Gateway API gateway-name label. The L7
# AuthorizationPolicy on the waypoint narrows what it actually connects to (the two Open-Meteo hosts), so
# this L3/L4 allow of 443-to-anywhere is safe: it is the waypoint, not a workload, and it admits only the
# allowlisted hostnames above L3/L4.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-allow-egress-waypoint
  namespace: agent
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
spec:
  podSelector:
    # The label Istio puts on a waypoint Deployment's pods for a Gateway named egress-waypoint. If the
    # pinned Istio uses istio.io/gateway-name instead, match that at build time (owed check, #728).
    matchLabels: { gateway.networking.k8s.io/gateway-name: egress-waypoint }
  policyTypes: [Egress]
  egress:
    # Public 443, for the allowlisted hosts the waypoint's AuthorizationPolicy admits.
    - ports: [{ protocol: TCP, port: 443 }]
    # DNS, so the waypoint can resolve the Open-Meteo hosts through the locked resolver.
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
