# ABOUTME: ClusterSecretStore connecting ESO to the in-cluster OpenBao (KV v2 at secret/), authenticated with
# ABOUTME: the per-cluster token infra/openbao-secrets.sh writes to platform/openbao-token. #394, question 656.
#
# This replaced a store pointed at AWS Secrets Manager that nothing read: on 2026-06-27 (32a30e2) the
# central ExternalSecrets were removed because the student accounts' Secrets Manager held none of the
# workshop's secrets, and Datadog's keys were written per cluster as plain Secrets instead. That commit
# kept the store and said "OpenBao remains the right post-event on-cluster secret store". This is that
# store. The keys still come from the provisioning box; they now land in OpenBao, and ESO writes
# datadog-secret from there (security/openbao/datadog-externalsecrets.yaml).
#
# The ESO controller runs in the platform namespace, which is the one namespace OpenBao's NetworkPolicy
# admits on 8200 (gitops/apps/openbao.yaml). The ESO Pod Identity association in
# infra/terraform/aws/cluster/main.tf is no longer used by this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-token
          namespace: platform
          key: token
