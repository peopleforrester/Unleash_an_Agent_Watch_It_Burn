# ABOUTME: The three ExternalSecrets that write datadog-secret into datadog, monitoring and security from the
# ABOUTME: OpenBao KV entry secret/datadog. Applied by infra/openbao-secrets.sh seed, never by Argo CD.
#
# Why these are not in an Argo CD Application. datadog-secret's presence is what switches Datadog on for a
# cluster (#500): a cluster with no Datadog key comes up without it, and the collector and falcosidekick
# start Datadog-free. If these lived in gitops, every keyless cluster would carry three ExternalSecrets
# stuck at SecretSyncedError, and an Application reporting Degraded for a state that is correct. So they
# are applied by the same step that puts the key into OpenBao, and only when there is a key, which keeps
# the switch where #500 put it: on the cluster.
#
# The names match what infra/reload-datadog-consumers.sh force-syncs (externalsecret/datadog-secret in each
# namespace). deletionPolicy Retain keeps a written Secret when the dev-mode OpenBao restarts empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog-secret
  namespace: datadog
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: datadog-secret, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - { secretKey: api-key, remoteRef: { key: datadog, property: api-key } }
    - { secretKey: app-key, remoteRef: { key: datadog, property: app-key } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: datadog-secret, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - { secretKey: api-key, remoteRef: { key: datadog, property: api-key } }
    - { secretKey: app-key, remoteRef: { key: datadog, property: app-key } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog-secret
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: datadog-secret, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - { secretKey: api-key, remoteRef: { key: datadog, property: api-key } }
    - { secretKey: app-key, remoteRef: { key: datadog, property: app-key } }
