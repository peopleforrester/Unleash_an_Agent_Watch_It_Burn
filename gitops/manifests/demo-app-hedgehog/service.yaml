# ABOUTME: Service for the demo-app-hedgehog demo application.
# ABOUTME: ClusterIP service exposing port 80 targeting container port 8080.
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-hedgehog
  namespace: apps
  labels:
    app: demo-app-hedgehog
spec:
  type: ClusterIP
  selector:
    app: demo-app-hedgehog
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
