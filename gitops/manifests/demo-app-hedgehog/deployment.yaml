# ABOUTME: Kubernetes Deployment for the demo-app-hedgehog demo application.
# ABOUTME: lab-platform's web image serves its page from web.yaml; Kyverno-compliant limits, probes and securityContext.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-hedgehog
  namespace: apps
  labels:
    app: demo-app-hedgehog
    version: "2.0.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app-hedgehog
  template:
    metadata:
      labels:
        app: demo-app-hedgehog
        # The Datadog Agent tags this pod's logs from these two labels (#662); without them they went out as nginx.
        tags.datadoghq.com/service: burritobot-demo-app-hedgehog
        tags.datadoghq.com/env: burritobot-kubecon-na-26
        version: "2.0.2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: demo-app-hedgehog
          # The kustomize image name web (#715): gitops/bootstrap/apps/demo-app-hedgehog.yaml sets it to lab-platform's web image
          # by digest, at the registry the root passes down (#622), as ai-layer.yaml does llm-guard.
          image: web
          env:
            # The image refuses an all-interfaces bind without it; in a pod the namespace is the boundary.
            - name: NETWORK_BOUNDARY
              value: sandbox
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: html
              mountPath: /srv/www
              readOnly: true
            - name: web
              mountPath: /etc/web
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: html
          configMap:
            name: demo-app-hedgehog-html
        # web.yaml, the routes file the image reads at /etc/web/web.yaml; kustomization.yaml generates it.
        - name: web
          configMap:
            name: demo-app-hedgehog-web
