# ABOUTME: Kubernetes Service for the demo-app-unicorn demo application.
# ABOUTME: Exposes the demo-app-unicorn deployment on port 80, forwarding to container port 8080.
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-unicorn
  namespace: apps
  labels:
    app: demo-app-unicorn
    version: "1.0.0"
spec:
  selector:
    app: demo-app-unicorn
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
