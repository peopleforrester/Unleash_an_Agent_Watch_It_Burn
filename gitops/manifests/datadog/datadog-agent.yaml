# ABOUTME: DatadogAgent CR (PRD #26 M5) — the node Agent DaemonSet + Cluster Agent for "Datadog sees everything".
# ABOUTME: Uses spec.features.* (v2alpha1), NOT Helm datadog.* keys. Credentials from the ESO-synced datadog-secret.
#
# Field paths verified live against the installed CRD (datadoghq.com/v2alpha1) on 2026-06-25:
# credentials uses apiSecret + **appSecret** (NOT "appKeySecret" — that field does not exist in this CRD,
# despite some docs/examples; `kubectl explain ...credentials` confirms apiSecret/appSecret). spec.override is a
# map keyed by component name (nodeAgent/processAgent/clusterAgent). APM off: OTel traces reach Datadog APM via
# the Collector path (gitops/apps/otel-collector.yaml), so the Agent's APM port is unused here.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: watch-it-burn
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
  features:
    logCollection:
      enabled: true
      containerCollectAll: true
    apm:
      enabled: false
    prometheusScrape:
      enabled: true
    # Universal Service Monitoring (eBPF, no instrumentation): this is what populates the Datadog Service
    # Map for UNINSTRUMENTED workloads (Argo CD, Kyverno, Falco, kagent controller, etc.). Without it the
    # map shows only the OTel-traced services (kagent agent, guard-proxy, agentgateway, the MCP shims).
    # Requires system-probe, which the node Agent already runs.
    usm:
      enabled: true
    # Network Performance Monitoring: pod-to-pod flow map (complements USM's request map). eBPF.
    npm:
      enabled: true
    # Orchestrator Explorer: the Kubernetes resource/cluster map (every Deployment, Pod, ReplicaSet,
    # CRD instance). This is the "Datadog sees every base component" view, distinct from the APM map.
    orchestratorExplorer:
      enabled: true
    # Kubernetes events into Datadog (Kyverno denials, OOMKills, Argo CD syncs, scheduling failures).
    # unbundleEvents emits one Datadog event per k8s event so the attack/guardrail beats are individually
    # visible on the events stream rather than rolled up.
    eventCollection:
      collectKubernetesEvents: true
      unbundleEvents: true
    # Process + container visibility (the fork-bomb / runaway-process attack story shows here, and it
    # enriches the service map nodes with the processes behind them).
    liveProcessCollection:
      enabled: true
    liveContainerCollection:
      enabled: true
    processDiscovery:
      enabled: true
  # v2alpha1: resource requests are per-CONTAINER (override.<component>.containers.<name>.resources),
  # NOT directly on the component (verified live 2026-06-25 via server-dry-run: a direct .resources is
  # rejected with "unknown field"). The process agent is a container in the nodeAgent DaemonSet, not a
  # separate override component. Container names per the Datadog AgentContainerName set.
  override:
    nodeAgent:
      # Per-cluster identity and dual shipping (#242). Both come from objects deploy-full-idp writes at
      # bootstrap (infra/datadog-cluster-identity.sh): cluster-identity on every cluster, so this cluster
      # reports its real name instead of the shared literal above; datadog-admin-secret only on attendee
      # and presenter clusters, holding the instructor org's key in the JSON shapes the Agent expects
      # (docs.datadoghq.com/agent/configuration/dual-shipping, read 2026-09-05). Every reference is
      # optional: an instructor cluster has no admin secret and simply ships once.
      env:
        - name: DD_CLUSTER_NAME
          valueFrom: { configMapKeyRef: { name: cluster-identity, key: cluster-name, optional: true } }
        - name: DD_ADDITIONAL_ENDPOINTS
          valueFrom: { secretKeyRef: { name: datadog-admin-secret, key: additional-endpoints, optional: true } }
        - name: DD_PROCESS_CONFIG_ADDITIONAL_ENDPOINTS
          valueFrom: { secretKeyRef: { name: datadog-admin-secret, key: process-additional-endpoints, optional: true } }
        - name: DD_LOGS_CONFIG_ADDITIONAL_ENDPOINTS
          valueFrom: { secretKeyRef: { name: datadog-admin-secret, key: logs-additional-endpoints, optional: true } }
        - name: DD_LOGS_CONFIG_FORCE_USE_HTTP
          value: "true"
      # Limits on EVERY container. require-resource-limits is Enforce on round-2/3 clusters and on any
      # attendee cluster whose student has done Challenge 2, and the agents only ran there because they were
      # created while the rule was still Audit: the first rollout after arming (2026-09-05, the env change
      # above) was denied and left those clusters with no node agent at all (#242 follow-up).
      containers:
        agent:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        process-agent:
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 512Mi
        system-probe:
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 512Mi
    clusterAgent:
      replicas: 1
      env:
        - name: DD_CLUSTER_NAME
          valueFrom: { configMapKeyRef: { name: cluster-identity, key: cluster-name, optional: true } }
        - name: DD_ORCHESTRATOR_EXPLORER_ORCHESTRATOR_ADDITIONAL_ENDPOINTS
          valueFrom: { secretKeyRef: { name: datadog-admin-secret, key: orchestrator-additional-endpoints, optional: true } }
      containers:
        cluster-agent:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
