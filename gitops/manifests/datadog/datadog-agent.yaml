# ABOUTME: DatadogAgent CR (PRD #26 M5) — the node Agent DaemonSet + Cluster Agent for "Datadog sees everything".
# ABOUTME: Uses spec.features.* (v2alpha1), NOT Helm datadog.* keys. Credentials from the ESO-synced datadog-secret.
#
# Field paths verified live against the installed CRD (datadoghq.com/v2alpha1) on 2026-06-25:
# credentials uses apiSecret + **appSecret** (NOT "appKeySecret" — that field does not exist in this CRD,
# despite some docs/examples; `kubectl explain ...credentials` confirms apiSecret/appSecret). spec.override is a
# map keyed by component name (nodeAgent/processAgent/clusterAgent). APM off: OTel traces reach Datadog APM via
# the Collector path (gitops/bootstrap/apps/otel-collector.yaml), so the Agent's APM port is unused here.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: burritobot
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
  features:
    logCollection:
      enabled: true
      containerCollectAll: true
    apm:
      enabled: false
    prometheusScrape:
      enabled: true
    # Universal Service Monitoring (eBPF, no instrumentation): this is what populates the Datadog Service
    # Map for UNINSTRUMENTED workloads (Argo CD, Kyverno, Falco, kagent controller, etc.). Without it the
    # map shows only the OTel-traced services (kagent agent, guard-proxy, agentgateway, the MCP shims).
    # Requires system-probe, which the node Agent already runs.
    usm:
      enabled: true
    # Network Performance Monitoring: pod-to-pod flow map (complements USM's request map). eBPF.
    npm:
      enabled: true
    # Orchestrator Explorer: the Kubernetes resource/cluster map (every Deployment, Pod, ReplicaSet,
    # CRD instance). This is the "Datadog sees every base component" view, distinct from the APM map.
    orchestratorExplorer:
      enabled: true
    # Kubernetes events into Datadog (Kyverno denials, OOMKills, Argo CD syncs, scheduling failures).
    # unbundleEvents emits one Datadog event per k8s event so the attack/guardrail beats are individually
    # visible on the events stream rather than rolled up.
    eventCollection:
      collectKubernetesEvents: true
      unbundleEvents: true
    # Process + container visibility (the fork-bomb / runaway-process attack story shows here, and it
    # enriches the service map nodes with the processes behind them).
    liveProcessCollection:
      enabled: true
    liveContainerCollection:
      enabled: true
    processDiscovery:
      enabled: true
  # v2alpha1: resource requests are per-CONTAINER (override.<component>.containers.<name>.resources),
  # NOT directly on the component (verified live 2026-06-25 via server-dry-run: a direct .resources is
  # rejected with "unknown field"). The process agent is a container in the nodeAgent DaemonSet, not a
  # separate override component. Container names per the Datadog AgentContainerName set.
  override:
    nodeAgent:
      # Datadog Unified Service Tagging (#662): the Agent's own pods log under a burritobot- service too. The
      # operator puts these labels on the node Agent's pod, and the Agent reads tags.datadoghq.com/* from labels.
      labels:
        tags.datadoghq.com/service: burritobot-datadog-agent
        tags.datadoghq.com/env: burritobot-kubecon-na-26
      # Every log from the KubeCon clusters carries a burritobot- service (#629, #662). Pods name theirs with
      # tags.datadoghq.com/* labels, or DD_SERVICE/DD_ENV where a chart takes only env, but these containers
      # take neither: kube-system's EKS add-ons are not charts here, and the rest are containers their chart or
      # operator gives no labels or env to. A file-based Autodiscovery log config (docs.datadoghq.com/containers/
      # kubernetes/log, read 2026-10-29) matches a container by its short image name and sets the service its
      # logs carry, and the tags add the env, which these pods have no label for; the source stays the short image
      # name, which is what they had. One file per image, named burritobot-logs-<image>.yaml so no integration's
      # own check name is taken. A log config's service wins over a pod's labels, so no labelled pod may run one of
      # these images: verify/test_datadog_log_services_render.py renders every chart to hold that.
      extraConfd:
        configDataMap:
          burritobot-logs-coredns.yaml: |
            ad_identifiers: [coredns]
            logs: [{ source: coredns, service: burritobot-coredns, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-kube-proxy.yaml: |
            ad_identifiers: [kube-proxy]
            logs: [{ source: kube-proxy, service: burritobot-kube-proxy, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-amazon-k8s-cni.yaml: |
            ad_identifiers: [amazon-k8s-cni]
            logs: [{ source: amazon-k8s-cni, service: burritobot-aws-node, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-amazon-k8s-cni-init.yaml: |
            ad_identifiers: [amazon-k8s-cni-init]
            logs: [{ source: amazon-k8s-cni-init, service: burritobot-aws-node, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-aws-network-policy-agent.yaml: |
            ad_identifiers: [aws-network-policy-agent]
            logs: [{ source: aws-network-policy-agent, service: burritobot-aws-node, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-aws-ebs-csi-driver.yaml: |
            ad_identifiers: [aws-ebs-csi-driver]
            logs: [{ source: aws-ebs-csi-driver, service: burritobot-ebs-csi-driver, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-csi-provisioner.yaml: |
            ad_identifiers: [csi-provisioner]
            logs: [{ source: csi-provisioner, service: burritobot-ebs-csi-driver, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-csi-attacher.yaml: |
            ad_identifiers: [csi-attacher]
            logs: [{ source: csi-attacher, service: burritobot-ebs-csi-driver, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-csi-snapshotter.yaml: |
            ad_identifiers: [csi-snapshotter]
            logs: [{ source: csi-snapshotter, service: burritobot-ebs-csi-driver, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-csi-resizer.yaml: |
            ad_identifiers: [csi-resizer]
            logs: [{ source: csi-resizer, service: burritobot-ebs-csi-driver, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-livenessprobe.yaml: |
            ad_identifiers: [livenessprobe]
            logs: [{ source: livenessprobe, service: burritobot-ebs-csi-driver, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-csi-node-driver-registrar.yaml: |
            ad_identifiers: [csi-node-driver-registrar]
            logs: [{ source: csi-node-driver-registrar, service: burritobot-ebs-csi-driver, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-eks-pod-identity-agent.yaml: |
            ad_identifiers: [eks-pod-identity-agent]
            logs: [{ source: eks-pod-identity-agent, service: burritobot-eks-pod-identity-agent, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-postgres.yaml: |
            ad_identifiers: [postgres]
            logs: [{ source: postgres, service: burritobot-kagent-postgres, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-kube-rbac-proxy.yaml: |
            ad_identifiers: [kube-rbac-proxy]
            logs: [{ source: kube-rbac-proxy, service: burritobot-kubearmor-controller, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-kubearmor-snitch.yaml: |
            ad_identifiers: [kubearmor-snitch]
            logs: [{ source: kubearmor-snitch, service: burritobot-kubearmor-snitch, tags: ["env:burritobot-kubecon-na-26"] }]
          burritobot-logs-kube-webhook-certgen.yaml: |
            ad_identifiers: [kube-webhook-certgen]
            logs: [{ source: kube-webhook-certgen, service: burritobot-prometheus-operator-webhook, tags: ["env:burritobot-kubecon-na-26"] }]
      # Per-cluster identity and dual shipping (#242). Both come from objects deploy-full-idp writes at
      # bootstrap (infra/datadog-cluster-identity.sh): cluster-identity on every cluster, so this cluster
      # reports its real name instead of the shared literal above; datadog-admin-secret only on attendee
      # clusters (a presenter's student cluster is a claimed one, #295), holding the instructor org's key in the JSON shapes the Agent expects
      # (docs.datadoghq.com/agent/configuration/dual-shipping, read 2026-09-05). Every reference is
      # optional: an instructor cluster has no admin secret and simply ships once.
      env:
        - name: DD_CLUSTER_NAME
          valueFrom: { configMapKeyRef: { name: cluster-identity, key: datadog-cluster-name, optional: true } }
        - name: DD_ENV
          value: burritobot-kubecon-na-26
        - name: DD_ADDITIONAL_ENDPOINTS
          valueFrom: { secretKeyRef: { name: datadog-admin-secret, key: additional-endpoints, optional: true } }
        - name: DD_PROCESS_CONFIG_ADDITIONAL_ENDPOINTS
          valueFrom: { secretKeyRef: { name: datadog-admin-secret, key: process-additional-endpoints, optional: true } }
        - name: DD_LOGS_CONFIG_ADDITIONAL_ENDPOINTS
          valueFrom: { secretKeyRef: { name: datadog-admin-secret, key: logs-additional-endpoints, optional: true } }
        - name: DD_LOGS_CONFIG_FORCE_USE_HTTP
          value: "true"
      # Limits on EVERY container. require-resource-limits is Enforce on admin clusters and on any
      # attendee cluster whose student has done Challenge 2, and the agents only ran there because they were
      # created while the rule was still Audit: the first rollout after arming (2026-09-05, the env change
      # above) was denied and left those clusters with no node agent at all (#242 follow-up).
      containers:
        agent:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        process-agent:
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 512Mi
        system-probe:
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 512Mi
    clusterAgent:
      replicas: 1
      labels:
        tags.datadoghq.com/service: burritobot-datadog-cluster-agent
        tags.datadoghq.com/env: burritobot-kubecon-na-26
      env:
        - name: DD_CLUSTER_NAME
          valueFrom: { configMapKeyRef: { name: cluster-identity, key: datadog-cluster-name, optional: true } }
        - name: DD_ENV
          value: burritobot-kubecon-na-26
        - name: DD_ORCHESTRATOR_EXPLORER_ORCHESTRATOR_ADDITIONAL_ENDPOINTS
          valueFrom: { secretKeyRef: { name: datadog-admin-secret, key: orchestrator-additional-endpoints, optional: true } }
      containers:
        cluster-agent:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
