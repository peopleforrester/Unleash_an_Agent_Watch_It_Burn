# ABOUTME: Service for the demo-app-mantis-shrimp demo application.
# ABOUTME: ClusterIP service exposing port 80 targeting container port 8080.
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-mantis-shrimp
  namespace: apps
  labels:
    app: demo-app-mantis-shrimp
spec:
  type: ClusterIP
  selector:
    app: demo-app-mantis-shrimp
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
