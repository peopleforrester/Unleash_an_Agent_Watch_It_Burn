# ABOUTME: Kubernetes Deployment for the demo-app-wombat demo application.
# ABOUTME: Kyverno-compliant with security contexts, resource limits, and health probes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-wombat
  namespace: apps
  labels:
    app: demo-app-wombat
    version: "2.0.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app-wombat
  template:
    metadata:
      labels:
        app: demo-app-wombat
        # The Datadog Agent tags this pod's logs from these two labels (#662); without them they went out as nginx.
        tags.datadoghq.com/service: burritobot-demo-app-wombat
        tags.datadoghq.com/env: burritobot-kubecon-na-26
        version: "2.0.2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: demo-app-wombat
          image: ghcr.io/peopleforrester/watch-it-burn:nginx-1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0  # our signed ghcr.io copy, not Docker Hub (#714)
          ports:
            - containerPort: 80
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: html
          configMap:
            name: demo-app-wombat-html
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
