# ABOUTME: Kubernetes Deployment for the demo-app-wombat demo application.
# ABOUTME: lab-platform's web server on 8080, Kyverno-compliant with security contexts, resource limits and probes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-wombat
  namespace: apps
  labels:
    app: demo-app-wombat
    version: "2.0.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app-wombat
  template:
    metadata:
      labels:
        app: demo-app-wombat
        # The Datadog Agent tags this pod's logs from these two labels (#662); without them they went out as nginx.
        tags.datadoghq.com/service: burritobot-demo-app-wombat
        tags.datadoghq.com/env: burritobot-kubecon-na-26
        version: "2.0.2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: demo-app-wombat
          # lab-platform's web server (#668), named by the kustomize image `web`: the app file's kustomize.images
          # sets it to web:v1 by digest at the registry the root passes down (#622). It reads /etc/web/web.yaml.
          image: web
          env:
            # Every lab-platform image that listens refuses an all-interfaces bind without it, so the pod would
            # exit at start rather than serve.
            - name: NETWORK_BOUNDARY
              value: sandbox
          ports:
            - containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: html
              mountPath: /srv/www
              readOnly: true
            - name: web-config
              mountPath: /etc/web
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      # One ConfigMap, two mounts: the page alone under the document root, and the routes file where web reads it.
      volumes:
        - name: html
          configMap:
            name: demo-app-wombat-html
            items:
              - key: index.html
                path: index.html
        - name: web-config
          configMap:
            name: demo-app-wombat-html
            items:
              - key: web.yaml
                path: web.yaml
