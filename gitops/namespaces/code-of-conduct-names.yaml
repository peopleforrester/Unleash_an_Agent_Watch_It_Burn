# ABOUTME: The code-of-conduct check on object names and labels in `agent` (#1278): native admission, so no guardrail
# ABOUTME: switch, Kyverno mode or reset lifts it. Refuses a create or update whose name or labels carry a ruled-out term.
#
# Why here. deploy_app applies any single namespaced resource and run_shell runs kubectl as agent-sa, so a name or a
# label the room talks the bot into can carry a slur into `kubectl get` and Argo CD on stage, through more kinds than
# the Deployment check #1269 adds to deploy_app. The spike (#1267, docs/research/2026-11-09-coc-floor/README.md) chose
# a ValidatingAdmissionPolicy over Kyverno because guardrails-on and guardrails-off flip Kyverno's validationActions
# as a stage prop, and this check stays on whatever the guardrails are set to. Nothing the terminal or fleet.sh runs
# names it, and no stage identity (agent-sa, workshop-mcp, web-terminal, guardrails-switch) may change it. It ships in
# the namespaces Application, which every profile lists and which syncs first (wave -10), so it is in place before
# anything lands in `agent`, and selfHeal puts it back if it is deleted.
#
# What it reads. The object's name and its labels, and the pod template's labels of a workload or CronJob, which the
# controllers copy onto the Pods they make (they are not checked themselves, below). Each label is read as key=value,
# and the name and labels are joined with "/", which ends a word for the pattern but is not one of its separators, so
# a match never runs from one label into the next.
#
# The pattern is the floor's RE2 form, floor.portable_pattern() over terms-proposed.rot13, written in full: CEL's
# matches() runs RE2 and cannot fold look-alike letters first, as the README says. verify/test_coc_admission.py holds
# it equal to floor.portable_pattern(), and holds every name the stage creates against it. After the term list or
# floor.py changes, one command rewrites this copy and the collector's (#1289), from the repo root:
#   python3 verify/coc_pattern_copies.py write
# verify/test_coc_pattern_copies.py fails until every copy of the pattern under gitops/ is the floor's.
#
# Whose writes. Every request but those from the cluster's own system identities, and every request from a service
# account in `agent` (agent-sa, workshop-mcp, web-terminal and the rest): the bot, the room through it, the terminal
# and a person all reach `agent` through those. Controllers, Kyverno and Argo CD are left out. What they create is
# named after an object already checked, plus a random part: a Kyverno PolicyReport is named for a UID, and a Job's
# Pods carry its UID as a label, and about one random UID in 3,400 holds a four-letter segment that reads as a term in
# leetspeak (two PolicyReports in `agent` on watch-it-burn-community did on 2026-11-09). Argo CD applies only what is
# in git, which the offline test reads. Cluster-scoped objects are out (scope Namespaced), since a binding's
# namespaceSelector never skips them.
#
# The message names no term. A name and labels too long for CEL's cost budget (about 2,400 characters together) fail
# the evaluation, and failurePolicy Fail refuses that too; the error then quotes the expression, which holds no term.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: code-of-conduct-names
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
        scope: Namespaced
  matchConditions:
    - name: room-and-people
      expression: >-
        !request.userInfo.username.startsWith('system:') ||
        request.userInfo.username.startsWith('system:serviceaccount:agent:')
