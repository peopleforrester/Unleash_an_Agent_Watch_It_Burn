# ABOUTME: Kubernetes namespace definitions for all platform components.
# ABOUTME: Creates 8 namespaces with PSS labels on apps namespace for defense-in-depth.
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: kagent
  labels:
    app.kubernetes.io/part-of: watch-it-burn
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent
  labels:
    app.kubernetes.io/part-of: watch-it-burn
    app.kubernetes.io/component: ai-layer
---
# Holds one Secret, student-aws-creds: the attendee's own IAM key, which fleet.sh bootstrap_student_aws pushes
# here and the web terminal reads at boot (#584). The key carries EKS cluster-admin on its cluster, so it must
# not sit in `agent`, where the agent's broad Role (the state Challenge 8 starts in) reads every Secret. No
# agent identity holds any grant in this namespace, and a pod can only mount Secrets from its own namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: student-creds
  labels:
    app.kubernetes.io/part-of: watch-it-burn
    app.kubernetes.io/component: attendee-credentials
---
apiVersion: v1
kind: Namespace
metadata:
  name: datadog
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
