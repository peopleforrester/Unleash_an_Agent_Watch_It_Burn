# ABOUTME: Kubernetes namespace definitions for all platform components.
# ABOUTME: Creates the platform namespaces, with PSS labels on apps and agent for defense-in-depth.
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
---
apiVersion: v1
kind: Namespace
metadata:
  name: kagent
  labels:
    app.kubernetes.io/part-of: watch-it-burn
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent
  labels:
    app.kubernetes.io/part-of: watch-it-burn
    app.kubernetes.io/component: ai-layer
    # Pod Security Admission at baseline (#1410). The agent's Role creates pods and Deployments here, and without
    # a label a privileged, hostPath, hostNetwork or hostPID pod from it was admitted on both KubeCon clusters
    # (docs/research/2026-11-02-privileged-pod-hostpath-escape.md): a node escape past every guardrail the talk
    # shows. PSA runs inside the API server, so it refuses that pod on the community cluster too, which has no
    # Kyverno. Baseline, not restricted: every platform pod here meets baseline and most do not meet restricted.
    # warn at baseline names the refusal when a Deployment is applied, before its ReplicaSet fails to make pods.
    # verify/test_agent_namespace_pod_security.py holds the label and the pod templates that land here.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
    # The AWS load balancer controller's webhook adds a readiness gate to each pod a TargetGroupBinding selects
    # here, the console's, so a new console pod is Ready only once the NLB has it registered and healthy (#1258).
    # A cluster without the controller has no webhook, and the label does nothing there.
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
---
# Holds one Secret, student-aws-creds: the attendee's own IAM key, which fleet.sh bootstrap_student_aws pushes
# here and the web terminal reads at boot (#584). The key carries EKS cluster-admin on its cluster, so it must
# not sit in `agent`, where the agent's broad Role (the state Challenge 8 starts in) reads every Secret. No
# agent identity holds any grant in this namespace, and a pod can only mount Secrets from its own namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: student-creds
  labels:
    app.kubernetes.io/part-of: watch-it-burn
    app.kubernetes.io/component: attendee-credentials
---
apiVersion: v1
kind: Namespace
metadata:
  name: datadog
  labels:
    app.kubernetes.io/part-of: watch-it-burn-idp
