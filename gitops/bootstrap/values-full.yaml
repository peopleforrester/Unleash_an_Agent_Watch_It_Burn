# ABOUTME: The FULL profile: every platform component for a guarded instructor cluster, with the C1 and C3
# ABOUTME: challenge controls left for the fix step, as on attendee clusters.
#
# The attendee collector dual-ships to the instructor org; an instructor cluster already IS the
# instructor org, and a second exporter would double-count it (#242). otel-collector-burn is the
# burn cluster's Datadog-only collector (#476), under the same Application name, so it is dropped too.
# network-policies and kubearmor-policies are the C1 and C3 CHALLENGE CONTROLS, not platform
# baseline, so a presenter's cluster starts in the same state as a student's and the fix step
# arms them. Shipping them here made the armed instructor clusters the only ones where the first
# attack was pre-blocked, and both apps run selfHeal with no ignoreDifferences, so deleting the
# policies to stage the attack restored them in about a second (measured on r3-3, #281): a failed
# demo with no visible cause. The attendee profile has always left out exactly these two; the
# profiles agree.
#
# Each name is gitops/bootstrap/apps/<name>.yaml. The list is explicit (#609): a new app file reaches no
# profile until a line here names it, and a name with no file fails the render.
apps:
  - ai-layer-otel
  - ai-layer
  - cert-manager
  - datadog-agent-cr
  - datadog-operator
  - demo-app-hedgehog
  - demo-app-mantis-shrimp
  - demo-app-spider
  - demo-app-unicorn
  - demo-app-wombat
  - eso-resources
  - external-secrets
  - falco-talon
  - falco
  - falcosidekick
  - grafana-dashboards
  - istio
  - kagent-crds
  - kagent
  - kubearmor
  - kyverno-policies
  - kyverno
  - minimal-floor
  - namespaces
  - otel-collector
  - otel-operator
  - prometheus
  - tempo
