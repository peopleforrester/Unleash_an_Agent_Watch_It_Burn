# ABOUTME: ArgoCD Application for External Secrets Operator.
# ABOUTME: Syncs secrets from AWS Secrets Manager to Kubernetes via EKS Pod Identity.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: "2.10.0"
    helm:
      valuesObject:
        serviceAccount:
          create: true
          name: external-secrets
        # CRD install handled by chart
        installCRDs: true
        # Datadog Unified Service Tagging (#662): the Agent tags each pod's logs from these labels.
        podLabels: { tags.datadoghq.com/service: burritobot-external-secrets, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        # Limits on every container: require-resource-limits is Enforce from bootstrap on the full profile,
        # and a chart container without limits is denied outright (verify/test_enforce_floor.py, 2026-09-06).
        webhook:
          podLabels: { tags.datadoghq.com/service: burritobot-external-secrets-webhook, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
        certController:
          podLabels: { tags.datadoghq.com/service: burritobot-external-secrets-cert-controller, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
