# ABOUTME: ArgoCD Application for Falcosidekick event forwarder.
# ABOUTME: Receives Falco alerts and exposes Prometheus metrics endpoint.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falcosidekick
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: falcosidekick
    repoURL: https://falcosecurity.github.io/charts
    targetRevision: "0.14.0"
    helm:
      valuesObject:
        # lab-platform's mirror/ copy of docker.io/falcosecurity/falcosidekick:2.32.0, the chart's tag, named by its
        # linux/amd64 digest's first twelve characters (#623).
        image:
          registry: "{{ .Values.imageRegistry }}/mirror"
          repository: falcosecurity/falcosidekick
          tag: "2.32.0-399d95934a67"
        config:
          prometheus:
            extralabels: ""
          # Forward CRITICAL events (the fork bomb) to Falco Talon for auto-remediation (kill the pod).
          # Falcosidekick runs in 'security' and Talon's Service lives in 'falco', so the address MUST be
          # the cross-namespace FQDN; a bare 'falco-talon' resolves in 'security' and fails with NXDOMAIN
          # (caught live on watch-it-burn-test: "lookup falco-talon ... no such host").
          # Admin and full only in effect: the attendee profile leaves falco-talon out (#475), so there a
          # CRITICAL event's Talon post finds no Service and Sidekick logs it as a failed output. The Datadog
          # output is a separate output and is not affected; nothing on an attendee cluster needed Talon.
          talon:
            address: http://falco-talon.falco.svc.cluster.local:2803
            minimumpriority: critical
          # Forward Falco alerts to Datadog (so runtime detections show in the Datadog story). The
          # apikey is supplied via the DATADOG_APIKEY env from the shared datadog-secret (env overrides
          # yaml; populating the key enables the output), so no key is stored in this repo. Stays
          # swappable: drop this datadog block + the env to run Datadog-free (Falco still feeds Talon
          # and Prometheus). DATADOG_HOST defaults to https://api.datadoghq.com.
          datadog:
            minimumpriority: notice
          # verify-at-build CONFIRMED live 2026-06-25: chart 0.14.0 reads extraEnv at `config.extraEnv`,
          # NOT at the top level. Placed at the top level the chart silently DROPS it, so DATADOG_APIKEY
          # never reaches the pod and the Datadog output stays disabled (falcosidekick forwards only to
          # Talon). The datadog-secret (key api-key) must exist in the `security` namespace (falcosidekick's
          # ns), not only `monitoring`. Set DATADOG_HOST to Whitney's site (https://api.us5.datadoghq.com,
          # https://api.datadoghq.eu) if the org is not US1.
          #
          # OPTIONAL, so falcosidekick starts on a cluster with no datadog-secret (#500, no Datadog org pool
          # yet, #454). Non-optional, the pod sat in CreateContainerConfigError and Falco's CRITICAL events
          # never reached Talon either, so the fork-bomb kill died with the Datadog forward. Without the
          # secret, DATADOG_APIKEY falls back to the chart's own envFrom secret, which holds the empty
          # config.datadog.apikey, and an empty key is falcosidekick's off switch for the output: it logs
          # the outputs it enabled at start, and Datadog is simply not among them. Once datadog-secret exists,
          # a pod restart (infra/reload-datadog-consumers.sh) turns the output on with no change here.
          extraEnv:
            - name: DATADOG_APIKEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: api-key
                  optional: true
            - name: DATADOG_HOST
              value: "https://api.datadoghq.com"
        webui:
          enabled: false
        # Datadog Unified Service Tagging (#662): the Agent tags this pod's logs from these labels.
        podLabels: { tags.datadoghq.com/service: burritobot-falcosidekick, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "2801"
          prometheus.io/path: "/metrics"
        replicaCount: 2
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            # 128Mi OOM-killed (exit 137) under the live attack-event flood, breaking the Falco -> Datadog
            # forward (C3 alert payoff). 512Mi gives burst-queuing headroom; falcosidekick buffers events.
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
