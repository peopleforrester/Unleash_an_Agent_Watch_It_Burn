# ABOUTME: ArgoCD Application for the Watch It Burn AI layer (kustomize bundle in gitops/ai-layer).
# ABOUTME: Syncs after kagent (CRDs + controller). agent-sa IRSA is added by a bootstrap step (IAM).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-layer
  namespace: argocd
  annotations:
    # Wave 3 (AFTER the OTel Operator + collector at wave 2). The Operator's mutating webhook injects the
    # OTel SDK into guard-proxy/workshop-agent at pod-create; if this layer deploys in the SAME wave as the
    # Operator (it was wave 2), the app pods are admitted before the webhook is ready and get NO
    # instrumentation, so they export ZERO telemetry (the 2026-06-26 "Datadog is empty" root cause).
    # Deploying after the Operator is Healthy lets the webhook instrument the pods. Safety net for any
    # residual webhook-cert race: infra/reinstrument-app-pods.sh.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
    targetRevision: "{{ .Values.revision }}"
    path: gitops/ai-layer
    kustomize:
      # LLM Guard's image (#652): lab-platform's llm-guard:v1, by digest, at the registry the root passes down
      # (#622). resources.yaml names it by the kustomize image name llm-guard, and Argo CD's kustomize
      # (`kustomize edit set image`) sets that name here, so a root passing an ECR pull-through cache path gets
      # the cache's copy. The package is lab-platform's; verify/test_llm_guard_image.py holds the reference.
      images:
        - "llm-guard={{ .Values.imageRegistry }}/llm-guard:v1@sha256:781a126bf7c7da6b8460d48b1fba1e0823673b85b186a165b36e0b23eb3f4d7b"
      # The front door's certificate (#638). With frontDoor.certificateArn set, the console Service's 443 becomes a
      # TLS listener on the NLB with that ACM certificate, re-encrypting to nginx, so lab-platform's gateway, which
      # verifies against the system roots, accepts it. Unset, these patches are not rendered and 443 stays the TCP
      # pass-through to nginx's self-signed certificate (#139). The if and end sit in YAML comments so the file
      # still parses as written; tpl renders them, and verify/test_bootstrap_chart_render.py renders both ways.
      # {{- if .Values.frontDoor.certificateArn }}
      patches:
        - target:
            kind: Service
            name: console
          patch: |-
            - op: add
              path: /metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-ssl-cert
              value: "{{ .Values.frontDoor.certificateArn }}"
            - op: add
              path: /metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-ssl-ports
              value: "443"
            - op: add
              path: /metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-backend-protocol
              value: ssl
            - op: add
              path: /metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-ssl-negotiation-policy
              value: ELBSecurityPolicy-TLS13-1-2-2021-06
      # {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: agent
  # Beat-2 LIVE TOGGLES: the demo flips the guard-proxy INPUT_GUARD / OUTPUT_GUARD env on/off via
  # kubectl patch (challenges/02-sanitization/toggle-*.sh). Ignore drift on the proxy container's env so
  # selfHeal does not revert the live toggle (same selfHeal-vs-toggle issue the gate run found for
  # beat-1). verify-at-build: re-confirm on a live cluster once the agent compiles (gated on workshop-mcp).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: guard-proxy
      jqPathExpressions:
        # ONLY the env vars a live toggle changes, BY NAME. Two failures taught this list. Ignoring the
        # whole env hid the Secret reference kustomize renames with the content hash, so guard-proxy
        # pointed at a pruned Secret (#254). Ignoring every literal then swallowed OTEL_RESOURCE_ATTRIBUTES,
        # so renaming the service to burritobot never reached a cluster while Argo still reported the
        # Deployment Synced (#265). Anything not named here is managed by Git and syncs normally.
        # The diff only (#679): with RespectIgnoreDifferences the sync took the env list's ORDER from live (the
        # strategic merge patch's $setElementOrder), so CONSOLE_ORIGIN, appended by hand where git puts it
        # mid-list, left guard-proxy OutOfSync for good and every self-heal applied the live order again.
        - '.spec.template.spec.containers[] | select(.name=="proxy") | .env[] | select(.name | test("^(INPUT_BLOCKLIST|INPUT_CLASSIFIER|OUTPUT_GUARD|PROXY_FAIL_CLOSED|MODEL_TIER|RATE_LIMIT_RPM|COST_CAP_USD|STREAM_PROMPTS|OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT)$"))'
    # Beat-3 (C7) LIVE TOGGLE: challenges/03-bad-mcp-excessive-agency/toggle-mcp-authz-on.sh patches
    # the kagent Agent's MCP toolNames allowlist (ON excludes the rogue tools, --off lets them back in).
    # Ignore drift on the Agent's tools so selfHeal does not revert the live toggle, same as the
    # guard-proxy env toggles above. The committed default (resources.yaml) is the vulnerable "off" list:
    # evil-mcp is wired with its full rogue toolset, and the toggle or the web terminal's guard-mcp-on
    # narrows it live. On an admin cluster guard-mcp-on narrows the gateway rule instead (#496).
    #
    # NARROWED to the evil-mcp entry only (#349). Ignoring `.spec.declarative.tools` wholesale also stopped
    # OUR changes reaching a cluster, silently: when get_recipe was renamed to get_vault_entry the manifest
    # updated and every live Agent CR kept pointing at the tool that no longer existed, so Challenge 5 was
    # impossible while Argo reported Synced and Healthy throughout. Same shape as the guard-proxy env
    # lesson two comments above, and as the Kyverno extraArgs key that applied cleanly and did nothing.
    #
    # Only Challenge 7 patches a tool list live, and only evil-mcp's. Selecting that one server by NAME
    # rather than by array index keeps it correct if the order ever changes.
    #
    # This ignore is for the DIFF only (#679). It sits inside the tools array, and while ai-layer synced with
    # RespectIgnoreDifferences=true that froze the whole array: the Agent is a CRD, so the sync copied the
    # ignored field back from live as a JSON merge patch, which carries the entire live array, and every sync
    # applied the live tools. read_support_ticket (#640) never reached either KubeCon cluster that way. The
    # option is gone (syncOptions below), so a sync applies git's Agent, and a student's guard-mcp-on is kept
    # by this ignore (no drift, so no selfHeal) and by ApplyOutOfSyncOnly (a sync of anything else does not
    # re-apply the Agent). A commit that changes the Agent resets it to git, guard-mcp-on included. On the
    # admin profile (c7Control: gateway) C7 is agentgateway's rule (#496), nothing writes this list live, and
    # the ignore is not rendered, so selfHeal restores git's list too. verify/test_agent_tools_sync.py models it.
    - group: kagent.dev
      kind: Agent
      name: workshop-agent
      jqPathExpressions:
        # {{- if ne .Values.c7Control "gateway" }}
        - '.spec.declarative.tools[] | select(.mcpServer.name == "evil-mcp") | .mcpServer.toolNames'
        # {{- end }}
        # Per-cluster model tier (cost-race demo): modelConfig can be patched live to another Bedrock tier
        # on one cluster. Ignore drift so selfHeal keeps the per-cluster tier instead of reverting to the
        # committed default (bedrock-nova).
        - '.spec.declarative.modelConfig'
    # Bedrock spend carries project/event (#513). Each Bedrock ModelConfig commits the system profile id,
    # which is the pin, and fleet.sh pin_bedrock_profiles sets the live .spec.model to this cluster's
    # tagged application profile ARN, which Bedrock picks at create time and git cannot know. Ignored on
    # Bedrock configs only, so the gateway-* configs (agentgateway backend names) still sync from git. A
    # committed model change reaches a cluster through the next bootstrap or converge, which re-derives the
    # ARN from the committed id and fails loudly if the cluster has no profile for it.
    - group: kagent.dev
      kind: ModelConfig
      jqPathExpressions:
        - '.spec | select(.provider == "Bedrock") | .model'
    # The same pin on the gateway path (#561): the gateway-* ModelConfigs name an agentgateway backend, and
    # the bedrock-nova backend reads its model from the BEDROCK_NOVA_MODEL env of the agentgateway
    # container. Git commits the system id; pin_bedrock_profiles sets the live value to the cluster's ARN.
    # Ignored BY NAME, that one entry only, so every other field of the Deployment still syncs from git.
    - group: apps
      kind: Deployment
      name: agentgateway
      jqPathExpressions:
        - '.spec.template.spec.containers[] | select(.name=="agentgateway") | .env[] | select(.name == "BEDROCK_NOVA_MODEL")'
    # C7 on an admin cluster (#496, #515): guard-mcp-on / guard-mcp-off rewrite the `# c7-rule` line of this
    # ConfigMap live from the web terminal, and the agentgateway-c7 container reloads it without a restart.
    # The config is one string, so the ignore has to cover all of it. That is why the evil-mcp bind has a
    # ConfigMap and a container of its own: agentgateway-config (the A2A, workshop-mcp and LLM routes) stays
    # fully managed, and the agentgateway Deployment ignores only its BEDROCK_NOVA_MODEL env (above).
    # A committed change to agentgateway-c7-config's config.yaml alone shows no drift, so it reaches new clusters
    # only; a change to anything else of it makes it OutOfSync, and the sync then applies git's config.yaml
    # too, which resets a live guard-mcp-on (#679: syncs no longer copy ignored fields from live).
    - group: ""
      kind: ConfigMap
      name: agentgateway-c7-config
      jqPathExpressions:
        - '.data["config.yaml"]'
    # C8 (#111 SA-token theft): agent-sa's Role ships BROAD (secrets get/list namespace-wide), the
    # vulnerability the attack exploits. The STUDENT applies a scoped Role (get on the recipe Secret by
    # name, no list); ignore drift on .rules so selfHeal keeps the tightened rules instead of reverting
    # to the broad committed default. resources.yaml stays broad so a fresh attendee cluster starts
    # vulnerable.
    - group: rbac.authorization.k8s.io
      kind: Role
      name: workshop-agent
      jqPathExpressions:
        - '.rules'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ServerSideApply will not take a field another manager owns, and it says nothing when it
      # declines: the sync reports "Succeeded: successfully synced (all tasks run)" and the resource
      # stays OutOfSync forever. Measured on attendee-001 2026-09-08, three managers on the Agent CR:
      #   argocd-controller / Apply
      #   kubectl-patch     / Update   <- Challenge 7's `kubectl patch --type=json`, from a past run
      #   app               / Update
      # kubectl-patch owned .spec.declarative.tools, so the get_recipe -> get_vault_entry rename never
      # reached a single live cluster and Challenge 5 was impossible on all of them (#349).
      #
      # Force lets Argo reclaim the field. A student's Challenge 7 patch survives because the ignore above is
      # narrowed to evil-mcp's toolNames, so the patch shows no drift and selfHeal never syncs the Agent for it,
      # and because ApplyOutOfSyncOnly (below) leaves a Synced Agent out of every other sync. With the old
      # wholesale ignore the Agent could never be OutOfSync, so no change of ours reached it at all.
      - Force=true
      # ApplyOutOfSyncOnly, and NO RespectIgnoreDifferences (#679). The ignores above are for the diff: a live
      # edit of an ignored field (a student's guard-mcp-on, a tier swap, fleet.sh's Bedrock profile pins, C8's
      # scoped Role) shows no drift, so selfHeal never syncs that resource for it, and ApplyOutOfSyncOnly keeps
      # it out of every sync of the other resources too (a new commit, or a self-heal of something else).
      #
      # RespectIgnoreDifferences=true, which this app carried from 2026-07-10 to keep those edits through a
      # sync, is what froze our own changes. On a sync it copies each ignored field from live into what it
      # applies, and three of the ignores here sit inside a list (the Agent's tools, guard-proxy's and
      # agentgateway's env). The Agent is a CRD, so the copy is a JSON merge patch that carries the whole live
      # tools array, and for a Deployment it is a strategic merge patch whose $setElementOrder takes the env
      # list's order from live. read_support_ticket (#640) never reached
      # the Agent, and guard-proxy's CONSOLE_ORIGIN, appended by hand at the end of the live env, kept guard-proxy
      # OutOfSync for good. Each self-heal then synced guard-proxy alone, Succeeded, and changed nothing, and
      # the next commit's new hashed ConfigMaps never landed while every sync reported success.
      #
      # The price: a commit that changes a resource applies git's whole object, so it also resets that
      # resource's live edits (C7's toolNames, the tier, the Bedrock pin, which the next fleet.sh converge
      # puts back). verify/test_agent_tools_sync.py fails if RespectIgnoreDifferences returns on an app whose
      # ignores reach into a list, and fleet.sh converge's repair_ai_layer_rollout judges a rollout by the
      # hashed ConfigMap names git renders, not by the sync phase.
      - ApplyOutOfSyncOnly=true
