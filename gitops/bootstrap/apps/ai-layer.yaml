# ABOUTME: ArgoCD Application for the Watch It Burn AI layer (kustomize bundle in gitops/ai-layer).
# ABOUTME: Syncs after kagent (CRDs + controller). agent-sa's Bedrock role is a Pod Identity association (terraform).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-layer
  namespace: argocd
  annotations:
    # Wave 3 (AFTER the OTel Operator + collector at wave 2). The Operator's mutating webhook injects the
    # OTel SDK into guard-proxy (and workshop-agent, a wave later, #707) at pod-create; if this layer deploys in the SAME wave as the
    # Operator (it was wave 2), the app pods are admitted before the webhook is ready and get NO
    # instrumentation, so they export ZERO telemetry (the 2026-06-26 "Datadog is empty" root cause).
    # Deploying after the Operator is Healthy lets the webhook instrument the pods. Safety net for any
    # residual webhook-cert race: infra/reinstrument-app-pods.sh.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
    targetRevision: "{{ .Values.revision }}"
    path: gitops/ai-layer
    kustomize:
      # LLM Guard's image (#652): lab-platform's llm-guard:v1, by digest, at the registry the root passes down
      # (#622). resources.yaml names it by the kustomize image name llm-guard, and Argo CD's kustomize
      # (`kustomize edit set image`) sets that name here, so a root passing an ECR pull-through cache path gets
      # the cache's copy. The package is lab-platform's; verify/test_llm_guard_image.py holds the reference.
      images:
        - "llm-guard={{ .Values.imageRegistry }}/llm-guard:v1@sha256:781a126bf7c7da6b8460d48b1fba1e0823673b85b186a165b36e0b23eb3f4d7b"
      # The front door's certificate (#638). With frontDoor.certificateArn set, the console Service's 443 becomes a
      # TLS listener on the NLB with that ACM certificate, re-encrypting to nginx, so lab-platform's gateway, which
      # verifies against the system roots, accepts it. Unset, these patches are not rendered and 443 stays the TCP
      # pass-through to nginx's self-signed certificate (#139). The if and end sit in YAML comments so the file
      # still parses as written; tpl renders them, and verify/test_bootstrap_chart_render.py renders both ways.
      # {{- if .Values.frontDoor.certificateArn }}
      patches:
        - target:
            kind: Service
            name: console
          patch: |-
            - op: add
              path: /metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-ssl-cert
              value: "{{ .Values.frontDoor.certificateArn }}"
            - op: add
              path: /metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-ssl-ports
              value: "443"
            - op: add
              path: /metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-backend-protocol
              value: ssl
            - op: add
              path: /metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-ssl-negotiation-policy
              value: ELBSecurityPolicy-TLS13-1-2-2021-06
      # {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: agent
  # Beat-2 LIVE TOGGLES: the demo flips the guard-proxy INPUT_GUARD / OUTPUT_GUARD env on/off via
  # kubectl patch (challenges/02-sanitization/toggle-*.sh). Ignore drift on the proxy container's env so
  # selfHeal does not revert the live toggle (same selfHeal-vs-toggle issue the gate run found for
  # beat-1). verify-at-build: re-confirm on a live cluster once the agent compiles (gated on workshop-mcp).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: guard-proxy
      jqPathExpressions:
        # ONLY the env vars a live toggle changes, BY NAME. Two failures taught this list. Ignoring the
        # whole env hid the Secret reference kustomize renames with the content hash, so guard-proxy
        # pointed at a pruned Secret (#254). Ignoring every literal then swallowed OTEL_RESOURCE_ATTRIBUTES,
        # so renaming the service to burritobot never reached a cluster while Argo still reported the
        # Deployment Synced (#265). Anything not named here is managed by Git and syncs normally.
        - '.spec.template.spec.containers[] | select(.name=="proxy") | .env[] | select(.name | test("^(INPUT_BLOCKLIST|INPUT_CLASSIFIER|OUTPUT_GUARD|PROXY_FAIL_CLOSED|MODEL_TIER|RATE_LIMIT_RPM|COST_CAP_USD|STREAM_PROMPTS|OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT)$"))'
    # The workshop-agent Agent is not in this bundle (#707). Its C7 toolNames and modelConfig ignores sat inside the
    # Agent's tools array, and with this app's RespectIgnoreDifferences every sync applied the whole live array, so a
    # git change to a tool never reached a toolnames cluster (#679). It is gitops/bootstrap/apps/workshop-agent.yaml,
    # with those ignores and without RespectIgnoreDifferences. Do not move it back.
    #
    # Bedrock spend carries project/event (#513). Each Bedrock ModelConfig commits the system profile id,
    # which is the pin, and fleet.sh pin_bedrock_profiles sets the live .spec.model to this cluster's
    # tagged application profile ARN, which Bedrock picks at create time and git cannot know. Ignored on
    # Bedrock configs only, so the gateway-* configs (agentgateway backend names) still sync from git. A
    # committed model change reaches a cluster through the next bootstrap or converge, which re-derives the
    # ARN from the committed id and fails loudly if the cluster has no profile for it.
    - group: kagent.dev
      kind: ModelConfig
      jqPathExpressions:
        - '.spec | select(.provider == "Bedrock") | .model'
        # The region goes with it (#643): a standby outside us-west-2 has its profiles in its own region.
        - '.spec | select(.provider == "Bedrock") | .bedrock.region'
    # The same pin on the gateway path (#561): the gateway-* ModelConfigs name an agentgateway backend, and
    # the bedrock-nova backend reads its model from the BEDROCK_NOVA_MODEL env of the agentgateway
    # container. Git commits the system id; pin_bedrock_profiles sets the live value to the cluster's ARN.
    # Ignored BY NAME, that one entry only, so every other field of the Deployment still syncs from git.
    - group: apps
      kind: Deployment
      name: agentgateway
      jqPathExpressions:
        - '.spec.template.spec.containers[] | select(.name=="agentgateway") | .env[] | select(.name == "BEDROCK_NOVA_MODEL")'
        - '.spec.template.spec.containers[] | select(.name=="agentgateway") | .env[] | select(.name == "BEDROCK_REGION")'
    # C7 on an admin cluster (#496, #515): guard-mcp-on / guard-mcp-off rewrite the `# c7-rule` line of this
    # ConfigMap live from the web terminal, and the agentgateway-c7 container reloads it without a restart.
    # The config is one string, so the ignore has to cover all of it. That is why the evil-mcp bind has a
    # ConfigMap and a container of its own: agentgateway-config (the A2A, workshop-mcp and LLM routes) stays
    # fully managed, and the agentgateway Deployment ignores only its BEDROCK_NOVA_MODEL and BEDROCK_REGION env (above).
    # The cost: a committed change to agentgateway-c7-config reaches new clusters only.
    - group: ""
      kind: ConfigMap
      name: agentgateway-c7-config
      jqPathExpressions:
        - '.data["config.yaml"]'
    # C8 (#111 SA-token theft): agent-sa's Role ships BROAD (secrets get/list namespace-wide), the
    # vulnerability the attack exploits. The STUDENT applies a scoped Role (get on the recipe Secret by
    # name, no list); ignore drift on .rules so selfHeal keeps the tightened rules instead of reverting
    # to the broad committed default. resources.yaml stays broad so a fresh attendee cluster starts
    # vulnerable.
    - group: rbac.authorization.k8s.io
      kind: Role
      name: workshop-agent
      jqPathExpressions:
        - '.rules'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # ServerSideApply will not take a field another manager owns, and it says nothing when it
      # declines: the sync reports "Succeeded: successfully synced (all tasks run)" and the resource
      # stays OutOfSync forever. Measured on attendee-001 2026-09-08, three managers on the Agent CR:
      #   argocd-controller / Apply
      #   kubectl-patch     / Update   <- Challenge 7's `kubectl patch --type=json`, from a past run
      #   app               / Update
      # kubectl-patch owned .spec.declarative.tools, so the get_recipe -> get_vault_entry rename never
      # reached a single live cluster and Challenge 5 was impossible on all of them (#349).
      #
      # Force lets Argo reclaim the field. The Agent has since moved to the workshop-agent Application (#707),
      # which keeps the same option; here it reclaims any field of this bundle a live kubectl edit took.
      - Force=true
      # RespectIgnoreDifferences: honor the ignoreDifferences (guard-proxy env, the Bedrock ModelConfigs' model
      # and region, agentgateway's BEDROCK_NOVA_MODEL and BEDROCK_REGION, agentgateway-c7-config's config.yaml,
      # the workshop-agent Role's rules) on SYNC too, not just on diff. Without it a sync re-applies the
      # committed spec and can revert a live toggle (found 2026-07-10 for kyverno-policies). It is safe for
      # every ignore above: none reaches into an array element of a CRD, the shape that froze the Agent's
      # tools (#679), and verify/test_agent_tools_sync.py fails if one ever does.
      - RespectIgnoreDifferences=true
