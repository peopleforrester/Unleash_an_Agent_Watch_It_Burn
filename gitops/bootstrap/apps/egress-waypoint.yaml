# ABOUTME: Argo CD Application for the egress waypoint (#861, option B of the #724 decision): the one way out of the
# ABOUTME: agent namespace on 443, which opens tunnels only to the weather feed's Open-Meteo hosts.
#
# Listed on attendee, admin, full, local-inference and kubecon-private, the profiles with Istio ambient (question 1077,
# #860). Not on burn or kubecon-community: they carry no Istio, so no waypoint runs there.
#
# Wave -2: after istio-mesh-config (-3), so istiod and ztunnel are up before the waypoint is programmed, and before
# ai-layer (3), whose weather feed is enrolled in the mesh and calls it. The Gateway needs the Gateway API CRDs, which
# gateway-api (-7) installs. gitops/egress-waypoint is a kustomize directory with the objects in namespace agent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: egress-waypoint
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
    targetRevision: "{{ .Values.revision }}"
    path: gitops/egress-waypoint
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
