# ABOUTME: ArgoCD Application for Grafana Tempo distributed tracing backend.
# ABOUTME: Receives traces from OTel Collector, queryable via Grafana. Admin and full only; attendee omits it (#475).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source (#475): the chart, and gitops/tempo/, which holds the Grafana Tempo data source. Tempo and
  # its data source arrive and leave together, so a profile that leaves tempo out (attendee) has no data
  # source pointing at a Service that is not there.
  sources:
    - chart: tempo
      # The tempo single-binary chart moved from grafana/helm-charts to
      # grafana-community/helm-charts on 2026-01-30; the old path is a dead stub.
      repoURL: https://grafana-community.github.io/helm-charts
      # The 2026-09-10 decision to stay on 2.x was made because Tempo 3 was then reachable ONLY through
      # the tempo-distributed chart, a microservices deployment (distributor, ingester, querier,
      # compactor) whose cost is multiplied fifty times across a fleet. That reason expired: the
      # single-binary chart now ships a 3.0.0 line carrying app 3.0.3, so Tempo 3 no longer requires the
      # microservices split. Taking it, still single-binary, still one pod.
      targetRevision: "3.0.0" # app 3.0.3 (single-binary; the 2.x rationale above no longer applies) (single-binary; tempo-distributed tracks app 3.0)
      helm:
        valuesObject:
          tempo:
            # lab-platform's mirror/ copy of docker.io/grafana/tempo:3.0.3, the chart's appVersion, named by its
            # linux/amd64 digest's first twelve characters (#623).
            registry: "{{ .Values.imageRegistry }}/mirror"
            repository: grafana/tempo
            tag: "3.0.3-05321ebf1f19"
            resources:
              requests: { cpu: 100m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: "0.0.0.0:4317"
                  http:
                    endpoint: "0.0.0.0:4318"
            storage:
              trace:
                backend: local
                local:
                  path: /var/tempo/traces
                wal:
                  path: /var/tempo/wal
            retention:
              24h
          persistence:
            enabled: true
            size: 5Gi
            storageClassName: gp2
    - repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
      targetRevision: "{{ .Values.revision }}"
      path: gitops/tempo
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
