# ABOUTME: ArgoCD Application for kube-prometheus-stack (Prometheus + Grafana).
# ABOUTME: Deploys full monitoring stack with ServiceMonitors, node-exporter, and dashboards.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: "91.4.1"
    helm:
      valuesObject:
        # Prometheus configuration
        prometheus:
          prometheusSpec:
            # Enable remote write receiver for OTel Collector
            enableRemoteWriteReceiver: true
            # Retention for demo
            retention: 3h
            # Resource limits
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
            # ServiceMonitor selector - match all in cluster
            serviceMonitorSelectorNilUsesHelmValues: false
            # Datadog Unified Service Tagging (#662): the operator copies these onto the Prometheus pod, and the
            # Datadog Agent tags its logs from them. Each component below gets its own burritobot- service.
            podMetadata:
              labels: { tags.datadoghq.com/service: burritobot-prometheus, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
          # Disable built-in Thanos sidecar for simplicity
          thanosService:
            enabled: false
        # Grafana configuration
        grafana:
          # Admin credentials are sourced from a Secret synced by the
          # External Secrets Operator. The matching ExternalSecret lives at
          # security/eso/grafana-admin-external-secret.yaml and pulls from
          # AWS Secrets Manager key `watch-it-burn/grafana-admin`.
          # Static admin password for the demo (was an ESO ExternalSecret backed by AWS Secrets Manager;
          # a static value removes that external dependency). verify-at-build: rotate or wire a real store.
          adminPassword: "watchitburn-admin"
          podLabels: { tags.datadoghq.com/service: burritobot-grafana, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
          # lab-platform's mirror/ copy of docker.io/grafana/grafana:13.2.2-distroless, the chart's tag, named by
          # its linux/amd64 digest's first twelve characters (#623). The k8s-sidecar image stays on quay.io: the
          # mirror holds only Docker Hub images.
          image:
            registry: "{{ .Values.imageRegistry }}/mirror"
            repository: grafana/grafana
            tag: "13.2.2-distroless-ada1141b386c"
          # Sidecar for dashboard provisioning from ConfigMaps
          sidecar:
            # Every container needs limits under require-resource-limits (Enforce on an admin cluster, #234).
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 256Mi }
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
            datasources:
              enabled: true
          # The Tempo data source (uid tempo) is NOT here: it ships with Tempo itself, as a sidecar-labelled
          # ConfigMap in gitops/tempo/ that the tempo Application deploys (#475). The attendee profile leaves
          # tempo out, and the data source goes with it instead of pointing Grafana at a Service that is not
          # there. Loki is not here either (#474): no cluster runs it, and its logs are read in Datadog.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # No Ingress (#493). Grafana is reached at grafana-<cluster>.agenticburn.com, which the apex router
          # sends to the console LB and the console's nginx fans out on Host (#233, console.conf). The old ALB
          # Ingress claimed grafana.agenticburn.com, one host for every cluster that routes.map never had a row
          # for, so it cost an internet-facing ALB per cluster for a 404, gave the access harvester a wrong URL,
          # and fed the chart's default server.domain, which made Grafana believe it lived at
          # http://grafana.agenticburn.com:3000/ and broke every absolute link it builds (Share, alert links).
          ingress:
            enabled: false
          # root_url per host, as #233 asked: this cluster's own grafana-<public-host>. The public host is the
          # cluster-identity ConfigMap that infra/datadog-cluster-identity.sh writes before the lab-bootstrap root
          # (the same source the guard-proxy and the web terminal read, #292). Grafana expands $__env{} in
          # grafana.ini itself, so the rendered ConfigMap shows where the value comes from. Optional, so a
          # cluster without the ConfigMap still starts Grafana; its absolute links then name no cluster.
          envValueFrom:
            WIB_PUBLIC_HOST:
              configMapKeyRef: { name: cluster-identity, key: public-host, optional: true }
          grafana.ini:
            server:
              domain: grafana-$__env{WIB_PUBLIC_HOST}
              root_url: https://grafana-$__env{WIB_PUBLIC_HOST}/
        # The operator's admission-webhook create/patch Jobs ship without resources and the
        # require-resource-limits policy (kyverno-policies) rejects them, which left the app
        # OutOfSync on every full-profile cluster and the Grafana Service missing there (#234).
        prometheusOperator:
          podLabels: { tags.datadoghq.com/service: burritobot-prometheus-operator, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # The config-reloader sidecar the operator injects into the Prometheus pod: the chart default
          # sets requests only, and require-resource-limits rejected the whole StatefulSet on it (#234).
          prometheusConfigReloader:
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { cpu: 200m, memory: 128Mi }
          admissionWebhooks:
            patch:
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 200m, memory: 128Mi }
        # AlertManager not needed for the workshop; disabled to slim the per-attendee node.
        alertmanager:
          enabled: false
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
        # Node exporter
        nodeExporter:
          enabled: true
        prometheus-node-exporter:
          podLabels: { tags.datadoghq.com/service: burritobot-node-exporter, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
        # Kube-state-metrics
        kubeStateMetrics:
          enabled: true
        kube-state-metrics:
          podLabels: { tags.datadoghq.com/service: burritobot-kube-state-metrics, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
        # Custom PrometheusRules for IDP-specific alerts
        additionalPrometheusRulesMap:
          idp-alerts:
            groups:
              - name: idp-node-alerts
                rules:
                  - alert: NodeNotReady
                    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Node {{`{{ $labels.node }}`}} is not ready"
                      description: "Node {{`{{ $labels.node }}`}} has been not ready for 5 minutes."
                  - alert: PodCrashLoop
                    expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
                    for: 0m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pod {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} is crash looping"
                      description: "Pod {{`{{ $labels.pod }}`}} in {{`{{ $labels.namespace }}`}} has restarted more than 3 times in 10 minutes."
              - name: idp-app-alerts
                rules:
                  - alert: ArgoCDAppDegraded
                    expr: argocd_app_info{health_status="Degraded"} == 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "ArgoCD app {{`{{ $labels.name }}`}} is degraded"
                      description: "ArgoCD application {{`{{ $labels.name }}`}} has been degraded for 5 minutes."
                  - alert: FalcoCriticalAlert
                    expr: increase(falco_events{priority="Critical"}[5m]) > 0
                    for: 0m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Falco critical alert detected"
                      description: "Falco detected a critical severity event in the last 5 minutes."
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
