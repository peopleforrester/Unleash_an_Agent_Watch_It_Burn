# ABOUTME: Backstage developer portal (#244): every app on the cluster that is not infrastructure, who owns
# ABOUTME: it and its live pods, at backstage-<cluster>.agenticburn.com. Deploys backstage/ via kustomize.
#
# Listed by values-attendee.yaml, values-full.yaml and values-admin.yaml; values-burn.yaml leaves it out. The
# image is ours and must be signed before its pod is admitted (verify/sign-images.sh, #483).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
    targetRevision: "{{ .Values.revision }}"
    path: backstage
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
