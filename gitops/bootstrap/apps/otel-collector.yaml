# ABOUTME: ArgoCD Application for OpenTelemetry Collector DaemonSet.
# ABOUTME: INSTRUCTOR profile: single Datadog org. Attendee clusters use otel-collector-attendee.yaml (#242).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: "0.173.1"
      helm:
        # lab-platform's mirror/ copy of otel/opentelemetry-collector-contrib:0.160.0, the chart's appVersion, named by
        # its linux/amd64 digest's first twelve characters (#623). It is here, not in the shared values.yaml, because
        # only an app file's values take the root's imageRegistry; valuesObject wins over the value files.
        valuesObject:
          image:
            repository: "{{ .Values.imageRegistry }}/mirror/otel/opentelemetry-collector-contrib"
            tag: "0.160.0-5b66b0dc6921"
        # Values live in the repo so the instructor and attendee Applications share one config and
        # differ by one overlay file (gitops/otel-collector/values-dual.yaml). Argo CD multi-source:
        # the second source is a ref, never deployed, only read for the value files.
        valueFiles:
          - $values/gitops/otel-collector/values.yaml
    - repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
      targetRevision: "{{ .Values.revision }}"
      ref: values
    # transform/coc_mask as a collector config file of its own, the otel-collector-coc-mask ConfigMap, which
    # values.yaml mounts and loads with a further --config (#1332). It is a ConfigMap apart from the chart's relay one
    # so that neither nears the 1 MiB a ConfigMap holds as the code-of-conduct list grows.
    - repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
      targetRevision: "{{ .Values.revision }}"
      path: gitops/otel-collector/coc-mask
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # The otel-collector-coc-mask ConfigMap carries transform/coc_mask's term patterns twice over, about 338 KB
      # with guard-proxy's 1,253 terms cut into 36 patterns (#1316, #1328, #1332). A client-side apply copies the whole
      # object into the last-applied-configuration annotation, and annotations are capped at 262,144 bytes; a
      # server-side apply writes no such copy.
      - ServerSideApply=true
