# ABOUTME: ArgoCD Application for Kyverno policy engine installation.
# ABOUTME: Deploys Kyverno 1.17+ to kyverno namespace with webhook exclusions.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    # Server-side diff (#254): the chart's CRDs carry defaults the API server strips (labels: {} and
    # more), and the client-side comparison flagged every CRD OutOfSync forever even with the labels
    # ignored. A server-side dry run compares what the API would actually store. Verified on
    # watch-it-burn-michael-student 2026-09-06: OutOfSync to Synced within a minute of this annotation.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno
    # chart 3.9.1 -> Kyverno v1.19.1 (2026-09-10), the patch bump from 3.9.0 in #389. The move to 1.19
    # (v1.19.0, 2026-08-20) is the one that patches CVE-2026-32280. The April 2026 advisories (the apiCall
    # SSRF pair GHSA-8wfp-579w-6r25 / GHSA-fmqp-4wfc-w3v7 and CVE-2026-22039 cross-namespace RBAC bypass)
    # were already fixed in 1.18, which is what we were on, so that bump was the remaining one.
    #
    # 1.19 deprecates the legacy kyverno.io ClusterPolicy/Policy types; removal is planned for 1.20. Our ten
    # policies are on the CEL types the chart installs by default (policies.kyverno.io/v1 ValidatingPolicy
    # and, for image signatures, ImageValidatingPolicy) since #206, so nothing here depends on the legacy
    # engine. verify/test_kyverno_cel_policies.py runs them through the v1.19.1 CLI;
    # test_kyverno_version_pins.py holds that pin, this chart, VERSIONS.lock and the Datadog tag together.
    targetRevision: "3.9.1"
    helm:
      valuesObject:
        # Kyverno namespace excluded by default (excludeKyvernoNamespace: true)
        # Extend webhook exclusions to include additional system namespaces
        config:
          webhooks:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - kube-system
                    - kube-public
                    - kube-node-lease
        # Resource limits for Kyverno admission controller
        admissionController:
          container:
            # Upstream's v1.19.1 with its breaker fix, kyverno/kyverno#17085, built by images/kyverno/build.sh (#1015).
            # Each controller that writes reports drops every write while its breaker is open, and in v1.19.1 the
            # breaker stays open for the rest of the pod's life the first time the watch behind its counter is
            # answered 410 Gone. On 2026-11-07 this controller had dropped 717 of 720 admission report writes on
            # watch-it-burn-community and 1788 of 2039 on watch-it-burn-private, with no EphemeralReport on either
            # cluster to count. The fix is in v1.20.0-rc.1 and in no 1.19 release; drop this override (and the
            # reports controller's) at the first release that has it. verify/test_kyverno_breaker_fix.py holds the
            # tag and digest to images.lock and build.sh, and push-kyverno.yml pushes the build to its pin.
            image:
              registry: ghcr.io
              repository: peopleforrester/watch-it-burn
              tag: "kyverno-v1.19.1-17085@sha256:c1abb924a527210bae23f6dbff273794711a2ee0447568b2d7851577d07e6fc7"
            resources:
              requests: { cpu: 100m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }
          replicas: 1
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 256Mi
              cpu: 100m
          # Datadog Agent Autodiscovery scrapes Kyverno's native Prometheus /metrics (:8000).
          #
          # REVISES meta-PRD M5 D9 (which chose native OTLP `otelConfig: grpc` to avoid an Agent check):
          # live on the cluster, Kyverno's bundled gRPC/OTel exporter fails with `name resolver error:
          # produced zero addresses` even against a literal ClusterIP (a gRPC-Go #7625 regression baked into
          # the kyverno binary), so the OTLP path delivers ZERO metrics. Switched to the Datadog Agent
          # openmetrics check, the same proven pattern as falco/cert-manager/istio. It works, and it emits
          # the `kyverno.*` metric names the official Datadog Kyverno OOTB dashboard expects. No duplicate
          # metrics (OTLP was producing none). The container name is `kyverno`. Verified live 2026-06-25.
          metering:
            config: prometheus
            port: 8000
          podAnnotations:
            ad.datadoghq.com/kyverno.checks: |
              {"kyverno":{"instances":[{"openmetrics_endpoint":"http://%%host%%:8000/metrics"}]}}
          # Datadog Unified Service Tagging (PRD #28): puts the Kyverno admission controller on the
          # service catalog / map; version = deployed Kyverno appVersion. Pod labels, not annotations:
          # the Agent reads tags.datadoghq.com/{service,env,version} off pod labels (#661).
          podLabels:
            tags.datadoghq.com/service: burritobot-kyverno
            tags.datadoghq.com/env: burritobot-kubecon-na-26
            tags.datadoghq.com/version: "v1.19.1"
        # Background controller for policy reports
        backgroundController:
          podLabels: { tags.datadoghq.com/service: burritobot-kyverno-background-controller, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
          resources:
            limits:
              memory: 256Mi
              cpu: 200m
            requests:
              memory: 128Mi
              cpu: 50m
        # Cleanup controller
        cleanupController:
          podLabels: { tags.datadoghq.com/service: burritobot-kyverno-cleanup-controller, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
          resources:
            limits:
              memory: 256Mi
              cpu: 200m
            requests:
              memory: 128Mi
              cpu: 50m
        # The chart's hook Jobs: the post-upgrade CRD migration and the pre-delete webhook cleanup (#662).
        crds:
          migration:
            podLabels: { tags.datadoghq.com/service: burritobot-kyverno-hooks, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
        webhooksCleanup:
          podLabels: { tags.datadoghq.com/service: burritobot-kyverno-hooks, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
        # Kyverno's own feature block owns the scan interval. Setting reportsController.extraArgs instead
        # looks right, applies cleanly, syncs Healthy, and changes nothing, because the chart already emits
        # --backgroundScanInterval from this value and the duplicate flag is ignored. Verified on
        # watch-it-burn-michael-admin 2026-09-08 by reading the argument off the live Deployment rather than
        # trusting Argo's Synced status.
        features:
          backgroundScan:
            backgroundScanInterval: 1h
        # Reports controller
        reportsController:
          # Challenge 2 asks a student to read the PolicyReport for a Pod they created seconds ago (#323).
          # A new or changed Pod is scanned when it is created or changed, whatever this interval says; the
          # interval only sets how often every unchanged resource is scanned again. Measured on
          # watch-it-burn-private 2026-11-05 (#608), a new bypass-shaped Pod's report arrived:
          #   30s interval, 200m CPU limit   after 528s: rescanning ~350 resources twice a minute needs about
          #                                  a whole CPU, so the controller ran throttled in 99.9% of periods
          #                                  and new Pods queued behind the rescans
          #   30s interval, 1 CPU limit      after 115s, still using the whole CPU
          #   1h interval, 200m or 1 CPU     after 45s once the startup scan was done
          #   1h interval, 200m, just after
          #   a restart                      after 275s, behind the ten-minute startup scan
          # The last line is what #323 measured on 2026-09-08 at the 1h default: no report after two minutes
          # for the Pod just deployed, while every older Pod had one. That was the startup scan after a
          # config change, not the interval.
          #
          # So the interval is the chart's 1h default again, set here so it stays explicit, and the CPU limit
          # is 1 so a full scan (at startup and hourly) takes about two minutes instead of ten. At rest the
          # controller uses about 30m CPU.
          #
          # The image is the admission controller's fix again (#1015): its background-scan breaker had dropped 14386
          # of 14704 writes on watch-it-burn-community by 2026-11-07, every one after the first 318, so no Pod
          # created in agent after the pod's first hours got a PolicyReport and Challenge 2's report line never came.
          image:
            registry: ghcr.io
            repository: peopleforrester/watch-it-burn
            tag: "kyverno-reports-controller-v1.19.1-17085@sha256:16d6029866350264601fe92207a2e2f67fd259f8053b4ad471f37bbae7f95300"
          podLabels: { tags.datadoghq.com/service: burritobot-kyverno-reports-controller, tags.datadoghq.com/env: burritobot-kubecon-na-26 }
          resources:
            limits:
              memory: 256Mi
              cpu: "1"
            requests:
              memory: 128Mi
              cpu: 50m
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The chart renders `labels: {}` on its CRDs and the API drops it, which showed every CRD OutOfSync
    # forever (#254). Ignored on the one field; RespectIgnoreDifferences keeps the sync from writing it.
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels
