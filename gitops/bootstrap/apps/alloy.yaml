# ABOUTME: ArgoCD Application for Grafana Alloy — log collection (replaces deprecated Promtail).
# ABOUTME: Ships pod logs to Loki. Promtail is EOL (Grafana retired it); Alloy is the GA successor.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: alloy
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: "1.12.1" # current GA (Promtail successor; Promtail is EOL as of early 2026)
    helm:
      valuesObject:
        controller:
          type: deployment # loki.source.kubernetes reads logs via the K8s API (no per-node hostpath)
        alloy:
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # verify-at-build: confirm Alloy config syntax against chart 1.10.0 before deploy.
          # loki.source.kubernetes drops every __meta_ label and adds only job, so without the relabel every
          # stream is {job="loki.source.kubernetes.pods"} and a query has to line-filter all of them (#464).
          # The relabel keeps the __meta_ labels the source needs to find the pod, and copies the ones a
          # query selects on into stream labels. app is the pod's app.kubernetes.io/name, else its app label
          # (workshop-mcp and evil-mcp-shim carry only app).
          configMap:
            content: |
              discovery.kubernetes "pods" { role = "pod" }
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  regex         = "(.+)"
                  target_label  = "app"
                }
              }
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.default.receiver]
              }
              loki.write "default" {
                endpoint { url = "http://loki:3100/loki/api/v1/push" }
              }
        # Limits on every container: require-resource-limits is Enforce from bootstrap on the full profile,
        # and a chart container without limits is denied outright (verify/test_enforce_floor.py, 2026-09-06).
        configReloader:
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
