# ABOUTME: Root app-of-apps for an ATTENDEE cluster. Full platform, but the three infra challenge
# ABOUTME: controls (C1/C2/C3) start UNINSTALLED so the student installs each one and watches it work.
# The attendee runs every challenge hands-on (RUN-OF-SHOW-2026-08, corrected 2026-09-04), and the
# attack-then-fix pattern needs the attack to succeed first. On the "full" profile the C1-C3 controls
# ship pre-applied, so a student's first attempt was already blocked with no fix left to apply. This
# profile is "full minus the challenge controls":
#
#   - network-policies OMITTED  -> the agent namespace has no egress policy at all, so C1 exfil works.
#       The student applies the WHOLE agent policy set (default-deny + its DNS/otel/kagent allows) in one
#       manifest; the default-deny alone would break DNS (UDP 53 is a separate allow), so it must not be
#       split. See challenges/01 and the staged file in the web-terminal.
#   - kubearmor-policies OMITTED -> block-recipe-snoop is absent, so C3 filesystem snoop works. The
#       KubeArmor ENGINE (kubearmor.yaml) is still present, so the student's applied policy takes effect.
#   - kyverno-policies KEPT but NOT armed -> restrict-image-registries ships in Audit (fleet.sh only arms
#       "full"), so C2's villain image deploys. The student flips it to Enforce.
#   - C7 needs nothing here: the rogue MCP tools ship present on every profile; the student removes them.
#
# Two apps are left out because nothing on an attendee cluster uses them (#475, from the #236 audit):
#
#   - tempo OMITTED -> no challenge or tour step reads Tempo; students read traces in Datadog. Builders
#       read raw spans out of Tempo on admin clusters, which keep it. The attendee collector overlay
#       (gitops/otel-collector/values-dual.yaml) drops the Tempo exporter from its trace lists, and the
#       Grafana Tempo data source ships inside the tempo Application (gitops/tempo/), so it goes with it.
#   - falco-talon OMITTED -> Falcosidekick forwards only CRITICAL to Talon, and Talon's two rules are the
#       fork bomb (retired as a student beat, #114; an instructor-box demo only) and Recipe Snoop, which is
#       WARNING and never reaches it. On an attendee cluster Talon acts on nothing. Falco still detects and
#       Sidekick still forwards to Datadog; its Talon output has no Service to post to here.
#
# A presenter's admin cluster takes the "admin" profile (app-of-apps-admin.yaml), where these controls are
# present and armed, because that is the guarded-state demo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-attendee
  namespace: argocd
  annotations:
    # Bumped once to prove the root reconciles its own spec from the repo (#253). Not otherwise meaningful.
    wib.agenticburn.com/root-revision: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source, and the SECOND source is this file's own directory (#253): the root reconciles its
  # own spec from staging on every sync, so a change to the selection below reaches every live cluster
  # through Argo CD. deploy-full-idp.sh applies it once at bootstrap; after that it belongs to Argo CD.
  sources:
    - repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
      targetRevision: staging
      path: gitops/apps
      directory:
        # Everything in gitops/apps EXCEPT the two challenge-control apps. kubearmor (engine) and kyverno
        # (engine) stay; only their policy bundles that would pre-block C3 and pre-enable C2 are dropped.
        # otel-collector.yaml is the instructor collector; this profile takes otel-collector-attendee.yaml,
        # the same Application name with the dual-ship overlay (#242). otel-collector-burn.yaml is the burn
        # cluster's Datadog-only collector (#476), the same name again. tempo and falco-talon stay on admin
        # and full only (#475, above).
        exclude: '{network-policies,kubearmor-policies,otel-collector,otel-collector-burn,tempo,falco-talon}.yaml'
    - repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
      targetRevision: staging
      path: gitops/bootstrap/attendee
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Kyverno's chart adds its own pre-delete finalizers to the Application at runtime, which git can never
  # match, so every root reported OutOfSync forever on a difference nobody can fix (#265). Ignored, and
  # RespectIgnoreDifferences so a sync does not try to strip them either.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
