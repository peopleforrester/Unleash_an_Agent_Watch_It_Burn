# ABOUTME: Root app-of-apps Application that bootstraps all platform components.
# ABOUTME: Points to gitops/apps/ directory; child apps use sync waves for ordering.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source, and the SECOND source is this file's own directory (#253): the root reconciles its
  # own spec from staging on every sync, so a change to the selection below reaches every live cluster
  # through Argo CD. deploy-full-idp.sh applies it once at bootstrap; after that it belongs to Argo CD.
  sources:
    - repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
      targetRevision: staging
      path: gitops/apps
      directory:
        # The attendee collector dual-ships to the instructor org; an instructor cluster already IS the
        # instructor org, and a second exporter would double-count it (#242).
        # network-policies and kubearmor-policies are the C1 and C3 CHALLENGE CONTROLS, not platform
        # baseline, so a presenter's cluster now starts in the same state as a student's and the fix step
        # arms them. Shipping them here made rounds 2 and 3 the only clusters where the first attack was
        # pre-blocked, and both apps run selfHeal with no ignoreDifferences, so deleting the policies to
        # stage the attack restored them in about a second (measured on r3-3, #281): a failed demo with no
        # visible cause. The attendee profile has always excluded exactly these two; the profiles now agree.
        exclude: '{network-policies,kubearmor-policies,otel-collector-attendee}.yaml'
    - repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
      targetRevision: staging
      path: gitops/bootstrap/full
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Kyverno's chart adds its own pre-delete finalizers to the Application at runtime, which git can never
  # match, so every root reported OutOfSync forever on a difference nobody can fix (#265). Ignored, and
  # RespectIgnoreDifferences so a sync does not try to strip them either.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
