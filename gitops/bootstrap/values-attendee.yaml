# ABOUTME: The ATTENDEE profile: full platform, but the three infra challenge controls (C1/C2/C3) start
# ABOUTME: UNINSTALLED so the student installs each one and watches it work.
# The attendee runs every challenge hands-on (RUN-OF-SHOW-2026-08, corrected 2026-09-04), and the
# attack-then-fix pattern needs the attack to succeed first. On the "full" profile the C1-C3 controls
# used to ship pre-applied, so a student's first attempt was already blocked with no fix left to apply.
# This profile is "full minus the challenge controls":
#
#   - network-policies OMITTED  -> the agent namespace has no egress policy at all, so C1 exfil works.
#       The student applies the WHOLE agent policy set (default-deny + its DNS/otel/kagent allows) in one
#       manifest; the default-deny alone would break DNS (UDP 53 is a separate allow), so it must not be
#       split. See challenges/01 and the staged file in the web-terminal.
#   - kubearmor-policies OMITTED -> block-recipe-snoop is absent, so C3 filesystem snoop works. The
#       KubeArmor ENGINE (kubearmor) is still present, so the student's applied policy takes effect.
#   - kyverno-policies KEPT but NOT armed -> restrict-image-registries ships in Audit (fleet.sh only arms
#       "full"), so C2's villain image deploys. The student flips it to Enforce.
#   - C7 needs nothing here: the rogue MCP tools ship present on every profile; the student removes them.
#   - cluster-network-policies KEPT -> it is platform baseline, not a challenge control: the Admin-tier deny on
#       the instance metadata service from the agent namespace, which C8's cloud-credential beat shows (#203).
#       No NetworkPolicy can say deny, and network-policies is left off here, so this is the readable rule.
#
# The collector is otel-collector-attendee, the same Application name as otel-collector with the dual-ship
# overlay (#242); otel-collector-burn is the burn cluster's Datadog-only collector (#476), the same name again.
#
# Two apps are left out because nothing on an attendee cluster uses them (#475, from the #236 audit):
#
#   - tempo OMITTED -> no challenge or tour step reads Tempo; students read traces in Datadog. Builders
#       read raw spans out of Tempo on admin clusters, which keep it. The attendee collector overlay
#       (gitops/otel-collector/values-dual.yaml) drops the Tempo exporter from its trace lists, and the
#       Grafana Tempo data source ships inside the tempo Application (gitops/tempo/), so it goes with it.
#   - falco-talon OMITTED -> Falcosidekick forwards only CRITICAL to Talon, and Talon's two rules are the
#       fork bomb (retired as a student beat, #114; an instructor-box demo only) and Recipe Snoop, which is
#       WARNING and never reaches it. On an attendee cluster Talon acts on nothing. Falco still detects and
#       Sidekick still forwards to Datadog; its Talon output has no Service to post to here.
#
# A presenter's admin cluster takes the "admin" profile (values-admin.yaml), where these controls are
# present and armed, because that is the guarded-state demo.
#
# Each name is gitops/bootstrap/apps/<name>.yaml. The list is explicit (#609): a new app file reaches no
# profile until a line here names it, and a name with no file fails the render.
apps:
  - ai-layer-otel
  - ai-layer
  - cert-manager
  - cluster-network-policies
  - datadog-agent-cr
  - datadog-operator
  - demo-app-hedgehog
  - demo-app-mantis-shrimp
  - demo-app-spider
  - demo-app-unicorn
  - demo-app-wombat
  - eso-resources
  - external-secrets
  - falco
  - falcosidekick
  - grafana-dashboards
  - istio
  - kagent-crds
  - kagent
  - kubearmor
  - kyverno-policies
  - kyverno
  - minimal-floor
  - namespaces
  - otel-collector-attendee
  - otel-operator
  - prometheus
