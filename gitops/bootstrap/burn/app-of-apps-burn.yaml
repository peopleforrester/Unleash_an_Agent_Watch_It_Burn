# ABOUTME: Root app-of-apps for the BURN cluster (Cluster 1, the "no guardrails" spectacle).
# ABOUTME: Deliberately bare: NO admission control at all (no Kyverno, no floor), no RBAC scoping app,
# ABOUTME: no GitOps-drift block. Just the agent + cost-meter proxy and the party burn targets. It is
# ABOUTME: meant to die in one prompt; the facilitator rotates ~10 disposable C1 spares from SSH.
# verify-at-build: confirm ArgoCD directory.include brace-glob selects exactly these child apps.
# NOTE: the agent still needs Bedrock IRSA per cluster (IAM, not GitOps) — see infra/cluster3-setup.sh / deploy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-burn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source, and the SECOND source is this file's own directory (#253): the root reconciles its
  # own spec from staging on every sync, so a change to the selection below reaches every live cluster
  # through Argo CD. deploy-full-idp.sh applies it once at bootstrap; after that it belongs to Argo CD.
  sources:
    - repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
      targetRevision: staging
      path: gitops/apps
      directory:
        # Burn subset: NO admission at all (no kyverno engine, no minimal-floor), NO RBAC/falco/
        # observability/eso/backstage. Just the agent + ai-layer (cost meter) + burn targets, plus
        # cert-manager for the console certificate (see below).
        # cert-manager is included because R1 still needs the console's TLS certificate (#139): the burn
        # profile means NO GUARDRAILS, not no infrastructure. Without it the Certificate CRD is absent, the
        # ai-layer app cannot sync, and the console Deployment (which mounts the cert) would never start.
        # It issues a self-signed cert and enforces nothing, so it does not soften the burn.
        # kubearmor (ENGINE only, NOT kubearmor-policies) is included so the runtime-enforcement engine is
        # present on all three builds per the uniform-build goal; with no KubeArmorPolicy it enforces nothing,
        # so R1 stays guardrail-free and the C3 snoop still succeeds. kubearmor-policies is OMITTED here
        # (the KubeArmorPolicy lives only in the full profile); Tetragon was retired 2026-08-30.
        # OBSERVABILITY IS NOT A GUARDRAIL. This profile is the one with nothing defending the agent:
        # no Kyverno, no NetworkPolicies, no KubeArmor policy, no Falco. That stays exactly as it is.
        # What it gains here is the ability to SEE what happens, which it had none of: it shipped no
        # collector and had zero pods in the datadog namespace (#283), so the whole room could attack it
        # and there would be nothing to look at afterwards. The Community phase ends by pulling up the
        # traces together and finding someone's successful prompt by name (#303), and that is the moment
        # the observability half of the workshop earns its place. It also puts attackme into the single
        # shared presenter org alongside the admin clusters and the students' dual-shipped telemetry
        # (#296). external-secrets and eso-resources come along because the Datadog key is pulled from
        # AWS Secrets Manager; otel-operator and ai-layer-otel because the agent pod is only traced if
        # the webhook injects it at admission.
        include: '{namespaces,cert-manager,external-secrets,eso-resources,kagent-crds,kagent,ai-layer,customer-stream,kubearmor,otel-operator,ai-layer-otel,otel-collector,datadog-operator,datadog-agent-cr,demo-app-unicorn,demo-app-hedgehog,demo-app-spider,demo-app-wombat,demo-app-mantis-shrimp}.yaml'
    - repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
      targetRevision: staging
      path: gitops/bootstrap/burn
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Kyverno's chart adds its own pre-delete finalizers to the Application at runtime, which git can never
  # match, so every root reported OutOfSync forever on a difference nobody can fix (#265). Ignored, and
  # RespectIgnoreDifferences so a sync does not try to strip them either.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
