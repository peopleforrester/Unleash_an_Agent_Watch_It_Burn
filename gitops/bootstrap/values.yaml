# ABOUTME: The values every profile shares: the revision each Unleashed source is read at, and the registry
# ABOUTME: lab-platform's images are pulled from. Each profile's app list is in its own values-<profile>.yaml.
#
# revision is empty on purpose, so a render without the parameter fails by name instead of producing
# Applications pointing at nothing. labctl sets it to the 40-digit commit it pins (lab-platform.yaml's
# bootstrap.revision_parameter); infra/deploy-full-idp.sh sets it to staging.
revision: ""
# Where every image under ghcr.io/peopleforrester/lab-platform (the mirror/ copies of #623 included) is pulled
# from (#622). Those packages are public, and nothing passes this today: lab-platform#214 passed each cluster's
# ECR pull-through cache path, <account>.dkr.ecr.<region>.amazonaws.com/<prefix>/peopleforrester/lab-platform,
# until lab-platform 5192c1a reverted it, and infra/deploy-full-idp.sh never has. It stays the one switch that
# moves them all to a cache or another mirror. An app file names such an image as
# "{{ .Values.imageRegistry }}/<path>:<tag>", never by the ghcr.io literal: verify/test_image_registry.py fails on
# the literal anywhere the root deploys from.
imageRegistry: ghcr.io/peopleforrester/lab-platform
