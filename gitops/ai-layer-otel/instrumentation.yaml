# ABOUTME: Shared OTel Operator Instrumentation CR for the custom Python pods in the AI layer (PRD #20 M2).
# ABOUTME: Sets cluster-wide OTLP endpoint/protocol + semconv opt-in; per-pod UST stays in each workload's env.
#
# STATUS: LIVE on the full profile, via its own Application (gitops/apps/ai-layer-otel.yaml, wave 2).
# Both original prerequisites have landed: the OTel Operator is deployed (gitops/apps/otel-operator.yaml,
# which owns the opentelemetry.io/v1alpha1 Instrumentation CRD), and the inject-python annotation is on
# the pod templates.
#
# This file is deliberately NOT part of the gitops/ai-layer bundle. Its CRD exists only where the OTel
# Operator is installed, and the Operator needs cert-manager; the burn (Round 1) profile ships neither.
# Because ArgoCD fails an entire sync when one resource is invalid, keeping it in that bundle made the
# whole AI layer unsyncable on Round 1 clusters, so they came up with no console and no reachable URL.
# See gitops/ai-layer-otel/kustomization.yaml for the full write-up. Do not fold it back in.
#
# The OTel Operator injects the full Python SDK into any pod annotated
# `instrumentation.opentelemetry.io/inject-python: "watch-it-burn-python"` (init-container + PYTHONPATH),
# so app images carry only opentelemetry-api (no-op until injected). This is the locked custom-app pattern
# (meta-PRD Decision Log 2026-06-24; overrides the research spikes (removed 2026-08-30; see `git log --diff-filter=D -- research/`) "No Operator").
#
# verify-at-build (PRD #20 M2 Step 1): resolve the ACTUAL Collector Service name + namespace on the live
# cluster (`kubectl get svc -A | grep -i otel-collector`) and set `exporter.endpoint` to it. The value
# below is the current-manifest candidate (the research spikes (removed 2026-08-30; see `git log --diff-filter=D -- research/`) + #20 flagged the monitoring-vs-observability
# ambiguity); do NOT assume it, confirm before relying.
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: watch-it-burn-python
  namespace: agent
spec:
  # HTTP (4318), NOT gRPC (4317): the OTel Operator's autoinstrumentation/python image ships ONLY the
  # HTTP OTLP exporter (otlp_proto_http) to avoid the grpcio C-extension bloat. Setting protocol=grpc
  # crashes the injected SDK at startup with "Requested component 'otlp_proto_grpc' not found"
  # (confirmed live 2026-06-25). This CORRECTS the PRD #20 M2 locked `grpc` decision per live evidence.
  exporter:
    endpoint: http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318
  # PIN the auto-instrumentation image. Do NOT leave this to the Operator to default.
  #
  # Found live 2026-09-01 on attendee-003: if this CR is created before the Operator's defaulting webhook
  # is ready, spec.python.image comes out EMPTY and stays empty forever. Argo CD reports the CR Synced and
  # Healthy, because the manifest never asked for an image, so nothing ever repairs it. Every pod admitted
  # afterwards then gets an initContainer with no image and is rejected as invalid
  # ("spec.initContainers[0].image: Required value"). That removed guard-proxy entirely, so BurritoBot had
  # no /chat backend, on a cluster whose pages all still returned 200 and whose Argo apps looked fine.
  # Pinning removes the race and the silent-failure mode together. Bump deliberately, with the Operator.
  python:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.63b1
  propagators: [tracecontext, baggage]
  sampler:
    type: parentbased_always_on
  env:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_SEMCONV_STABILITY_OPT_IN
      value: gen_ai_latest_experimental
    # EVENT_ONLY captures gen_ai message content as OTel span events. "true" is a silent no-op
    # under gen_ai_latest_experimental and must not be used (see otel-semconv-gotchas.md).
    - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
      value: EVENT_ONLY
