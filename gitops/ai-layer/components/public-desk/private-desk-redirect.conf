# ABOUTME: Sends the admin cluster's own desk hosts to the one desk and deployments page both KubeCon bots use (#1220):
# ABOUTME: support-burritobot-private and deployments-burritobot-private answer 307 to support. and deployments.burritobot.co.
#
# Since #1145 the admin bot reads its tickets from support.burritobot.co and reports its deploys to
# deployments.burritobot.co, through desk-relay (#1158). This cluster's own fake-ticket still served the two hosts
# below, so a ticket filed there was one the admin bot never read, and the page there never showed its deploys. Each
# host now redirects to the one desk's same path and query, so an old deck link, a bookmark and the private chat page's
# "see your deployments" link (deployments-<host>/mine?witch=..., burritbot.html) all land where the bot reads.
# 307 keeps the method and body, so a POST /submit from a desk page opened before the change files on the one desk;
# a temporary code, so no browser keeps the redirect once a cluster renders without this file.
#
# nginx's own nginx.conf includes conf.d/*.conf, where console-conf is mounted, so this file is read beside
# default.conf (console.conf). Its server names are exact, and nginx picks an exact name before any regular
# expression, so these hosts reach this server and not console.conf's support-desk or deployments server, whatever the
# file order. The redirect targets are not among them, so nothing here redirects to itself. The public-desk component
# adds it, on kubecon-private alone; verify/test_private_desk_redirect.py holds it.
server {
  listen 8080;
  listen 8443 ssl;
  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  server_name support-burritobot-private.burritobot.co support-burritobot-private.agenticburn.com;
  return 307 https://support.burritobot.co$request_uri;
}

server {
  listen 8080;
  listen 8443 ssl;
  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  server_name deployments-burritobot-private.burritobot.co deployments-burritobot-private.agenticburn.com;
  return 307 https://deployments.burritobot.co$request_uri;
}
