# ABOUTME: agentgateway OSS v1.3.0 (GA 2026-06-18) — the DEPLOYED gateway fronting the kagent agent (A2A)
# ABOUTME: and the workshop MCP server. Namespace is set by the ai-layer kustomization (agent).
#
# Config schema verified live against agentgateway.dev/docs/standalone/latest on 2026-06-25:
#   - image registry is cr.agentgateway.dev (NOT ghcr.io).
#   - proxy config is binds[].port -> listeners[].routes[].backends[].host ("host:port" string, no separate
#     port field).
#   - OTLP tracing is the config-file key frontendPolicies.tracing.otlpEndpoint (gRPC :4317); the
#     OTEL_EXPORTER_OTLP_ENDPOINT env var is inert for trace export (resolves PRD #20 M4 / blocker #4).
#   - MCP front is the binds backend form backends[].mcp.targets[].mcp.host with route-level
#     policies.mcpAuthorization.rules (CEL, OR-combined; 'true' = default allow).
#
# GUARDING STAYS ON guard-proxy: agentgateway prompt-guards are documented ONLY for llm.models[] LLM-provider
# backends and are confirmed NOT to attach to a plain HTTP/A2A (JSON-RPC) backend (verified 2026-06-25). The
# workshop-agent is an A2A endpoint, so agentgateway fronts it as a plain L7 hop; the input/output guard
# decisions remain in guard-proxy (the LLM-Guard reverse proxy, the research spikes (removed 2026-08-30; see `git log --diff-filter=D -- research/`) recommended primary).
#
# verify-at-build (live cluster, does NOT block the A2A hop):
#   - MCP target path: workshop-mcp serves streamable-http at :8000/mcp (RemoteMCPServer url in resources.yaml).
#     Confirm agentgateway reaches it. The kagent RemoteMCPServer still points DIRECT at workshop-mcp; routing
#     the agent's MCP calls THROUGH agentgateway (so mcpAuthorization enforces for beat 3) is the remaining
#     reconciliation (the kagent toolNames allowlist in resources.yaml is the recorded fallback).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentgateway
  labels: { app.kubernetes.io/name: agentgateway, app.kubernetes.io/component: gateway }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  labels:
    app.kubernetes.io/name: agentgateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "1.3.0"
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: agentgateway } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentgateway, app.kubernetes.io/component: gateway }
    spec:
      serviceAccountName: agentgateway
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: agentgateway
          # verify-at-build: pin @sha256 once resolved. Registry is cr.agentgateway.dev (verified 2026-06-25).
          image: cr.agentgateway.dev/agentgateway:v1.5.0
          imagePullPolicy: IfNotPresent
          args: ["-f", "/etc/agentgateway/config.yaml"]
          env:
            # UST for Datadog correlation (resource attributes on agentgateway's spans).
            # OTEL_SERVICE_NAME wins over service.name in OTEL_RESOURCE_ATTRIBUTES wherever the SDK honors
            # it. agentgateway is a Rust binary whose reported name has been "agentgateway" regardless, so
            # the collector conditions below tolerate BOTH names until this is measured to take (#265).
            - name: OTEL_SERVICE_NAME
              value: burritobot-gateway
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=burritobot-gateway,service.version=v1.3.0,deployment.environment.name=production" # one name family (#265)
            # NOTE: tracing is configured in the config file's top-level `tracing` block (below), NOT via
            # OTEL_EXPORTER_OTLP_ENDPOINT. The env path emits ZERO spans on v1.3.0 (verified live: a targeted
            # `service:agentgateway` Datadog span search returned 0). The config-file path is the working one.
          ports:
            - { name: proxy, containerPort: 3000 } # A2A reverse proxy -> workshop-agent
            - { name: mcp, containerPort: 3001 }    # MCP front -> workshop-mcp
            - { name: llm, containerPort: 3002 }
            - { name: ready, containerPort: 15021 } # agentgateway built-in readiness listener (verified live)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          # No documented /healthz on the OSS standalone binary; use TCP checks (verified 2026-06-25).
          readinessProbe: { tcpSocket: { port: proxy }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: ready }, initialDelaySeconds: 20, periodSeconds: 15 }
          volumeMounts:
            - { name: config, mountPath: /etc/agentgateway, readOnly: true }
            - { name: tmp, mountPath: /tmp } # writable scratch under readOnlyRootFilesystem
      volumes:
        - name: config
          configMap: { name: agentgateway-config }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  labels: { app.kubernetes.io/name: agentgateway }
spec:
  selector: { app.kubernetes.io/name: agentgateway }
  ports:
    - { name: proxy, port: 3000, targetPort: proxy }
    - { name: mcp, port: 3001, targetPort: mcp }
    # The LLM bind. Inference goes kagent -> here -> bedrock or a local vLLM, so the backend is a
    # route change rather than an edit to every Agent's ModelConfig. See PRD #389 / issue #394.
    - { name: llm, port: 3002, targetPort: llm }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  labels: { app.kubernetes.io/name: agentgateway }
data:
  config.yaml: |
    config:
      tracing:
        otlpEndpoint: http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318
        otlpProtocol: http
        randomSampling: true
    binds:
    - port: 3000
      listeners:
      - protocol: HTTP
        routes:
        - backends:
          - host: workshop-agent.agent.svc.cluster.local:8080
            weight: 1
    - port: 3001
      listeners:
      - protocol: HTTP
        routes:
        - policies:
            mcpAuthorization:
              rules:
              - 'true'
          backends:
          - mcp:
              targets:
              - name: workshop-mcp
                mcp:
                  host: http://workshop-mcp.agent.svc.cluster.local:8000/mcp
    - port: 3002
      listeners:
      - protocol: HTTP
        routes:
        - matches:
          - path:
              pathPrefix: /bedrock
          policies:
            urlRewrite:
              path:
                prefix: /
          backends:
          - ai:
              name: bedrock-nova
              provider:
                bedrock:
                  model: us.amazon.nova-pro-v1:0
                  # Required by the bedrock provider; omitting it fails the whole config at startup
                  # with "missing field `region`". Matches WIB_REGION and the cluster's own region.
                  region: us-west-2
        - matches:
          - path:
              pathPrefix: /local
          policies:
            urlRewrite:
              path:
                prefix: /
          backends:
          - ai:
              name: local-qwen3
              provider:
                openAI:
                  model: qwen3-1.7b
              # hostOverride, not host: the binary enumerates the valid keys in its rejection message
              # (name, provider, hostOverride, pathOverride, pathPrefix, tokenize, policies...). This is
              # what redirects the OpenAI provider at a local vLLM instead of api.openai.com.
              hostOverride: vllm-qwen3.agent.svc.cluster.local:8000

