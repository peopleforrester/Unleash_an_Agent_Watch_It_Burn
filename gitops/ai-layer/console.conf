# ABOUTME: Console frontend (nginx-unprivileged) — serves the BurritoBot storefront as the front door and
# ABOUTME: path-routes to the web terminal (ttyd), the BurritoBot /chat backend, the legacy chat UI, and
# ABOUTME: the guard-proxy (A2A + cost). One Service per cluster, LB-exposed.
server {
  listen 8080;
  # TLS listener for the router hop (#139). 8443 rather than 443 because nginx-unprivileged runs as a
  # non-root user and cannot bind a privileged port; the Service maps 443 -> 8443. The certificate is
  # self-signed by cert-manager (see the Certificate in resources.yaml) and the router connects with
  # tls_insecure_skip_verify: this encrypts the hop, it does not authenticate the upstream.
  #
  # The secret mount is REQUIRED (not optional): nginx references these files unconditionally, so a
  # missing secret must hold the pod Pending rather than crash-loop it.
  listen 8443 ssl;
  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name _;
  root /usr/share/nginx/html;   # burritbot.html + console.html + console.js (ConfigMap-mounted)

  # BurritoBot storefront (B1): the attendee front door. Its round selector posts to same-origin /chat
  # for round 3 (this cluster) and to round1/round2.agenticburn.com for the shared instructor clusters.
  location = /          { try_files /burritbot.html =404; }
  location = /burritbot { try_files /burritbot.html =404; }

  # Round-3 student lab page (B5/B12): Katacoda-style split, instructions left + ttyd embedded right.
  # This is what the provisioning "Open your terminal" button targets; it iframes /terminal/ below.
  location = /lab  { try_files /lab.html =404; }

  # Instructor brief for Rounds 1 and 2 (#122): the presenter-facing page with the prompts VISIBLE. A
  # deliberately SEPARATE page from /lab, which hides them behind hints for students. Not linked from the
  # student lab; presenters reach it directly.
  location = /brief { try_files /brief.html =404; }

  # The platform catalogue: every installed service, how to reach it, and its login. Exists so an attendee
  # never has to dump a ConfigMap or read a Service list to find their own Grafana.
  location = /platform { try_files /platform.html =404; }

  # The two VTT tabs ported from the Packt workshop (#153): the architecture blueprint and the component
  # endpoint catalogue. Both are embedded as iframes by lab.html and also work standalone.
  location = /diagram  { try_files /diagram.html =404; }
  location = /links    { try_files /links.html =404; }

  # The split console dashboard (terminal + chat + live cost), now under /console.
  location = /console    { try_files /console.html =404; }
  location = /console.js { try_files /console.js =404; }

  # BurritoBot backend (B1): POST {prompt} -> guard-proxy /chat, which returns {reply, guarded, tokens}.
  # Same input/output guards and cost metering as the A2A path, so the round-2/round-3 toggles affect it.
  location = /chat {
    proxy_pass http://guard-proxy:8080/chat;
    proxy_set_header Host $host;
    proxy_read_timeout 160s;
  }

  # Web terminal (ttyd serves under base-path /terminal); needs websocket upgrade.
  location /terminal/ {
    proxy_pass http://web-terminal:7681;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Browser IDE (code-server) and notebook (JupyterLab), both in the web-terminal pod so all three
  # surfaces share /home/student. A file written in any one appears in the others immediately.
  #
  # THE PREFIX HANDLING IS DELIBERATELY ASYMMETRIC BETWEEN THESE TWO. Getting either backwards yields a
  # blank tab that still answers HTTP 200, so it cannot be caught with curl and has to be opened.
  #
  #   /ide/     -> proxy_pass ending in "/"  = strip the prefix. code-server emits RELATIVE asset URLs
  #                and serves from its own root, so it must not see /ide in the path.
  #   /jupyter/ -> proxy_pass with NO "/"    = KEEP the prefix. The server runs with
  #                base_url=/jupyter and builds its own URLs from it, so stripping breaks every asset.
  location /ide/ {
    proxy_pass http://web-terminal:8443/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # code-server is websocket-driven end to end
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding gzip;       # code-server requires this when proxied
    proxy_read_timeout 3600s;
  }

  location /jupyter/ {
    proxy_pass http://web-terminal:8888;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # kernel comms are websockets
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # NO /tutor/ OR /api/tutor-nudge, deliberately. Those proxied a second ttyd running the Claude Code
  # CLI, which showed an attendee a "Trust this folder?" first-run prompt. Suppressing that relies on
  # undocumented per-project keys in the CLI's own config, so a CLI update can reintroduce it live.
  # No attendee-facing route may expose a coding-agent CLI. See issue #89.


  # Legacy split-console chat UI (its app.js posts A2A to /a2a/ and polls /cost).
  location /chat/ {
    proxy_pass http://chat-ui:80/;
    proxy_set_header Host $host;
  }

  # Guard-proxy: the A2A endpoint (root), the guard-state, and the live cost.
  location /a2a/ {
    proxy_pass http://guard-proxy:8080/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  # Cheap liveness target for the console container's probe. Served by nginx itself, so it answers even
  # when every upstream is down: the question it answers is "is this nginx alive", not "is the platform
  # healthy". A probe that depends on upstreams restarts the front door whenever a backend is restarting.
  location = /healthz { access_log off; return 200 "ok\n"; }

  location = /cost    { proxy_pass http://guard-proxy:8080/cost; }
  location = /guards  { proxy_pass http://guard-proxy:8080/guards; }
}
