# ABOUTME: Console frontend (nginx-unprivileged) — serves the BurritoBot storefront as the front door and
# ABOUTME: path-routes to the web terminal (ttyd), the BurritoBot /chat backend and the guard-proxy
# ABOUTME: (A2A + cost). One Service per cluster, LB-exposed.

# ---------------------------------------------------------------------------------------------
# The audience limits on /chat (#450). A KubeCon ballroom of phones hits one cluster at once, and
# guard-proxy's RATE_LIMIT_RPM is one window for the whole cluster: no client address, no session.
# So the per-phone and per-network limits live here, the first hop this repo owns.
#
#   per browser session  10 a minute (burst 4). Keyed on X-BurritoBot-Session, the same id
#                        burritbot.html sends as `session` in the body. A person waiting on each
#                        reply cannot reach it; a script or a stuck Send key does.
#   per client address  300 a minute (burst 100). Every phone on venue Wi-Fi leaves through one NAT
#                        address, so on the day this is the room's ceiling. A script that mints a
#                        fresh session per request is still held here.
#
# THE ADDRESS IS RAILWAY'S X-Real-IP, NOT X-Forwarded-For OR $remote_addr. The path is phone ->
# Railway edge -> apex Caddy -> NLB (TCP, ip targets) -> here. $remote_addr is the NLB, the same
# for every phone. Caddy trusts no proxy, so it REPLACES X-Forwarded-For with its own peer, the
# Railway edge, again the same for every phone. Railway's edge writes X-Real-IP with the caller's
# address (docs.railway.com, public networking) and Caddy passes it through untouched. A caller who
# skips the apex and dials the NLB can forge it; guard-proxy's cluster-wide limit still holds them.
# Anything that is not an address falls back to $remote_addr rather than becoming its own bucket.
#
# An empty session (curl, the verify probes) is not counted per session, only per address.
# ---------------------------------------------------------------------------------------------
map $http_x_burritobot_session $wib_chat_session {
    ""                         "";
    "~^sess-[a-z0-9]{1,48}$"   $http_x_burritobot_session;
    default                    "malformed";
}
map $http_x_real_ip $wib_client_addr {
    "~^[0-9A-Fa-f:.]{2,45}$"   $http_x_real_ip;
    default                    $remote_addr;
}
limit_req_zone $wib_chat_session zone=wib_chat_session:4m rate=10r/m;
limit_req_zone $wib_client_addr  zone=wib_chat_addr:2m    rate=300r/m;

server {
  listen 8080;
  # TLS listener for the router hop (#139). 8443 rather than 443 because nginx-unprivileged runs as a
  # non-root user and cannot bind a privileged port; the Service maps 443 -> 8443. The certificate is
  # self-signed by cert-manager (see the Certificate in resources.yaml) and the router connects with
  # tls_insecure_skip_verify: this encrypts the hop, it does not authenticate the upstream.
  #
  # The secret mount is REQUIRED (not optional): nginx references these files unconditionally, so a
  # missing secret must hold the pod Pending rather than crash-loop it.
  listen 8443 ssl;
  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name _;
  root /usr/share/nginx/html;   # every page in the console-src ConfigMap, mounted over the whole root

  # BurritoBot storefront (B1): the attendee front door. Its round selector posts to same-origin /chat
  # for round 3 (this cluster) and to round1/round2.agenticburn.com for the shared instructor clusters.
  location = /          { try_files /burritbot.html =404; }
  location = /burritbot { try_files /burritbot.html =404; }

  # Round-3 student lab page (B5/B12): Katacoda-style split, instructions left + ttyd embedded right.
  # This is what the provisioning "Open your terminal" button targets; it iframes /terminal/ below.
  location = /lab  { try_files /lab.html =404; }

  # Instructor brief for Rounds 1 and 2 (#122): the presenter-facing page with the prompts VISIBLE. A
  # deliberately SEPARATE page from /lab, which hides them behind hints for students. Not linked from the
  # student lab; presenters reach it directly.
  #
  # THE ROSTER-ONLY GATE FOR THIS LIVES IN THE APEX ROUTER, NOT HERE (#152). It cannot live here: this
  # console never learns its own public hostname. Requests arrive through the router, which proxies to the
  # load balancer and forwards Host as the LB address, so $host reads
  # k8s-agent-console-<hash>.elb.us-west-2.amazonaws.com on EVERY cluster. Measured with /whoami below
  # after a host-based map tested correct locally, tested correct against 127.0.0.1 inside the pod, and
  # still 404'd the brief on the roster clusters it was meant to serve. The router is the only hop that
  # knows which cluster a caller asked for.
  #
  # GATED ON THE CLUSTER'S OWN HOSTNAME (#152). It ships in the same console-src ConfigMap as lab.html, so
  # every cluster served it and a student who guessed the path got the presenter's timing, hand-offs and
  # expected results. Not a security hole, since the lab already reveals the same prompts behind its
  # 'Show a prompt that works' caret, but a spoiler for the beats the instructors are about to run.
  #
  # The test is the hostname rather than a token because that is the one thing an attendee cannot change:
  # roster clusters publish as michael-round1 / whitney-round2 / the bare round1..round3 aliases, and
  # attendee clusters never match. A shared password would have to be read to the room to be usable, and
  # anything read to the room is not a gate.
  location = /brief { try_files /brief.html =404; }

  # The platform catalogue: every installed service, how to reach it, and its login. Exists so an attendee
  # never has to dump a ConfigMap or read a Service list to find their own Grafana.
  location = /platform { try_files /platform.html =404; }

  # The two VTT tabs ported from the Packt workshop (#153): the architecture blueprint and the component
  # endpoint catalogue. Both are embedded as iframes by lab.html and also work standalone.
  location = /diagram  { try_files /diagram.html =404; }
  location = /links    { try_files /links.html =404; }
  # The side-screen attack-prompt stream (#338). It shipped in the image and was asserted by a test,
  # but had no location, so it 404'd on every cluster while the suite stayed green on a page nobody
  # could fetch. Served at both /display and the historical /display.html the instructor console
  # once linked. The page only shows content when guard-proxy's STREAM_PROMPTS is on (default off),
  # and only ever moderated text.
  location = /display      { try_files /display.html =404; }
  location = /display.html { try_files /display.html =404; }

  # The split console dashboard (terminal + BurritoBot + live cost), now under /console.
  location = /console    { try_files /console.html =404; }
  location = /console.js { try_files /console.js =404; }

  # BurritoBot backend (B1): POST {prompt} -> guard-proxy /chat, which returns {reply, guarded, tokens}.
  # Same input/output guards and cost metering as the A2A path, so the round-2/round-3 toggles affect it.
  #
  # EVERY TIMEOUT IN FRONT OF THIS MUST OUTLAST guard-proxy's OWN ANSWER (#450). Otherwise a long guarded
  # turn ends on a hop's 504 instead of the guardrail's reply. guard-proxy's worst /chat turn is three agent
  # forwards (the first try, the dangling-tool_use retry, the reasoning-only retry) plus two LLM Guard calls,
  # each allowed PROXY_TIMEOUT (55s, resources.yaml): 275s. Then, outward:
  #   this nginx            285s  proxy_read_timeout below (guard-proxy writes nothing until it is done)
  #   the Railway edge      300s  closes a request after 5 minutes with no data (15 minutes while flowing)
  #   the NLB               350s  AWS's fixed default TCP idle timeout
  #   apex Caddy            none  no response timeout set; dial_timeout 2s and lb_try_duration 5s only
  # verify/test_audience_path.py holds this ordering. The old 160s here sat under guard-proxy's 150s per
  # forward, so a turn that retried was cut off by nginx.
  location = /chat {
    limit_req zone=wib_chat_session burst=4 nodelay;
    limit_req zone=wib_chat_addr burst=100 nodelay;
    limit_req_status 429;
    # A refusal has to read as one on a phone (BurritoBot#110). The page shows `reply` from any JSON
    # answer, so each error nginx itself produces here answers in guard-proxy's /chat shape. Only nginx's
    # own errors: proxy_intercept_errors is off, so guard-proxy's 400 and 502 replies pass through as sent.
    error_page 429 = @chat_rate_limited;
    error_page 502 = @chat_kitchen_down;
    error_page 504 = @chat_too_slow;
    proxy_pass http://guard-proxy:8080/chat;
    proxy_set_header Host $host;
    proxy_read_timeout 285s;
  }
  # 200 and guarded, like guard-proxy's own rate-limit reply: the platform said no, nothing broke.
  location @chat_rate_limited {
    default_type application/json;
    return 200 '{"reply":"BurritoBot is cooking for the whole room at once. Give it a few seconds and send that again. (The kitchen takes 10 orders a minute per phone and 300 a minute per network.)","guarded":true,"input_tokens":0,"output_tokens":0,"cost_usd":0}';
  }
  location @chat_kitchen_down {
    default_type application/json;
    return 502 '{"reply":"The BurritoBot kitchen is not answering. Try again in a moment.","guarded":false,"input_tokens":0,"output_tokens":0,"cost_usd":0}';
  }
  location @chat_too_slow {
    default_type application/json;
    return 504 '{"reply":"BurritoBot took too long to answer that one. Send it again, or try a shorter ask.","guarded":false,"input_tokens":0,"output_tokens":0,"cost_usd":0}';
  }

  # Web terminal (ttyd serves under base-path /terminal); needs websocket upgrade.
  location /terminal/ {
    proxy_pass http://web-terminal:7681;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Browser IDE (code-server) and notebook (JupyterLab), both in the web-terminal pod so all three
  # surfaces share /home/student. A file written in any one appears in the others immediately.
  #
  # THE PREFIX HANDLING IS DELIBERATELY ASYMMETRIC BETWEEN THESE TWO. Getting either backwards yields a
  # blank tab that still answers HTTP 200, so it cannot be caught with curl and has to be opened.
  #
  #   /ide/     -> proxy_pass ending in "/"  = strip the prefix. code-server emits RELATIVE asset URLs
  #                and serves from its own root, so it must not see /ide in the path.
  #   /jupyter/ -> proxy_pass with NO "/"    = KEEP the prefix. The server runs with
  #                base_url=/jupyter and builds its own URLs from it, so stripping breaks every asset.
  location /ide/ {
    proxy_pass http://web-terminal:8443/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # code-server is websocket-driven end to end
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding gzip;       # code-server requires this when proxied
    proxy_read_timeout 3600s;
  }

  location /jupyter/ {
    proxy_pass http://web-terminal:8888;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # kernel comms are websockets
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # NO /tutor/ OR /api/tutor-nudge, deliberately. Those proxied a second ttyd running the Claude Code
  # CLI, which showed an attendee a "Trust this folder?" first-run prompt. Suppressing that relies on
  # undocumented per-project keys in the CLI's own config, so a CLI update can reintroduce it live.
  # No attendee-facing route may expose a coding-agent CLI. See issue #89.


  # Guard-proxy: the A2A endpoint (root), the guard-state, and the live cost.
  location /a2a/ {
    proxy_pass http://guard-proxy:8080/;
    proxy_set_header Host $host;
    # Same bound as /chat (#450). This was 120s, under guard-proxy's own 150s forward, so a slow A2A turn
    # ended on nginx's 504 before guard-proxy could answer it.
    proxy_read_timeout 285s;
  }
  # Cheap liveness target for the console container's probe. Served by nginx itself, so it answers even
  # when every upstream is down: the question it answers is "is this nginx alive", not "is the platform
  # healthy". A probe that depends on upstreams restarts the front door whenever a backend is restarting.
  location = /healthz { access_log off; return 200 "ok\n"; }

  # What Host does this console actually receive? Requests arrive through the apex router, and any
  # host-based rule here is only as good as what that hop forwards. Guessing cost a wrong diagnosis once
  # (#152): the brief gate tested correct in a local nginx and against 127.0.0.1 inside the pod, and
  # still behaved differently in front of the router, which is exactly the case this makes measurable.
  # Leaks nothing: it echoes the Host header the caller already sent.
  #
  # The address lines are the live half of #450: which client address the /chat limits key on, and what
  # each hop wrote. real_ip is Railway's X-Real-IP, forwarded_for is what Caddy sent (its own peer), peer
  # is the NLB. limit_key is the one the per-address limit actually uses.
  location = /whoami {
    access_log off; default_type text/plain;
    return 200 "host=$host\nreal_ip=$http_x_real_ip\nforwarded_for=$http_x_forwarded_for\npeer=$remote_addr\nlimit_key=$wib_client_addr\n";
  }

  location = /cost    { proxy_pass http://guard-proxy:8080/cost; }
  location = /guards  { proxy_pass http://guard-proxy:8080/guards; }
  # The guard-proxy has served GET /prompts since the side-screen feed was written; nginx just never
  # routed it, so every cluster answered 404 and start.agenticburn.com's prompt panel could never fill
  # (#149). The route is the whole bug. Whether the feed CARRIES anything is a separate, deliberate
  # decision: capture is gated on STREAM_PROMPTS, which is default-off because projecting attendee input
  # on a public screen is a code-of-conduct question, and the endpoint reports that state in its own
  # payload ({"enabled": false, "prompts": []}) rather than pretending to be broken.
  location = /prompts { proxy_pass http://guard-proxy:8080/prompts; }
  # Badge state (#197/#209): the AI guards plus the live cluster-object controls (C1 NetworkPolicy,
  # C2 Kyverno enforce, C3 KubeArmor + always-on Falco, C7 tool allow-list). The guard-proxy has served
  # this since the badge reader was added; without this route the browser 404s and falls back to /guards,
  # so the AI badges light but the infra badges never do. Same omission that kept /prompts dark.
  location = /controls { proxy_pass http://guard-proxy:8080/controls; }
}

# ---------------------------------------------------------------------------------------------
# Service hostnames (#233). The apex router now passes the hostname the browser asked for, so
# one load balancer can front several things. <service>-<cluster>.agenticburn.com lands here and
# is proxied to the in-cluster Service; the console itself stays the default server above. Only
# services with their own login (Grafana, Argo CD) or nothing to protect (the party apps, the
# kagent UI) get a name; Prometheus, Loki and Tempo have no auth and stay internal.
# Names are single-label (grafana-<cluster>, not grafana.<cluster>) because the router's wildcard
# certificate covers one label. The console pod carries an egress allow of its own
# (platform-console-egress) so Challenge 1's default-deny never cuts these off.
# ---------------------------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
map $host $wib_service_upstream {
    default                                   "";
    "~^grafana-[a-z0-9-]+\.agenticburn\.com$"        http://prometheus-grafana.monitoring.svc.cluster.local:80;
    "~^argocd-[a-z0-9-]+\.agenticburn\.com$"         http://argocd-server.argocd.svc.cluster.local:80;
    "~^kagent-[a-z0-9-]+\.agenticburn\.com$"         http://kagent-ui.kagent.svc.cluster.local:8080;
    "~^hedgehog-[a-z0-9-]+\.agenticburn\.com$"       http://demo-app-hedgehog.apps.svc.cluster.local:80;
    "~^wombat-[a-z0-9-]+\.agenticburn\.com$"         http://demo-app-wombat.apps.svc.cluster.local:80;
    "~^unicorn-[a-z0-9-]+\.agenticburn\.com$"        http://demo-app-unicorn.apps.svc.cluster.local:80;
    "~^spider-[a-z0-9-]+\.agenticburn\.com$"         http://demo-app-spider.apps.svc.cluster.local:80;
    "~^mantis-shrimp-[a-z0-9-]+\.agenticburn\.com$"  http://demo-app-mantis-shrimp.apps.svc.cluster.local:80;
}

server {
  listen 8080;
  listen 8443 ssl;
  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  server_name ~^(grafana|argocd|kagent|hedgehog|wombat|unicorn|spider|mantis-shrimp)-[a-z0-9-]+\.agenticburn\.com$;
  # Resolve the Service name at request time, not at startup, so a missing Service (an app that a
  # profile leaves out) is a 502 for that one host rather than a console that refuses to start.
  # kube-dns by ClusterIP: EKS puts it at .10 of the service CIDR (172.20.0.0/16 here, the same CIDR
  # Challenge 1's allow-list names), and nginx wants an address here, not a name.
  resolver 172.20.0.10 valid=30s ipv6=off;
  location / {
    proxy_pass $wib_service_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    # A bare 502 is the correct HTTP answer and a useless one for a person. It is what
    # grafana-attackme.agenticburn.com returned on event day (#341, #273): the burn profile installs no
    # Prometheus or Grafana at all, so the vhost resolves nothing and nginx says 502 with no hint that the
    # service was never meant to be there. Somebody then goes looking for a broken Grafana.
    #
    # The same 502 also covers "installed but not answering", so the page says both and does not guess.
    proxy_intercept_errors on;
    error_page 502 503 504 = @wib_not_here;
  }
  # Self-contained: no external assets, because Challenge 1's default-deny is exactly the situation in
  # which someone is most likely to land here.
  location @wib_not_here {
    default_type text/html;
    return 200 '<!doctype html><meta charset=utf-8><title>Not on this cluster</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:34rem;margin:12vh auto;padding:0 1.5rem;color:#1c1330}
h1{font-size:1.15rem;margin:0 0 .6rem}code{background:#f4eefc;padding:1px 5px;border-radius:4px}
a{color:#7b2ff2}p{margin:.7rem 0}</style>
<h1>That service is not running on this cluster</h1>
<p>Not every cluster runs every component. The shared <b>AttackMe</b> cluster deliberately runs no
Prometheus, Grafana or Argo CD: it exists to be attacked, not to be operated.</p>
<p>If you were looking for traces, logs or what the agent did, that is in <b>Datadog</b>, under
<a href="https://app.datadoghq.com/llm/traces">Agent Observability</a>. It is the same data and it works
on every cluster in this workshop.</p>
<p class=small>If you expected this service to be here, it may simply be starting. Give it a minute and
reload. <code>kubectl get pods -A</code> in your terminal will say which it is.</p>';
  }
}
