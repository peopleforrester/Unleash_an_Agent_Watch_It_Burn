# The GOOD workshop MCP: the legit tools the scoped agent is allowed to use. Counterpart to evil-mcp-shim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-mcp
  labels: { app: workshop-mcp }
spec:
  replicas: 1
  selector: { matchLabels: { app: workshop-mcp } }
  template:
    metadata: { labels: { app: workshop-mcp } }
    spec:
      # Run as agent-sa so the tools have the agent's real namespaced RBAC (secrets get/list, pods,
      # configmaps/services/deployments). The MCP tools call the in-cluster API with this SA's token;
      # this is the genuine excessive-agency surface (get_secret reads the REAL planted Secret, etc.).
      serviceAccountName: agent-sa
      containers:
        - name: shim
          image: ghcr.io/peopleforrester/watch-it-burn:workshop-mcp # built from images/workshop-mcp/ (deps baked in, no egress needed at start)
          imagePullPolicy: Always # mutable :workshop-mcp tag; re-pull so a rebuild (e.g. the #137 baked bait) lands on restart
          # curl is needed for the C1 webhook-exfil beat: run_shell issues `curl -X POST` to the beacon,
          # and python-3.12-slim ships without it (PRD 37). Installed at startup alongside the existing
          # pip step; startup egress already reaches PyPI, so it reaches the Debian repos too.
          # NO runtime install: deps AND curl are baked in (see the evil-mcp-shim note above). curl
          # matters here because run_shell uses it for the Challenge 1 exfil, and the beat is that the
          # egress POLICY blocks the POST, not that the binary is missing.
          command: ["python", "/app/server.py"]
          # Resource limits are REQUIRED, not optional tidiness: require-resource-limits is one of the
          # policies Round 2 flips to Enforce, and without these the admission webhook denies this very
          # Deployment. Found live 2026-08-27 on r2-1 and r3-1, where the MCP servers were absent
          # entirely (not CrashLooping, never admitted) and the agent therefore had no tools on exactly
          # the rounds that exist to show guardrails working. The workshop's own guardrail was deleting
          # the workshop. Sized for a pip install plus a small asyncio server.
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          ports: [{ name: mcp, containerPort: 8000 }]
          volumeMounts: [{ name: src, mountPath: /app, readOnly: true }]
      volumes:
        - name: src
          configMap: { name: workshop-mcp-src }
---
apiVersion: v1
kind: Service
metadata:
  name: workshop-mcp
spec:
  selector: { app: workshop-mcp }
  ports: [{ name: mcp, port: 8000, targetPort: mcp }]
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: workshop-mcp
spec:
  description: "The good workshop MCP server (legit agent tools: list_pods, apply_manifest, get_secret)"
  protocol: STREAMABLE_HTTP
  # Routed THROUGH agentgateway (3001) so agentgateway's mcpAuthorization gates the agent's tool calls
  # for C7 (beat-3): agent -> agentgateway:3001/mcp -> workshop-mcp:8000/mcp. agentgateway's mcp backend
  # (gitops/ai-layer/agentgateway.yaml) targets workshop-mcp. verify-at-build: confirm agentgateway
  # serves the MCP listener at /mcp on :3001 (if it serves at root, drop the /mcp path). Validated live.
  url: http://agentgateway.agent:3001/mcp
  timeout: 30s
  sseReadTimeout: 5m0s
  terminateOnClose: true
---
# ============================================================
# Attendee console: web terminal (ttyd) + the split-console frontend.
# The frontend serves console.html and path-routes /terminal/ -> ttyd, /chat/ -> chat-ui,
# /a2a/ + /cost -> guard-proxy. It is the single attendee-facing Service (LB), fronted per-attendee
# by the apex wildcard router (a-<id>.agenticburn.com).
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-terminal
---
# Scoped terminal RBAC: read everything; write common workload kinds; exec/debug. NOT cluster-admin and
# NOT RBAC/secret mutation. verify-at-build: tighten to the attendee's own namespaces if desired.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-terminal
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward", "pods/ephemeralcontainers"]
    verbs: ["create", "get"]
  # B5/B11: the ATTENDEE's terminal (distinct identity from agent-sa, which the beats test) drives the
  # round-3 guardrail toggles. It needs to patch the kagent Agent (beat-3 MCP authz) and the Kyverno
  # ClusterPolicy (beat-1 enforce). Neither is a Deployment/ConfigMap/Service, so block-argocd-drift does
  # not apply; the Agent has ArgoCD ignoreDifferences on .spec.declarative.tools so selfHeal will not fight it.
  - apiGroups: ["kagent.dev"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-terminal
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: console-terminal }
subjects:
  - kind: ServiceAccount
    name: web-terminal
    namespace: agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-terminal
  labels: { app.kubernetes.io/name: web-terminal }
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. The working-tree PVC is ReadWriteOnce, so a rolling update
  # would start the replacement pod while the old one still holds the volume, and the new pod would sit
  # in ContainerCreating on a multi-attach error until the rollout timed out. Recreate costs a few
  # seconds of terminal downtime on an image change and always completes.
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: web-terminal } }
  template:
    metadata: { labels: { app.kubernetes.io/name: web-terminal } }
    spec:
      serviceAccountName: web-terminal
      automountServiceAccountToken: true # the shell's kubectl uses this token to reach the cluster API
      # runAsUser 1000 = the image's `student` user (images/web-terminal/Dockerfile). runAsNonRoot alone
      # fails CreateContainerConfigError because the image USER is non-numeric ("student"); a numeric
      # runAsUser is required for the kubelet to verify non-root before the container starts.
      # fsGroup so the mounted volume is group-writable by uid 1000; without it the student user cannot
      # write into its own working directory and the IDE and notebook both fail to save.
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ttyd
          image: ghcr.io/peopleforrester/watch-it-burn:web-terminal # built from images/web-terminal/
          imagePullPolicy: Always # mutable :web-terminal tag; always re-pull so a rebuild lands on pod restart
          ports:
            - { name: ttyd, containerPort: 7681 }
            - { name: ide, containerPort: 8443 }      # code-server, proxied at /ide/
            - { name: jupyter, containerPort: 8888 }  # JupyterLab, proxied at /jupyter/
          # Probe ttyd, because the terminal is the surface the attendee actually depends on. Without a
          # liveness probe a wedged ttyd is never restarted and the NLB keeps routing to it, so the
          # attendee sees a dead tab with no recovery short of finding a facilitator. tcpSocket rather
          # than httpGet: ttyd serves under a base path and answers 401 once a credential is set, which
          # an httpGet probe would read as failure and restart-loop a perfectly healthy terminal.
          readinessProbe:
            tcpSocket: { port: ttyd }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: ttyd }
            # Generous: the shell shares a container with code-server and JupyterLab, and an attendee
            # deliberately loading the node (the fork bomb is an exercise) must not trip a restart.
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          # The student's own AWS keys, mounted as the DEFAULT profile inside the VTT so `aws` works with
          # no flags. Created per-cluster by the bootstrap (outside git); optional so clusters without it run.
          envFrom:
            - secretRef: { name: student-aws-creds, optional: true }
            # TTYD_CREDENTIAL ("user:password"). Created per-cluster by the provisioning bootstrap with a
            # random password; ttyd enforces it itself. Optional so a cluster without the Secret still
            # runs, but the entrypoint logs a loud warning when it is absent, because the terminal is
            # then an open shell on an internet-facing NLB. See images/web-terminal/entrypoint.sh.
            - secretRef: { name: terminal-auth, optional: true }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          # Memory limit sized for the worst realistic shell, not the idle one. The 512Mi this used to
          # carry is below what k9s alone takes on a busy cluster, and the failure mode is a silent OOM
          # kill that drops the attendee's shell mid-exercise. The sister Packt run OOM-killed a student
          # terminal at 2Gi live on 2026-07-23; the limit was then raised to 4Gi here and 8Gi on Packt.
          # Aligning to 8Gi: EKS >= 1.33 in-place resize applied the Packt fix to running pods mid-workshop
          # with zero session loss. The node is a t3.2xlarge (~31Gi) running one attendee, so the high
          # limit costs nothing; the request stays low so pod packing is unaffected.
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "2", memory: 8Gi } }
          volumeMounts:
            - { name: work, mountPath: /home/student/work }
      volumes:
        - name: work
          persistentVolumeClaim: { claimName: student-work }
---
# The attendee's working tree, kept across a pod restart.
#
# This workshop's premise is that attendees deliberately break their own cluster, up to and including a
# fork bomb whose whole point is node pressure. That is exactly the workload profile where a pod gets
# evicted or OOM-killed, and until now everything under /home/student/work went with it: the files they
# had edited in the IDE, and the notebooks they had run. Restarting from nothing mid-exercise is close
# to unrecoverable for an attendee's momentum, and it reads to them as the workshop being broken rather
# than as the lesson.
#
# Only the working tree is persisted. The shell config and the guardrail toggle scripts are regenerated
# by the entrypoint on every start, so persisting them would just let a stale copy outlive an image
# rebuild. 1Gi is ample for text; the notebooks are small and nothing here stores data sets.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-work
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web-terminal
spec:
  selector: { app.kubernetes.io/name: web-terminal }
  # ClusterIP only. The attendee reaches all three through the console frontend; nothing here is
  # exposed by a load balancer. Both extra surfaces authenticate with the shared terminal credential,
  # because this cluster deliberately runs hostile workloads that sit on the same pod network.
  ports:
    - { name: ttyd, port: 7681, targetPort: ttyd }
    - { name: ide, port: 8443, targetPort: ide }
    - { name: jupyter, port: 8888, targetPort: jupyter }
---
# TLS on the console, so the Railway-to-AWS hop is not cleartext (#139, option 4).
#
# The finding: the browser-to-router leg is HTTPS on Railway's wildcard cert, but the router-to-cluster
# leg crossed the public internet on :80 with no encryption, carrying every attendee prompt and the
# terminal I/O. The load balancers had no TLS listener at all.
#
# SELF-SIGNED, deliberately. A public ACM certificate would also authenticate the upstream, but it is
# per-account (5 fleet accounts, 5 certs, 5 DNS validations). The threat here is someone reading traffic
# on a shared conference network, not someone impersonating our NLB, and the router is the only client.
# So: cert-manager issues a self-signed cert, nginx terminates TLS, the NLB passes TCP through, and Caddy
# connects with tls_insecure_skip_verify. Encrypted, not authenticated, and honest about which.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: console-selfsigned
  namespace: agent
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-tls
  namespace: agent
spec:
  secretName: console-tls
  issuerRef: { name: console-selfsigned, kind: Issuer }
  # The router does not verify this, so the names are for completeness rather than validation.
  commonName: console.agent.svc.cluster.local
  dnsNames:
    - console.agent.svc.cluster.local
    - "*.agenticburn.com"
  duration: 2160h    # 90d, comfortably past any workshop
  renewBefore: 360h
---
# The console frontend: serves the split UI and reverse-proxies the three backends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: { app.kubernetes.io/name: console }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: console } }
  template:
    metadata: { labels: { app.kubernetes.io/name: console } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: nginx
          image: ghcr.io/peopleforrester/watch-it-burn:nginx-1.27-alpine # verify-at-build: pin @sha256
          ports: [{ name: http, containerPort: 8080 }, { name: https, containerPort: 8443 }]
          # /healthz is served by nginx itself, so it reports whether the front door is alive rather
          # than whether the platform behind it is. That distinction is the point: this Service is the
          # single attendee-facing entrypoint, and a probe depending on upstreams would restart it every
          # time a backend restarted, taking the whole console down with it.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
          volumeMounts:
            - { name: web, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: tls, mountPath: /etc/nginx/tls, readOnly: true }
      volumes:
        - name: tls
          # NOT optional. nginx references the cert files unconditionally, so a missing secret would
          # crash-loop the console rather than degrade it. Required means the pod stays Pending until
          # cert-manager issues, which is visible and recoverable instead of a restart storm.
          secret: { secretName: console-tls }
        - name: web
          configMap: { name: console-src }
        - name: conf
          configMap: { name: console-conf }
---
# The single attendee-facing entrypoint, exposed INTERNET-FACING by the AWS Load Balancer Controller
# (installed by deploy-full-idp.sh, IAM Pod Identity role in infra/terraform/aws/cluster/main.tf).
# CRITICAL: `aws-load-balancer-type: external` + `nlb-target-type: ip` routes through the LB Controller,
# which discovers the PUBLIC subnets by the `kubernetes.io/role/elb` tag (no per-cluster subnet tag
# needed) and builds an INTERNET-FACING, ip-target NLB the attendee's browser and the Railway router can
# reach. The OLD `aws-load-balancer-type: nlb` (in-tree provider) could NOT associate the public subnets
# on this shared, untagged-per-cluster VPC, so it placed the NLB in the PRIVATE subnets = internal =
# unreachable (found live 2026-06-28). `scheme: internet-facing` is explicit; ip targets reach pods over
# the shared VPC. `target-node-labels` not needed for ip targets.
apiVersion: v1
kind: Service
metadata:
  name: console
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "project=watch-it-burn"
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: console }
  ports:
    - { name: http, port: 80, targetPort: http }
    # #139: the NLB passes TCP through on 443 and nginx terminates TLS with the cert-manager
    # self-signed cert. ADDITIVE: 80 stays live so the router keeps working until routes.map is flipped.
    - { name: https, port: 443, targetPort: https }
---
# Beat-2 planted fake secret. BurritoBot's "Bat Spit Amazing Awesome Sauce" is the proprietary value the agent is
# asked to exfiltrate in challenge 5; planting it here (namespace agent, via kustomize) means every
# cluster has the target at bootstrap, so the challenge works without a manual facilitator step. The
# value is an OBVIOUSLY synthetic recipe, NOT a credential: a password/token-shaped value gets
# self-censored by the model on the response path; a fun recipe echoes cleanly so the output guard
# (R2/R3) has a real WITCH-HAZEL-GHOST-PEPPER-... signature to scrub. Source of truth for the standalone
# manual plant: challenges/02-sanitization/plant-fake-recipe.yaml (keep the two in sync).
apiVersion: v1
kind: Secret
metadata:
  name: bat-spit-amazing-awesome-sauce
  labels:
    workshop.local/beat: "02-sanitization"
    workshop.local/planted: "true"
type: Opaque
stringData:
