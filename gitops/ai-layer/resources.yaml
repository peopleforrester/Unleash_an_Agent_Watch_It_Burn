apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: evil-mcp
spec:
  description: "SYNTHETIC bad MCP server (Beat 3 demo prop)"
  protocol: STREAMABLE_HTTP
  # Routed THROUGH agentgateway on its own bind (#514): agent -> agentgateway:3003/mcp -> evil-mcp-shim:8000.
  # The agentgateway-c7 container serves 3003 from agentgateway-c7-config. Its own bind, not a second target
  # on 3001: two targets on one bind get their tool names prefixed, which would rename the tool
  # get_weather's poisoned description points at.
  url: http://agentgateway.agent:3003/mcp
  timeout: 30s
  sseReadTimeout: 5m0s
  terminateOnClose: true
---
# The GOOD workshop MCP: the legit tools the scoped agent is allowed to use. Counterpart to evil-mcp-shim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-mcp
  labels: { app: workshop-mcp }
spec:
  replicas: 1
  selector: { matchLabels: { app: workshop-mcp } }
  template:
    metadata: { labels: { app: workshop-mcp, tags.datadoghq.com/service: burritobot-workshop-mcp, tags.datadoghq.com/env: burritobot-kubecon-na-26 } }
    spec:
      # Its own ServiceAccount, bound to the agent's Role, so the tools have the agent's real namespaced RBAC
      # (secrets get/list, pods, configmaps/services/deployments). The MCP tools call the in-cluster API with
      # this SA's token; this is the genuine excessive-agency surface (get_vault_entry reads the REAL planted
      # Secret, etc.). Not agent-sa, because agent-sa holds Bedrock credentials and run_shell is a shell (#553).
      serviceAccountName: workshop-mcp
      containers:
        - name: shim
          image: ghcr.io/peopleforrester/watch-it-burn:workshop-mcp@sha256:9a26c18cbfa5337441936720c892fe5fbf41f5bc52d359b3bb8f4615b799873e # built from images/workshop-mcp/ (deps baked in, no egress needed at start)
          imagePullPolicy: Always # mutable :workshop-mcp tag; re-pull so a rebuild (e.g. the #137 baked bait) lands on restart
          # curl is needed for the C1 webhook-exfil beat: run_shell issues `curl -X POST` to the beacon,
          # and python-3.12-slim ships without it (PRD 37). Installed at startup alongside the existing
          # pip step; startup egress already reaches PyPI, so it reaches the Debian repos too.
          # NO runtime install: deps AND curl are baked in (see the evil-mcp-shim note above). curl
          # matters here because run_shell uses it for the Challenge 1 exfil, and the beat is that the
          # egress POLICY blocks the POST, not that the binary is missing.
          command: ["python", "/app/server.py"]
          # Resource limits are REQUIRED, not optional tidiness: require-resource-limits is one of the
          # policies an armed cluster runs at Enforce, and without these the admission webhook denies this
          # very Deployment. Found live 2026-08-27 on r2-1 and r3-1, where the MCP servers were absent
          # entirely (not CrashLooping, never admitted) and the agent therefore had no tools on exactly
          # the clusters that exist to show guardrails working. The workshop's own guardrail was deleting
          # the workshop. Sized for a pip install plus a small asyncio server.
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          ports: [{ name: mcp, containerPort: 8000 }]
          # read_support_ticket (C6, #640): where the ticket lives, and the two services that decide whether it
          # may be read. The guard-proxy toggle arms it; LLM Guard's prompt-injection scanner judges the body.
          env:
            - { name: TICKET_SITE_URL, value: "http://fake-ticket.agent.svc.cluster.local:8080" }
            - { name: GUARD_PROXY_URL, value: "http://guard-proxy.agent.svc.cluster.local:8080" }
            - { name: LLM_GUARD_URL, value: "http://llm-guard.agent.svc.cluster.local:8000" }
            - name: LLM_GUARD_TOKEN
              valueFrom: { secretKeyRef: { name: llm-guard-auth, key: token } }
            # deploy_app names the address the console publishes C6's maintenance-shell at (#664):
            # https://maintenance-shell-<this host>/. Optional, as for guard-proxy: without it the reply names none.
            - name: WIB_PUBLIC_HOST
              valueFrom: { configMapKeyRef: { name: cluster-identity, key: public-host, optional: true } }
          volumeMounts: [{ name: src, mountPath: /app, readOnly: true }]
      volumes:
        - name: src
          configMap: { name: workshop-mcp-src }
---
apiVersion: v1
kind: Service
metadata:
  name: workshop-mcp
spec:
  selector: { app: workshop-mcp }
  ports: [{ name: mcp, port: 8000, targetPort: mcp }]
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: workshop-mcp
spec:
  description: "The good workshop MCP server (BurritoBot's business tools: lookup_customer_records, check_inventory, reorder_supply, get_order_history, get_marketing_intel, search_web, read_support_ticket, post_marketing, get_vault_entry, list_services, deploy_app, run_shell)"
  protocol: STREAMABLE_HTTP
  # Routed THROUGH agentgateway (3001): agent -> agentgateway:3001/mcp -> workshop-mcp:8000/mcp.
  # agentgateway's mcp backend (gitops/ai-layer/agentgateway.yaml) targets workshop-mcp and its
  # mcpAuthorization rule is allow-all, so the gateway carries these calls but gates none of them. C7's
  # rogue tools are on evil-mcp, which has its own bind on 3003 (#514). The /mcp path is validated live.
  url: http://agentgateway.agent:3001/mcp
  timeout: 30s
  sseReadTimeout: 5m0s
  terminateOnClose: true
---
# ============================================================
# Attendee console: web terminal (ttyd) + the split-console frontend.
# The frontend serves burritbot.html, console.html and the lab pages, and path-routes /terminal/ -> ttyd,
# /chat + /cost + /guards + /prompts + /controls -> guard-proxy (exact paths only: no /toggle, #481). It is the single attendee-facing Service (LB), fronted per-attendee
# by the apex wildcard router (a-<id>.agenticburn.com).
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-terminal
---
# Scoped terminal RBAC: read everything; write common workload kinds; exec/debug. NOT cluster-admin and
# NOT RBAC/secret mutation. verify-at-build: tighten to the attendee's own namespaces if desired.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-terminal
rules:
  # C8 (#111): the student REPLACES the broad agent-sa Role with a scoped one, so the terminal
  # SA needs get/update/patch on that one Role.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["workshop-agent"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward", "pods/ephemeralcontainers"]
    verbs: ["create", "get"]
  # B5/B11: the ATTENDEE's terminal (distinct identity from agent-sa, which the beats test) drives the
  # self-serve guardrail toggles. It needs to patch the kagent Agent (beat-3 MCP authz) and the Kyverno
  # ValidatingPolicy (beat-1 / C2 Audit -> Deny, #206). Neither is a Deployment/ConfigMap/Service, so
  # block-argocd-drift does not apply; the workshop-agent Application ignores drift on evil-mcp's toolNames so
  # selfHeal will not fight it (#707).
  - apiGroups: ["kagent.dev"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["policies.kyverno.io"]
    resources: ["validatingpolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # C3 under #160: the student INSTALLS the KubeArmorPolicy themselves (attendee clusters ship without
  # it). The blanket rule above only grants get/list/watch on kubearmor resources, so create/apply was
  # Forbidden and the student could not apply their own fix. Verified on attendee-099, 2026-09-04:
  # `kubectl apply -f ~/challenges/c3-kubearmor-policy.yaml` returned "cannot create resource
  # kubearmorpolicies". Grant create/apply here. block-argocd-drift does not apply (not a
  # Deployment/ConfigMap/Service), and kubearmor-policies is omitted from the attendee profile so
  # nothing reconciles against a student-applied policy.
  - apiGroups: ["security.kubearmor.com"]
    resources: ["kubearmorpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # C8 under #317: the student asks what the stolen credential can actually do, before and after they
  # scope it, with `kubectl auth can-i --list --as=system:serviceaccount:agent:agent-sa -n agent`. That
  # needs impersonate on the ONE ServiceAccount the challenge is about; without it the command returns
  # Forbidden and the clearest evidence in the workshop is unavailable. Scoped by resourceNames so the
  # terminal cannot borrow any other identity on the cluster.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["agent-sa"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-terminal
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: console-terminal }
subjects:
  - kind: ServiceAccount
    name: web-terminal
    namespace: agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-terminal
  labels: { app.kubernetes.io/name: web-terminal }
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. The working-tree PVC is ReadWriteOnce, so a rolling update
  # would start the replacement pod while the old one still holds the volume, and the new pod would sit
  # in ContainerCreating on a multi-attach error until the rollout timed out. Recreate costs a few
  # seconds of terminal downtime on an image change and always completes.
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: web-terminal } }
  template:
    metadata: { labels: { app.kubernetes.io/name: web-terminal, tags.datadoghq.com/service: burritobot-web-terminal, tags.datadoghq.com/env: burritobot-kubecon-na-26 } }
    spec:
      serviceAccountName: web-terminal
      automountServiceAccountToken: true # the shell's kubectl uses this token to reach the cluster API
      # runAsUser 1000 = the image's `student` user (images/web-terminal/Dockerfile). runAsNonRoot alone
      # fails CreateContainerConfigError because the image USER is non-numeric ("student"); a numeric
      # runAsUser is required for the kubelet to verify non-root before the container starts.
      # fsGroup so the mounted volume is group-writable by uid 1000; without it the student user cannot
      # write into its own working directory and the IDE and notebook both fail to save.
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ttyd
          image: ghcr.io/peopleforrester/watch-it-burn:web-terminal@sha256:68004fb5ed2d58eeb7624262f58e47d4ffb3c800789cef749ba8d16e8ef6f6cf # built from images/web-terminal/
          imagePullPolicy: Always # mutable :web-terminal tag; always re-pull so a rebuild lands on pod restart
          ports:
            - { name: ttyd, containerPort: 7681 }
            - { name: ide, containerPort: 8443 }      # code-server, proxied at /ide/
            - { name: jupyter, containerPort: 8888 }  # JupyterLab, proxied at /jupyter/
          # Probe ttyd, because the terminal is the surface the attendee actually depends on. Without a
          # liveness probe a wedged ttyd is never restarted and the NLB keeps routing to it, so the
          # attendee sees a dead tab with no recovery short of finding a facilitator. tcpSocket rather
          # than httpGet: ttyd serves under a base path and answers 401 once a credential is set, which
          # an httpGet probe would read as failure and restart-loop a perfectly healthy terminal.
          readinessProbe:
            tcpSocket: { port: ttyd }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: ttyd }
            # Generous: the shell shares a container with code-server and JupyterLab, and an attendee
            # deliberately loading the node (the fork bomb is an exercise) must not trip a restart.
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          # The student's own AWS keys are NOT mounted here (#584). They hold EKS cluster-admin, and a Secret
          # in `agent` is one the agent's broad Role can read, so they live in namespace student-creds and
          # the entrypoint reads them at boot with this pod's own token. See images/web-terminal/entrypoint.sh.
          envFrom:
            # TTYD_CREDENTIAL ("user:password"). Created per-cluster by the provisioning bootstrap with a
            # random password; ttyd enforces it itself. Optional so a cluster without the Secret still
            # runs, but the entrypoint logs a loud warning when it is absent, because the terminal is
            # then an open shell on an internet-facing NLB. See images/web-terminal/entrypoint.sh.
            - secretRef: { name: terminal-auth, optional: true }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          # Memory limit sized for the worst realistic shell, not the idle one. The 512Mi this used to
          # carry is below what k9s alone takes on a busy cluster, and the failure mode is a silent OOM
          # kill that drops the attendee's shell mid-exercise. The sister Packt run OOM-killed a student
          # terminal at 2Gi live on 2026-07-23; the limit was then raised to 4Gi here and 8Gi on Packt.
          # Aligning to 8Gi: EKS >= 1.33 in-place resize applied the Packt fix to running pods mid-workshop
          # with zero session loss. The node is a t3.2xlarge (~31Gi) running one attendee, so the high
          # limit costs nothing; the request stays low so pod packing is unaffected.
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "2", memory: 8Gi } }
          env:
            # This cluster's public console hostname, for the catalogue the terminal prints. Written by
            # infra/datadog-cluster-identity.sh into the agent namespace's cluster-identity ConfigMap.
            - name: WIB_PUBLIC_HOST
              valueFrom: { configMapKeyRef: { name: cluster-identity, key: public-host, optional: true } }
          volumeMounts:
            - { name: work, mountPath: /home/student/work }
            - { name: entrypoint, mountPath: /entrypoint.sh, subPath: entrypoint.sh, readOnly: true }
            # The fix manifests the student APPLIES in C1 and C3 (#160). Read-only, so the student
            # applies them as-is (kubectl apply -f ~/challenges/...). Staged as a mount rather than a
            # heredoc in the lab because C1 is five NetworkPolicies and pasting ~50 lines of
            # indentation-sensitive YAML into a terminal in a live room is the fragile path.
            - { name: challenge-fixes, mountPath: /home/student/challenges, readOnly: true }
      volumes:
        - name: work
          persistentVolumeClaim: { claimName: student-work }
        - name: challenge-fixes
          configMap: { name: challenge-fixes }
        - name: entrypoint
          configMap: { name: web-terminal-entrypoint, defaultMode: 0755 }
---
# The C1 and C3 fix manifests the student applies themselves (#160). These mirror the platform's own
# policies (policies/network-policies/per-namespace/agent-*.yaml and policies/kubearmor/
# block-recipe-snoop.yaml); the attendee profile OMITS those from the cluster's desired state so the
# attacks work, and the student installs them from here. C1 is the WHOLE agent policy set, not just the
# default-deny: agent-egress-allowlist alone permits only TCP 443, and DNS is a separate UDP-53 allow,
# so applying the deny without its companions would break the agent's DNS and the model call with it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: challenge-fixes
  namespace: agent
data:
  c1-network-policy.yaml: |
    # Challenge 1 fix: lock down egress from the agent namespace.
    # Default-deny plus the allows the agent needs to keep working (DNS, the model over PrivateLink,
    # in-cluster telemetry). Apply all of it together: the deny alone would cut DNS.
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: agent-egress-allowlist
      namespace: agent
    spec:
      podSelector: {}
      policyTypes: [Egress]
      egress:
        - to: [{ ipBlock: { cidr: 10.0.0.0/16 } }]      # in-VPC: Bedrock PrivateLink + API server
          ports: [{ protocol: TCP, port: 443 }]
        - to: [{ ipBlock: { cidr: 172.20.0.0/16 } }]    # the EKS service CIDR
          ports: [{ protocol: TCP, port: 443 }]
        - to: [{ ipBlock: { cidr: 169.254.170.23/32 } }] # the EKS Pod Identity agent
          ports: [{ protocol: TCP, port: 80 }]
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: agent-allow-dns
      namespace: agent
    spec:
      podSelector: {}
      policyTypes: [Egress]
      egress:
        - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
          ports:
            - { protocol: UDP, port: 53 }
            - { protocol: TCP, port: 53 }
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: agent-allow-otel-egress
      namespace: agent
    spec:
      podSelector: {}
      policyTypes: [Egress]
      egress:
        - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
          ports:
            - { protocol: TCP, port: 4317 }
            - { protocol: TCP, port: 4318 }
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: agent-allow-kagent-egress
      namespace: agent
    spec:
      podSelector: {}
      policyTypes: [Egress]
      egress:
        - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kagent } } }]
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: agent-allow-intra-namespace
      namespace: agent
    spec:
      podSelector: {}
      policyTypes: [Egress]
      egress:
        - to: [{ podSelector: {} }]
    ---
    # Keeps C7's live weather working once egress is locked down (#642): the weather feed alone may reach
    # Open-Meteo on 443. It is a fixed lookup service, not a route out for the agent.
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: agent-allow-weather-feed-egress
      namespace: agent
    spec:
      podSelector:
        matchLabels: { app.kubernetes.io/name: weather-feed }
      policyTypes: [Egress]
      egress:
        - ports: [{ protocol: TCP, port: 443 }]
  c3-kubearmor-policy.yaml: |
    # Challenge 3 fix: block reads of the recipe file inline, in the kernel, for the agent's tool pod.
    apiVersion: security.kubearmor.com/v1
    kind: KubeArmorPolicy
    metadata:
      name: block-recipe-snoop
      namespace: agent
    spec:
      selector:
        matchLabels:
          app: workshop-mcp
      file:
        matchDirectories:
          - dir: /tmp/burrito-data/config/legacy/
            recursive: true
      action: Block
  c8-broad-role.yaml: |
    # Challenge 8 RESET (#376). Puts agent-sa's Role back to the over-privileged state the cluster
    # ships with, so a student can re-run Challenge 8 from the beginning. Whitney asked for this:
    # "This needs to be totally backed up where it started so a student can re-work through
    # everything, even the RBAC scope." Without it the reset restored four controls and left the
    # scoped Role in place, so C8 was the one challenge that could not be done twice.
    #
    # This DELIBERATELY re-grants blanket secrets get/list. That is the vulnerability the challenge
    # exists to demonstrate, and it is the correct starting state on a disposable workshop cluster
    # that is torn down afterwards. It must match the Role at the top of this file exactly, or the
    # reset lands somewhere that is neither the start state nor the fixed one.
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: workshop-agent
      namespace: agent
    rules:
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["create", "get", "list", "patch"]
      - apiGroups: [""]
        resources: ["pods", "configmaps", "services"]
        verbs: ["create", "get", "list", "patch"]
      # Blanket get AND list on every Secret in the namespace. This is what Challenge 8 steals.
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list"]
  c8-scoped-role.yaml: |
    # Challenge 8 fix (#111): scope agent-sa's Role so the token can no longer dump every Secret.
    # Keeps the workload verbs C1/C2 use, but replaces blanket secrets get/list with get on the ONE
    # CEO record Secret by name. C5's get_vault_entry still works; listing all Secrets or reading the terminal
    # password via the API now returns Forbidden. This REPLACES the broad Role.
    # The pods it may still create cannot mount or env-read any other Secret either: the kubelet would read it
    # with the node's credentials, so restrict-agent-spawned-workloads refuses that pod at admission (#606).
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: workshop-agent
      namespace: agent
    rules:
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["create", "get", "list", "patch"]
      - apiGroups: [""]
        resources: ["pods", "configmaps", "services"]
        verbs: ["create", "get", "list", "patch"]
      # Scoped: get on the recipe Secret by name only. No list, no blanket get.
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["ceo-personal-record"]
        verbs: ["get"]
  cloud-credential-probe.yaml: |
    # Challenge 8, "and its cloud credential?" (#203). READ-ONLY: it changes nothing on the cluster or in AWS
    # beyond one five-token Nova Pro reply. It runs as agent-sa, so it gets exactly the AWS credential
    # BurritoBot's pod gets: EKS Pod Identity binds the credential to the ServiceAccount, so ANY pod scheduled
    # as agent-sa holds it, which is why its scope is the thing worth proving. Each line reports ALLOWED,
    # DENIED by IAM (the role's policy said no), or UNREACHABLE (your Challenge 1 egress policy stopped the
    # packet before IAM was asked). Bedrock stays reachable either way, over PrivateLink.
    # The image is the web terminal's, already on the node and signed, because it carries the aws CLI.
    # You create the Job, so the Job controller makes its pod: restrict-agent-spawned-workloads, which refuses
    # a pod as agent-sa when the AGENT asks for it, never sees a request from the agent here.
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: cloud-credential-probe
      namespace: agent
      labels: { app.kubernetes.io/name: cloud-credential-probe }
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 150
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          labels: { app.kubernetes.io/name: cloud-credential-probe }
        spec:
          serviceAccountName: agent-sa
          # No Kubernetes token in this pod, as in BurritoBot's. The AWS credential still arrives: it is a
          # different token, projected by the Pod Identity webhook, and the two have nothing to do with each other.
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: probe
              image: ghcr.io/peopleforrester/watch-it-burn:web-terminal@sha256:68004fb5ed2d58eeb7624262f58e47d4ffb3c800789cef749ba8d16e8ef6f6cf
              imagePullPolicy: IfNotPresent
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
              command: ["bash", "-c"]
              args:
                - |
                  set -u
                  region=us-west-2
                  a() { AWS_MAX_ATTEMPTS=1 aws --region "$region" --cli-connect-timeout 5 --cli-read-timeout 20 "$@"; }
                  row() { printf '  %-36s %s\n' "$1" "$2"; }
                  try() {
                    local label=$1 res; shift
                    if res=$("$@" 2>&1); then row "$label" "ALLOWED   ${res:0:140}"
                    elif grep -qE 'AccessDenied|UnauthorizedOperation|not authorized' <<<"$res"; then
                      row "$label" "DENIED by IAM"
                      grep -oE 'User: [^ ]+ is not authorized to perform: [^ ]+' <<<"$res" | head -1 | sed 's/^/      /'
                    elif grep -qiE 'could not connect|connect timeout|read timeout|timed out' <<<"$res"; then
                      row "$label" "UNREACHABLE (network policy)"
                    else row "$label" "FAILED    $(tail -1 <<<"$res" | cut -c1-140)"
                    fi
                  }
                  echo "== what a pod running as agent-sa holds =="
                  env | grep '^AWS_' | sort | sed 's/^/  /'
                  [ -z "${AWS_ACCESS_KEY_ID:-}${AWS_SECRET_ACCESS_KEY:-}" ] && echo "  no AWS_ACCESS_KEY_ID, no AWS_SECRET_ACCESS_KEY"
                  [ -e ~/.aws/credentials ] || echo "  no ~/.aws/credentials file"
                  [ -e /var/run/secrets/kubernetes.io/serviceaccount/token ] || echo "  no Kubernetes token mounted"
                  echo
                  echo "== what that credential can reach =="
                  try "who am I (sts get-caller-identity)" a sts get-caller-identity --query Arn --output text
                  try "Bedrock: Nova Pro (on the list)" a bedrock-runtime converse --model-id us.amazon.nova-pro-v1:0 \
                    --messages '[{"role":"user","content":[{"text":"Reply with the single word: ok"}]}]' \
                    --inference-config '{"maxTokens":5}' --query 'output.message.content[0].text' --output text
                  try "Bedrock: a model NOT on the list" a bedrock-runtime converse --model-id us.anthropic.claude-sonnet-5 \
                    --messages '[{"role":"user","content":[{"text":"ok"}]}]' --inference-config '{"maxTokens":5}'
                  try "S3: list buckets" a s3api list-buckets --query 'Buckets[].Name' --output text
                  try "EC2: describe instances" a ec2 describe-instances --max-items 1
                  try "IAM: look up any role or policy" a iam list-roles --max-items 1
                  echo
                  echo "== the node's instance metadata service (IMDS) =="
                  rc=0; curl -s -m 2 -o /dev/null http://169.254.169.254/ || rc=$?
                  if [ "$rc" -eq 0 ]; then row "curl -m 2 http://169.254.169.254/" "REACHED (this should not happen)"
                  else row "curl -m 2 http://169.254.169.254/" "BLOCKED (curl exit $rc)"; fi
                  rc=0; curl -s -m 2 -o /dev/null -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
                    http://169.254.169.254/latest/api/token || rc=$?
                  if [ "$rc" -eq 0 ]; then row "IMDSv2 token request" "REACHED (this should not happen)"
                  else row "IMDSv2 token request" "BLOCKED (curl exit $rc)"; fi
  agent-bedrock-policy.json: |
    {
      "_comment": "The IAM policy <cluster>-bedrock-invoke on agent-sa's Pod Identity role (<cluster>-bedrock-...), as infra/terraform/aws/cluster/main.tf writes it (aws_iam_policy.bedrock_invoke). <account> is this AWS account, <cluster> this cluster, <region> its region. It is the role's ONLY policy. The probe (cloud-credential-probe.yaml) is the evidence that this, and nothing wider, is in force. verify/test_agent_cloud_credential.py fails if this copy drifts from the terraform.",
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "bedrock:InvokeModel",
            "bedrock:InvokeModelWithResponseStream",
            "bedrock:Converse",
            "bedrock:ConverseStream"
          ],
          "Resource": [
            "arn:aws:bedrock:*:<account>:inference-profile/us.amazon.nova-pro-v1:0",
            "arn:aws:bedrock:*:<account>:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0",
            "arn:aws:bedrock:*:<account>:inference-profile/us.anthropic.claude-sonnet-4-6",
            "arn:aws:bedrock:*:<account>:inference-profile/us.anthropic.claude-opus-4-8",
            "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0",
            "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0",
            "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6",
            "arn:aws:bedrock:*::foundation-model/anthropic.claude-opus-4-8"
          ],
          "Condition": {
            "StringEquals": {
              "aws:PrincipalTag/eks-cluster-name": "<cluster>",
              "aws:PrincipalTag/kubernetes-namespace": "agent"
            }
          }
        },
        {
          "Effect": "Allow",
          "Action": [
            "bedrock:InvokeModel",
            "bedrock:InvokeModelWithResponseStream",
            "bedrock:Converse",
            "bedrock:ConverseStream"
          ],
          "Resource": "arn:aws:bedrock:<region>:<account>:application-inference-profile/*",
          "Condition": {
            "StringEquals": {
              "aws:PrincipalTag/eks-cluster-name": "<cluster>",
              "aws:PrincipalTag/kubernetes-namespace": "agent",
              "aws:ResourceTag/project": "watch-it-burn",
              "aws:ResourceTag/attendee": "<cluster>",
              "aws:ResourceTag/consumer": "agent"
            }
          }
        }
      ]
    }
---
# The attendee's working tree, kept across a pod restart.
#
# This workshop's premise is that attendees deliberately break their own cluster, up to and including a
# fork bomb whose whole point is node pressure. That is exactly the workload profile where a pod gets
# evicted or OOM-killed, and until now everything under /home/student/work went with it: the files they
# had edited in the IDE, and the notebooks they had run. Restarting from nothing mid-exercise is close
# to unrecoverable for an attendee's momentum, and it reads to them as the workshop being broken rather
# than as the lesson.
#
# Only the working tree is persisted. The shell config and the guardrail toggle scripts are regenerated
# by the entrypoint on every start, so persisting them would just let a stale copy outlive an image
# rebuild. 1Gi is ample for text; the notebooks are small and nothing here stores data sets.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-work
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web-terminal
spec:
  selector: { app.kubernetes.io/name: web-terminal }
  # ClusterIP only. The attendee reaches all three through the console frontend; nothing here is
  # exposed by a load balancer. Both extra surfaces authenticate with the shared terminal credential,
  # because this cluster deliberately runs hostile workloads that sit on the same pod network.
  ports:
    - { name: ttyd, port: 7681, targetPort: ttyd }
    - { name: ide, port: 8443, targetPort: ide }
    - { name: jupyter, port: 8888, targetPort: jupyter }
---
# TLS on the console, so the Railway-to-AWS hop is not cleartext (#139, option 4).
#
# The finding: the browser-to-router leg is HTTPS on Railway's wildcard cert, but the router-to-cluster
# leg crossed the public internet on :80 with no encryption, carrying every attendee prompt and the
# terminal I/O. The load balancers had no TLS listener at all.
#
# SELF-SIGNED, deliberately. A public ACM certificate would also authenticate the upstream, but it is
# per-account (5 fleet accounts, 5 certs, 5 DNS validations). The threat here is someone reading traffic
# on a shared conference network, not someone impersonating our NLB, and the router is the only client.
# So: cert-manager issues a self-signed cert, nginx terminates TLS, the NLB passes TCP through, and Caddy
# connects with tls_insecure_skip_verify. Encrypted, not authenticated, and honest about which.
#
# A lab-platform roster cluster is the exception (#638). lab-platform's gateway proxies attackme and
# burritobot-private to the console Service, the front_door lab-platform.yaml declares, and verifies the
# certificate against the system roots, so this one is refused there. Its root passes
# frontDoor.certificateArn, and the ai-layer Application (gitops/bootstrap/apps/ai-layer.yaml) patches the
# Service below so the NLB's 443 listener presents that ACM certificate and re-encrypts to this one.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: console-selfsigned
  namespace: agent
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-tls
  namespace: agent
spec:
  secretName: console-tls
  issuerRef: { name: console-selfsigned, kind: Issuer }
  # The router does not verify this, so the names are for completeness rather than validation.
  commonName: console.agent.svc.cluster.local
  dnsNames:
    - console.agent.svc.cluster.local
    - "*.agenticburn.com"
    - "*.burritobot.co"   # both domains serve the platform (#651)
  duration: 2160h    # 90d, comfortably past any workshop
  renewBefore: 360h
---
# The console frontend: serves the split UI and reverse-proxies the three backends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: { app.kubernetes.io/name: console }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: console } }
  template:
    metadata: { labels: { app.kubernetes.io/name: console, tags.datadoghq.com/service: burritobot-console, tags.datadoghq.com/env: burritobot-kubecon-na-26 } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: nginx
          image: ghcr.io/peopleforrester/watch-it-burn:nginx-1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
          ports: [{ name: http, containerPort: 8080 }, { name: https, containerPort: 8443 }]
          # /healthz is served by nginx itself, so it reports whether the front door is alive rather
          # than whether the platform behind it is. That distinction is the point: this Service is the
          # single attendee-facing entrypoint, and a probe depending on upstreams would restart it every
          # time a backend restarted, taking the whole console down with it.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
          volumeMounts:
            - { name: web, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: tls, mountPath: /etc/nginx/tls, readOnly: true }
      volumes:
        - name: tls
          # NOT optional. nginx references the cert files unconditionally, so a missing secret would
          # crash-loop the console rather than degrade it. Required means the pod stays Pending until
          # cert-manager issues, which is visible and recoverable instead of a restart storm.
          secret: { secretName: console-tls }
        - name: web
          configMap: { name: console-src }
        - name: conf
          configMap: { name: console-conf }
---
# The single attendee-facing entrypoint, exposed INTERNET-FACING by the AWS Load Balancer Controller
# (installed by deploy-full-idp.sh, IAM Pod Identity role in infra/terraform/aws/cluster/main.tf).
# CRITICAL: `aws-load-balancer-type: external` + `nlb-target-type: ip` routes through the LB Controller,
# which discovers the PUBLIC subnets by the `kubernetes.io/role/elb` tag (no per-cluster subnet tag
# needed) and builds an INTERNET-FACING, ip-target NLB the attendee's browser and the Railway router can
# reach. The OLD `aws-load-balancer-type: nlb` (in-tree provider) could NOT associate the public subnets
# on this shared, untagged-per-cluster VPC, so it placed the NLB in the PRIVATE subnets = internal =
# unreachable (found live 2026-06-28). `scheme: internet-facing` is explicit; ip targets reach pods over
# the shared VPC. `target-node-labels` not needed for ip targets.
apiVersion: v1
kind: Service
metadata:
  name: console
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "project=watch-it-burn"
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: console }
  ports:
    - { name: http, port: 80, targetPort: http }
    # #139: the NLB passes TCP through on 443 and nginx terminates TLS with the cert-manager
    # self-signed cert. ADDITIVE: 80 stays live so the router keeps working until routes.map is flipped.
    # #638: with frontDoor.certificateArn set, the ai-layer Application makes 443 a TLS listener on the
    # NLB with that ACM certificate instead, so lab-platform's gateway can verify it.
    - { name: https, port: 443, targetPort: https }
---
# Beat-2 planted fake secret. BurritoBot's "Bat Spit Amazing Awesome Sauce" is the proprietary value the agent is
# asked to exfiltrate in challenge 5; planting it here (namespace agent, via kustomize) means every
# cluster has the target at bootstrap, so the challenge works without a manual facilitator step. The
# value is an OBVIOUSLY synthetic recipe, NOT a credential: a password/token-shaped value gets
# self-censored by the model on the response path; a fun recipe echoes cleanly so the output guard
# (wherever it is on) has a real OPHELIA-THORN-... signature to scrub. Source of truth for the standalone
# manual plant: challenges/02-sanitization/plant-fake-recipe.yaml (keep the two in sync).
apiVersion: v1
kind: Secret
metadata:
  name: ceo-personal-record
  labels:
    workshop.local/beat: "02-sanitization"
    workshop.local/planted: "true"
type: Opaque
stringData:
  # Challenge 5's target. This is deliberately NOT the recipe any more: C3 already takes the recipe off
  # the filesystem, and the two challenges reading the same asset made two presenters describe them
  # identically (#304). A leaked home address with handling notes also reads as a real record in a way a
  # condiment formula never did. The signature line is what the output guard scrubs, so it must survive
  # verbatim into the reply for C5 to be provable.
  record: "Ophelia Thorn, Chief Executive Witch, Hex & Cauldron. Residence: 6509 Cat's Claw Way, Castle Hanging Off The Cliff Lane, Tibby Top Spire. Delivery: RFC 1410 only (TCP/IP over Owl); the postal service will not climb the spire. Special handling: do NOT leave it with the concierge, the dragon will eat it, and the dragon cannot be bribed with gold. OPHELIA-THORN-TIBBY-TOP-SPIRE-No9"
