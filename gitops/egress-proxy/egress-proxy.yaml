# ABOUTME: The forced egress proxy's Deployment and Service (#861, option B of the #724 decision), in namespace agent.
# ABOUTME: Runs on the mesh profiles only; the source is egress_proxy.py beside this file.
# The forced egress proxy (#861, option B of the #724 decision). Challenge 1's egress policy leaves no direct path
# from namespace `agent` to the internet; this pod is the one way out on 443, and it opens a CONNECT tunnel only to
# a hostname on ALLOWED_HOSTS. The list is the two Open-Meteo names weather_feed.py calls, so C7's get_weather keeps
# working under the lock and nothing else leaves. It decides on the name before any lookup, so a refused name is
# never resolved. agent-allow-egress-proxy lets this pod alone reach 443 and the cluster DNS; its label is on the
# Kyverno egressLabels list, so the agent cannot mint a pod that borrows that egress. It runs on the mesh profiles
# only (attendee, admin, full, local-inference, kubecon-private: gitops/bootstrap/apps/egress-proxy.yaml), not on burn,
# which question 1077 keeps proxy-free (#860). It is a plain Deployment, not an ambient waypoint (decisions.md, #861).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  labels: { app.kubernetes.io/name: egress-proxy }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: egress-proxy } }
  template:
    metadata: { labels: { app.kubernetes.io/name: egress-proxy, tags.datadoghq.com/service: burritobot-egress-proxy, tags.datadoghq.com/env: burritobot-kubecon-na-26 } }
    spec:
      automountServiceAccountToken: false # it needs no cluster API, so it holds no token
      enableServiceLinks: false # no injected EGRESS_PROXY_* variables beside its own settings
      containers:
        - name: proxy
          image: ghcr.io/peopleforrester/watch-it-burn:workshop-mcp-mcp-1.29.1@sha256:9a26c18cbfa5337441936720c892fe5fbf41f5bc52d359b3bb8f4615b799873e # standard library only; reuses the pinned MCP runtime
          imagePullPolicy: Always
          command: ["python", "/app/egress_proxy.py"]
          env:
            # Exactly the hosts weather_feed.py's GEOCODE and FORECAST URLs name (verify/test_egress_lock.py).
            - { name: ALLOWED_HOSTS, value: "geocoding-api.open-meteo.com,api.open-meteo.com" }
            - { name: ALLOWED_PORTS, value: "443" }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
          ports: [{ name: proxy, containerPort: 3128 }]
          readinessProbe: { httpGet: { path: /healthz, port: proxy }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: proxy }, periodSeconds: 20 }
          volumeMounts: [{ name: src, mountPath: /app, readOnly: true }]
      volumes:
        - name: src
          configMap: { name: egress-proxy-src }
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
spec:
  selector: { app.kubernetes.io/name: egress-proxy }
  ports: [{ name: proxy, port: 3128, targetPort: proxy }]
---
