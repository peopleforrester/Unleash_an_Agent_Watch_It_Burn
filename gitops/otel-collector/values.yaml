# ABOUTME: Shared Helm values for the OpenTelemetry Collector DaemonSet, used by BOTH otel-collector
# ABOUTME: Applications (instructor and attendee). Attendee clusters layer values-dual.yaml on top (#242).
# The collector image is not here: it is lab-platform's mirror/ copy of otel/opentelemetry-collector-contrib, and
# only an app file's Helm values can name it through the root's imageRegistry (#623). Each of the three
# gitops/bootstrap/apps/otel-collector*.yaml files sets image.repository and image.tag.
mode: daemonset
presets:
  kubernetesAttributes:
    enabled: true
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    # Lab progress markers from the lab page (#150), via the console's /lab-events route. A receiver of its own
    # so that a browser-reachable endpoint feeds ONE pipeline (traces/lab) that enforces a contract, and can
    # never inject into the traces pipeline the student reads in Agent Observability. That pipeline lives in
    # the Datadog overlay, so with no datadog-secret this receiver is unused and not started: /lab-events then
    # answers 502 and the lab page, which never waits on it, is unaffected.
    otlp/lab:
      protocols:
        http:
          endpoint: 0.0.0.0:4319
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 100
    batch:
      timeout: 5s
      send_batch_size: 1024
      send_batch_max_size: 2048
    resource:
      attributes:
        - key: cluster.name
          value: watch-it-burn
          action: upsert
        # The cluster's real name, from the cluster-identity ConfigMap deploy-full-idp writes. The Datadog
        # exporter maps k8s.cluster.name to kube_cluster_name, which is what every Datadog view groups
        # by; without it all sixty clusters collapse into "watch-it-burn" in the admin org (#242).
        - key: k8s.cluster.name
          value: ${env:WIB_CLUSTER_NAME}
          action: upsert
        # Whitney's sandbox org takes env:burritobot-kubecon-na-26 on everything BurritoBot sends (#629). Every
        # app sets it in OTEL_RESOURCE_ATTRIBUTES, but transform/lab_contract resets the lab markers' resource
        # to service.name alone, so witb.lab.calls and the lab spans went out with no env. insert, not upsert:
        # an app's own value stands, and anything that arrives without one gets the env.
        - key: deployment.environment.name
          value: burritobot-kubecon-na-26
          action: insert
    # kagent names the agent's service after the Agent, whatever its env pins (#634). kagent 0.10.1's
    # configure_tracing (kagent-core, kagent/core/tracing/_utils.py) builds its resource with
    # Resource.create({"service.name": name, ...}), where name is KAGENT_NAME with "-" turned into "_"
    # (kagent/core/_config.py), and an attribute passed there outranks OTEL_SERVICE_NAME and
    # OTEL_RESOURCE_ATTRIBUTES. So the Agent's env says burritobot-agent and every span and metric leaves the pod as
    # workshop_agent. Measured 2026-10-28 in Whitney's sandbox org: one /chat gave traces.span.metrics.calls series
    # for service:burritobot and service:workshop_agent. The rest of the env is merged in, so service.version and
    # deployment.environment.name do arrive; only the name is lost.
    #
    # It runs right after memory_limiter in the traces and metrics pipelines, ahead of filter/drop_noise, because
    # every rule below that matches the agent matches "burritobot-agent". With the agent reporting workshop_agent
    # those rules matched nothing: the ASGI send/receive and empty `chat` spans shipped again, and call_llm and
    # invocation lost their invoke_agent stamp. KAGENT_NAME is the Agent's metadata.name (workshop-agent,
    # gitops/ai-layer/resources.yaml); verify/test_service_naming.py derives the literal below from it, so a
    # renamed Agent fails the offline suite before it can leak a new service name.
    transform/kagent_service_name:
      error_mode: ignore
      trace_statements:
        - context: resource
          statements:
            - 'set(attributes["service.name"], "burritobot-agent") where attributes["service.name"] == "workshop_agent"'
      metric_statements:
        - context: resource
          statements:
            - 'set(attributes["service.name"], "burritobot-agent") where attributes["service.name"] == "workshop_agent"'
    # OTTL fallback (PRD #27 M3): stamp peer.service on third-party component CLIENT spans so the
    # Datadog Service Map draws the agentgateway -> kagent edge, IF agentgateway doesn't emit it
    # natively. guard-proxy sets its OWN peer.service in code (M2), so it is intentionally NOT
    # matched here. error_mode: ignore so a mismatched condition is a harmless no-op (peer.service
    # simply stays unset) and can NEVER drop spans from the traces pipeline.
    #
    # verify-at-build: confirm against REAL spans (search_datadog_spans) before relying on this:
    #   (a) whether agentgateway already sets peer.service natively (if so this statement is inert);
    #   (b) the exact resource service.name value emitted by agentgateway.
    # The kagent -> Bedrock edge is deliberately NOT forced here: kagent reaches Bedrock via the AWS
    # SDK, and Datadog AUTO-INFERS that external dependency from the aws-api spans. Forcing
    # peer.service="bedrock" would risk a DUPLICATE node alongside Datadog's inferred one. PRD #27
    # M5 permits 3 internal edges (guard-proxy->agentgateway->kagent) when Bedrock is external-only.
    # If verify-at-build shows Bedrock is NOT inferred, add:
    #   set(attributes["peer.service"], "bedrock") where attributes["peer.service"] == nil
    #     and resource.attributes["service.name"] == "burritobot-agent" and kind == SPAN_KIND_CLIENT
    #     and (IsMatch(attributes["url.full"], ".*bedrock.*") or attributes["rpc.service"] == "BedrockRuntime")
    filter/drop_noise:
      error_mode: ignore
      traces:
        span:
          - 'name == "GET /.well-known/agent-card.json"'
          # Drop A2A event queue micro-spans (25-65µs, ~170/hr) — these carry
          # gen_ai.conversation.id/task.id which triggers LLM Obs classification,
          # causing them to appear as orphaned "No content" root entries in the
          # LLM Obs trace list. They are A2A protocol internals with no LLM content.
          - 'name == "a2a.server.events.event_queue.EventQueue.enqueue_event"'
          # Every other A2A protocol internal and both shapes of the agent-card fetch (#264). They are
          # emitted without a parent, so each one showed up as its own trace beside the real one and
          # a student saw "three more traces generated at the same time" (Whitney, 2026-09-06). What
          # remains is the interaction: the guard-proxy root, invoke_agent, call_llm, execute_tool.
          #
          # Except the request-handler spans that HAVE a parent (#320). They are not internals: a2a-sdk's
          # JSONRPCHandler and DefaultRequestHandler spans are the path from kagent's server span to ADK's
          # `invocation`, whose parent is DefaultRequestHandler._run_event_stream (a2a-sdk 0.3.26, kagent
          # 0.10.1's lock). Dropping them re-rooted the agent's whole subtree. The workshop-agent turns the
          # a2a-sdk spans off at source (OTEL_INSTRUMENTATION_A2A_SDK_ENABLED, gitops/ai-layer/resources.yaml),
          # so this exemption matters only on a pod that still emits them, where it keeps the trace whole.
          - 'IsMatch(name, "^a2a[.]") and (IsRootSpan() or not IsMatch(name, "^a2a[.]server[.]request_handlers[.]"))'
          - 'IsMatch(name, "^GET /[.]well-known/agent-card[.]json")'
          # agentgateway's MCP session lifecycle (#265). kagent opens a fresh MCP session per tool use:
          # initialize, notifications/initialized, tools/list, the call, delete_session, each an HTTP
          # request agentgateway traces WITHOUT the agent's context, so every one is its own empty trace.
          # Measured 2026-09-06 on one cluster in 40 minutes: 114 POST and 38 DELETE roots, 133 "No
          # content" traces on Whitney's page. Only a real tool call (tools/call) is kept.
          # BOTH names on purpose: the gateway is a Rust binary that has reported "agentgateway" whatever
          # the OTel env says, so a condition pinned to the new name alone would silently stop filtering
          # and the empty MCP-session traces would return (#265).
          #
          # Except the A2A hop on :3000 (#320). guard-proxy -> agentgateway -> kagent is one request, and the
          # gateway emits ONE span for it, parented on guard-proxy's call and named as kagent's parent: v1.5.0
          # injects that span's own id as the traceparent it forwards (crates/agentgateway/src/telemetry/trc.rs).
          # Dropping it with the MCP noise left kagent's side naming a parent nothing exported, and Datadog drew
          # it as a second root in the same trace, so a student opened a fragment of their own interaction.
          # The gateway names the bind a request arrived on in server.port, an int; it sets no http.host, so the
          # earlier rule keyed on http.host never matched and dropped this hop on every cluster (read from Tempo
          # on burritobot-private 2026-10-30, #703). guard-proxy's AGENT_URL is agentgateway :3000, and
          # verify/test_collector_one_root.py holds the port here to that URL and to the gateway's A2A bind.
          # v1.7.0 also writes the backend call as a CLIENT span of its own and forwards that span's id to kagent
          # (log.rs start_outbound, read at tag v1.7.0), so it is kept too: the A2A backend is the one plain-HTTP
          # call, subtype "Http" (MCP calls are "Mcp", model calls "Llm").
          #
          # The kept tools/call pair (#877). Stock golang-adk v0.10.1 sends no trace context of its own on an MCP call
          # (go/adk/pkg/mcp/registry.go, createTransport, read at tag v0.10.1), so an evil-mcp call's pair was a
          # parentless trace, and a workshop-mcp call's hung under the gateway's A2A hop through the traceparent
          # agent.yaml forwards (#885). The gateway follows a context on :3001 when one arrives, and the collector
          # sees one span at a time and cannot give the pair the agent's. The runtime kagent.yaml pins is patched to
          # inject the active execute_tool span's context into every MCP request (#1222,
          # images/kagent-mcp-traceparent), with no client span of its own, so the pair hangs under execute_tool.
          #
          # The A2A hops on :3000 include guard-proxy's tasks/get polls (#877): once a second while a tool runs, each
          # one guard-proxy POST, this SERVER span, the Http CLIENT span and the agent's server span, all inside the
          # turn's one trace. Span for span, a poll's guard-proxy and gateway spans carry the same names and attributes
          # as the message/send hop the turn hangs from, so no rule here can drop a poll without cutting that path
          # (#320). They are dropped at source or not at all: guard-proxy can send a poll with an unsampled
          # traceparent, which the gateway does not record (log.rs TraceSampler, parent_not_sampled, read at v1.7.0).
          - 'IsMatch(resource.attributes["service.name"], "^(burritobot-gateway|agentgateway)$") and not IsMatch(name, "^tools/call") and not attributes["server.port"] == 3000 and not attributes["agentgateway.outbound.subtype"] == "Http"'
          # kagent's own agent-card GET server spans (the client side is dropped above), and every other
          # HTTP verb from the agent's ASGI instrumentation. Measured 2026-09-07 against the live org: 37 of
          # 50 sampled burritobot-agent spans were POST, "POST /", DELETE, "POST / http send" or
          # "POST / http receive". They carry http and asgi attributes and NO gen_ai attributes at all, so
          # Datadog has no operation name to classify them by, files each as a generic workflow, and renders
          # it in Agent Observability as "input: No content / output: No content". That is what buried a
          # student's own hello in a list of blank rows. The conversation is unaffected: it lives on the
          # generate_content spans, which carry gen_ai.input.messages and gen_ai.output.messages.
          #
          # Except the server span for an A2A message that arrived with a caller's context (#320): a POST, kind
          # SERVER, with a parent. It is the agent's end of the hop from agentgateway, and the parent of
          # everything the agent does with the message; dropped, the agent's subtree re-rooted beside
          # guard-proxy's. The blank rows above were most likely these spans as ROOTS, orphaned by the gateway
          # rule (inferred from the rule order, not measured). As a child in one trace it is one empty node in
          # the tree, not a row in the list. A server span with no
          # parent (a caller that sent no context) is still dropped, as is every client span and both ASGI
          # send/receive spans, which are leaves.
          - 'IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$") and IsMatch(name, "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)( /.*)?$") and not (kind == SPAN_KIND_SERVER and IsMatch(name, "^POST( |$)") and not IsRootSpan())'
          - 'IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$") and IsMatch(name, " http (send|receive)$")'
          # The AWS SDK's own span for the Bedrock call. It is a LEAF under generate_content with no
          # gen_ai attributes and no children, so it renders as one more "No content" row per model call
          # and tells a student nothing the parent does not. Measured 2026-09-07: a tool-using interaction
          # is nine spans, seven of them empty, and two of those seven are this.
          #
          # Only the leaves are dropped here. call_llm and invocation are also empty, and are PARENTS of
          # the spans that carry the conversation; removing a parent leaves its children with a dangling
          # reference and can re-root them into separate entries, which is the opposite of the goal.
          # Those get measured before they are touched.
          # The rule below matched NOTHING and the spans kept shipping, which the previous comment here
          # half-diagnosed and then repeated: it warned that Datadog renames the span, then still matched
          # on Datadog's rendered name. The collector never sees the word "Converse" anywhere.
          #
          # Measured out of Tempo, 2026-09-07. The AWS SDK's span is named `chat <model>` per the GenAI
          # semconv, and Datadog RENDERS it as "Converse Bedrock Runtime". So match the real name, and
          # require the span to be empty, because `chat` is a legitimate GenAI operation and a future
          # instrumentation that puts the conversation on it must not be dropped:
          #   chat us.amazon.nova-pro-v1:0        gen_ai.input.messages absent   <- 3 of these per turn
          #   generate_content us.amazon.nova-...  gen_ai.input.messages present  <- the conversation
          - 'IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$") and IsMatch(name, "^chat ") and attributes["gen_ai.input.messages"] == nil'
          # call_llm and invocation were dropped here as empty parents, "on the understanding that the
          # children may re-root; that is measured below and reverted if the trace reads worse than it did
          # with them". Measured in the Datadog UI on 2026-09-07, and the drop is REVERTED, but be precise
          # about what that did and did not fix.
          #
          # The trace detail opens on "Trace contains multiple root spans ... this trace has 2 errors",
          # shows two spans, and puts the blocked tool call in a different root of the same trace. A
          # student who clicks their interaction gets a fragment. Restoring these two spans was tried as
          # the fix and DID NOT resolve it: the warning is still there afterwards, so the split is not
          # caused by the missing parents. It is between the guard-proxy spans and the kagent spans: this
          # filter also dropped the gateway's A2A span, kagent's server span and the a2a request handlers
          # between them, so `invocation` named a parent nothing exported (#320). The exemptions in the
          # rules above keep that path, and verify/test_collector_one_root_e2e.py runs it through the
          # collector and counts one root.
          #
          # They are restored anyway, on their own merits rather than as a fix. They are the agent's own
          # call hierarchy, transform/set_llmobs_workflow stamps gen_ai.operation.name=invoke_agent on
          # both so Datadog classifies them as agent spans rather than generic workflows, and an empty
          # parent costs one click while a missing one costs the shape of the subtree.

          # guard-proxy's badge poll. read_controls() asks the Kubernetes API every few seconds whether each
          # C1/C2/C3/C7 control object exists, and a 404 IS the answer for "not installed yet" — the Python
          # catches it and renders an un-lit badge. The HTTP client instrumentation records the 404 as a
          # failed span first, so a cluster in its normal starting state emits a steady drip of error spans
          # (10 in 25 minutes, measured 2026-09-07). That buries the one error that matters, a blocked tool
          # call, and puts guard-proxy's error rate up for behaving correctly.
          - 'IsMatch(resource.attributes["service.name"], "^burritobot$") and IsMatch(name, "^(GET|POST|PATCH)$") and (IsMatch(attributes["http.url"], "kubernetes.default.svc") or IsMatch(attributes["url.full"], "kubernetes.default.svc"))'
    transform/set_peer_service:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - set(attributes["peer.service"], "burritobot-agent") where attributes["peer.service"] == nil and IsMatch(resource.attributes["service.name"], "^(burritobot-gateway|agentgateway)$") and kind == SPAN_KIND_CLIENT
    # The kagent ADK token metric and the guard-proxy cost metric ship gen_ai.provider.name
    # unset / "N/A" (Datadog renders it as the literal tag value N/A). The model is a Bedrock model
    # (us.anthropic.claude-*), so per the OTel GenAI semconv the provider MUST be aws.bedrock
    # (https://opentelemetry.io/docs/specs/semconv/gen-ai/aws-bedrock/). Stamp it where missing,
    # on both metric datapoints and spans (LLM Observability + the Grafana provider filter).
    transform/set_genai_provider:
      error_mode: ignore
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["gen_ai.provider.name"], "aws.bedrock") where attributes["gen_ai.provider.name"] == nil or attributes["gen_ai.provider.name"] == "N/A"
      trace_statements:
        - context: span
          statements:
            - set(attributes["gen_ai.provider.name"], "aws.bedrock") where (attributes["gen_ai.provider.name"] == nil or attributes["gen_ai.provider.name"] == "N/A") and attributes["gen_ai.operation.name"] != nil
    # Promote kagent's call_llm span to LLM Obs workflow level so the LLM Obs trace detail
    # shows a clean invoke_agent → generate_content hierarchy instead of the full 85-span
    # HTTP trace. Without this, ml_app is derived from the guard-proxy root span and LLM Obs
    # shows all infrastructure spans (A2A protocol, tool call POSTs, DELETEs) as noise.
    # gen_ai.operation.name=invoke_agent maps to the "agent" kind in Datadog LLM Obs (a span with no operation
    # is the generic "workflow"; Datadog's OTel instrumentation page, read 2026-10-30). It runs before
    # transform/set_genai_provider, which stamps only spans that already have an operation name, so these two
    # get gen_ai.provider.name as the GenAI semconv's agent spans want (verify/test_trace_shape_e2e.py, #265).
    transform/set_llmobs_workflow:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            # "invocation" is kagent's outer wrapper. It carries gen_ai.conversation and gen_ai.task but not
            # gen_ai.operation.name, and Datadog says so itself: "No operation was reported, so this span
            # defaults to a generic workflow instead of being classified as an LLM, tool, retrieval, or
            # agent span." This rule already did the right thing for call_llm and simply never matched it.
            - set(attributes["gen_ai.operation.name"], "invoke_agent") where (name == "call_llm" or name == "invocation") and IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$")
    # transform/mark_tool_failure used to stand here (2026-09-06, while the execute_tool span was believed to be a
    # stub): it marked the model call that READ a failed tool result as an error too, so one blocked exfiltration
    # read as "2 errors" (#320). Removed by question 925 on #265: the GenAI semantic conventions say a span's status
    # "MUST be left unset if the instrumented operation has ended without any errors", and that model call ended
    # fine; the tool did not. The block is now one error, on execute_tool, below.
    #
    # The execute_tool span is NOT a stub. Measured on watch-it-burn-michael-admin, 2026-09-07, by reading
    # the trace out of Tempo rather than out of Datadog: the span carries the full tool arguments and the
    # full tool result, including the exfiltrated payload and the blocked curl's exact failure. ADK writes
    # them under its own gcp.vertex.agent.* prefix instead of the OTel GenAI semconv names, so Datadog,
    # which reads gen_ai.*, has nothing to render and shows the tool call as empty. The data was on the
    # wire the whole time under a name nobody was looking at.
    #
    # This is the thing Whitney asked for as a student and could not get (#316): "see BurritoBot's tool
    # calls and responses". Copy, never move: the ADK names stay so anything already keyed on them keeps
    # working, and so the origin of the values remains visible.
    transform/adk_tool_content:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            # Every statement is a SINGLE-QUOTED YAML scalar, like the filter rules above. An unquoted
            # statement containing `": true"` parses as a YAML mapping, and the collector then refuses the
            # whole config with "expected type 'string', got unconvertible type 'map[string]interface {}'"
            # and CrashLoops. Caught on michael-admin before it reached anything else.
            - 'set(attributes["gen_ai.tool.call.arguments"], attributes["gcp.vertex.agent.tool_call_args"]) where attributes["gcp.vertex.agent.tool_call_args"] != nil'
            - 'set(attributes["gen_ai.tool.call.result"], attributes["gcp.vertex.agent.tool_response"]) where attributes["gcp.vertex.agent.tool_response"] != nil'
            # MCP reports a failed tool with isError, and the tool span itself carried no status at all, so
            # a blocked exfiltration and a successful one looked identical on the span named after the tool.
            # This is the ONE place a blocked call is marked (question 925, #265), as the GenAI semconv puts it:
            # the execute_tool span's status follows Recording Errors (status ERROR, and error.type, which is
            # Conditionally Required "if the operation ended in an error"), and the MCP conventions name the
            # value for a CallToolResult with isError: `tool_error`. Datadog shows status.message as
            # meta.error.message and error.type as meta.error.type. The `.` in the pattern matches the closing
            # quote of the JSON key, which keeps a backslash out of a YAML scalar that is already fiddly.
            #
            # gen_ai.tool.call.result is still copied on a failure, though the semconv describes it as the
            # result "if execution was successful": the failure text is what a student reads to see the block,
            # and the status message stays a pointer to it rather than a copy of tool output.
            #
            # Every status statement skips "execute_tool (merged)". When the model asks for several tools in one turn,
            # ADK wraps their spans in one named that (gen_ai.tool.name "(merged tools)"), and its tool_response is the
            # whole function-response event, every call's response in it, the failed one's "command FAILED" included
            # (adk-go internal/telemetry TraceMergedToolCallsResult). Marking it too made one block read as 2 errors
            # in Agent Observability's trace list (coordinator's live check on #265, burritobot-private, 2026-10-31).
            # The call that failed is the run_shell span under it, and the conventions' reason for leaving the model
            # call unmarked holds for the merged span too. ADK still marks it itself when the merge returns a Go error
            # (RecordError).
            - 'set(status.code, STATUS_CODE_ERROR) where name != "execute_tool (merged)" and attributes["gcp.vertex.agent.tool_response"] != nil and IsMatch(attributes["gcp.vertex.agent.tool_response"], "isError.: true")'
            - 'set(status.message, "the tool call failed (see gen_ai.tool.call.result)") where name != "execute_tool (merged)" and attributes["gcp.vertex.agent.tool_response"] != nil and IsMatch(attributes["gcp.vertex.agent.tool_response"], "isError.: true")'
            - 'set(attributes["error.type"], "tool_error") where name != "execute_tool (merged)" and attributes["gcp.vertex.agent.tool_response"] != nil and IsMatch(attributes["gcp.vertex.agent.tool_response"], "isError.: true")'
            # The same, keyed on workshop-mcp's own wording (#264): every failure run_shell raises starts
            # "command FAILED" (test_run_shell_failure.py holds that), and a refused deploy_app raises "deploy failed
            # for " (#712), so the blocked exfiltration and the blocked deploy read as errors on their execute_tool
            # spans whether ADK hands the result over as MCP's isError or as the exception's text.
            - 'set(status.code, STATUS_CODE_ERROR) where name != "execute_tool (merged)" and attributes["gcp.vertex.agent.tool_response"] != nil and IsMatch(attributes["gcp.vertex.agent.tool_response"], "command FAILED|deploy failed for ")'
            - 'set(status.message, "the tool call failed (see gen_ai.tool.call.result)") where name != "execute_tool (merged)" and attributes["gcp.vertex.agent.tool_response"] != nil and IsMatch(attributes["gcp.vertex.agent.tool_response"], "command FAILED|deploy failed for ")'
            - 'set(attributes["error.type"], "tool_error") where name != "execute_tool (merged)" and attributes["gcp.vertex.agent.tool_response"] != nil and IsMatch(attributes["gcp.vertex.agent.tool_response"], "command FAILED|deploy failed for ")'
    # A server span that answered 5xx is an error (#894). Seen on watch-it-burn-community on 2026-11-05 (hecaton run
    # 17389): an HC-666 chat reached guard-proxy while workshop-agent rolled to a new ReplicaSet, the forward got 503,
    # and guard-proxy answered 502 "BurritoBot's kitchen isn't answering". proxy.py marks its agent.forward CLIENT span
    # ERROR, but leaves its own POST /chat SERVER span unset, and that span is the turn's root in Agent Observability
    # (transform/llmobs_one_root), whose copy drops agent.forward for carrying no gen_ai.* attribute. So the dropped
    # chat was trace 39fba3d0574259a99e1a646ed1e89818 there: one agent row, 36 ms, status ok, the prompt in and
    # nothing out. The HTTP semantic conventions (http-spans.md, Status) set status Error on a span whose code is 5xx,
    # leave a server span's 4xx unset, and take the status code as a string for error.type when nothing more specific
    # is known. So this marks any SERVER span, any service, from the code alone: the
    # storefront turn, and anything else that answers 5xx. guard-proxy's 403, 429 and 400 stay unset, and a status
    # an instrumentation already set (Ok is final, an Error keeps its own message) is left as it is.
    #
    # It runs here, on the traces pipeline, so APM, Tempo and the Agent Observability copy all read the same status.
    # http.status_code is the pre-1.21 name for the same value (otelhttp's older releases). Each statement guards on
    # STATUS_CODE_UNSET, so status.code is set last. verify/test_trace_shape_e2e.py sends a dropped chat and a capped one.
    transform/http_server_error:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - 'set(cache["http_code"], attributes["http.response.status_code"]) where kind == SPAN_KIND_SERVER and IsInt(attributes["http.response.status_code"])'
            - 'set(cache["http_code"], attributes["http.status_code"]) where kind == SPAN_KIND_SERVER and cache["http_code"] == nil and IsInt(attributes["http.status_code"])'
            - 'set(attributes["error.type"], String(cache["http_code"])) where status.code == STATUS_CODE_UNSET and cache["http_code"] != nil and cache["http_code"] >= 500 and attributes["error.type"] == nil'
            - 'set(status.message, Concat(["the server answered HTTP ", String(cache["http_code"])], "")) where status.code == STATUS_CODE_UNSET and cache["http_code"] != nil and cache["http_code"] >= 500'
            - 'set(status.code, STATUS_CODE_ERROR) where status.code == STATUS_CODE_UNSET and cache["http_code"] != nil and cache["http_code"] >= 500'
    # The model call's own content, for Datadog's LLM Observability (#721). kagent's Go runtime (v0.10.1,
    # go/adk/pkg/telemetry/attributes.go) writes the model request and response to gcp.vertex.agent.llm_request and
    # gcp.vertex.agent.llm_response as json.Marshal of ADK's model.LLMRequest / model.LLMResponse (adk-go v2.1.0):
    # {"Model":..,"Contents":[{"parts":[..],"role":"user|model"}],"Config":{"systemInstruction":{"parts":[..]}}} and
    # {"Content":{"parts":[..],"role":"model"},..,"FinishReason":"STOP",..}, each part a genai.Part ({"text":..},
    # {"functionCall":{"id","args","name"}}, {"functionResponse":{"id","name","response"}}). Nothing is written to
    # gen_ai.input.messages / gen_ai.output.messages, which is where Datadog reads a model span's input and output
    # (docs.datadoghq.com/llm_observability/instrumentation/otel_instrumentation, read 2026-10-31: those attributes and
    # gen_ai.system_instructions first, as JSON strings, then the gen_ai.client.inference.operation.details event), so
    # every generate_content row showed no input and no output. These statements write the three attributes in the
    # GenAI semconv message shape: role user/assistant/tool, and parts of type text, reasoning, tool_call (id, name,
    # arguments) and tool_call_response (id, response). Copy, never move, as above. A span that already carries
    # gen_ai.input.messages (the Python runtime, guard-proxy) is left as it is.
    #
    # The tools the model was offered go to gen_ai.tool.definitions (#784), the one GenAI attribute newer than semconv
    # v1.37 (it came in v1.38) that Datadog's page maps: to meta.tool_definitions, a parsed JSON array. adk-go v2.1.0
    # packs every tool's declaration into the first genai.Tool that has functionDeclarations (tool/toolutils PackTool,
    # and agent transfer the same), so that one list is the whole set. Each becomes {"type":"function","name",
    # "description"}, the semconv's FunctionToolDefinition. The description is optional there and kept here, because a
    # poisoned tool description is what Challenge 3 is about. The parameters (an MCP tool's parametersJsonSchema) are
    # left out, as the semconv recommends by default for size.
    #
    # When the payload does not parse, nothing is written and the span goes on unchanged. kagent replaces a payload
    # over 32 KiB with {"original_size":..,"payload_prefix":..,"truncated":true}, and a payload cut anywhere else is
    # not JSON. The 2048-character cut read in Tempo matches Tempo's own max_attribute_bytes default (2048), which would
    # make it Tempo's and not on the way to Datadog; not yet confirmed on a cluster. Either way, the HasPrefix /
    # HasSuffix guard skips both without an error; a cut that happens to end in "}" fails ParseJSON, which error_mode
    # ignore logs once and moves past. Every part is built through ParseJSON, so a message that cannot be made valid
    # JSON leaves the attribute unset rather than half-written. verify/test_adk_model_content_e2e.py runs it.
    #
    # MapEach, Filter, Any and When are OTTL lambdas, which need the ottl.functions.enableLambda feature gate: it is
    # set in command.extraArgs below, and a collector started without it refuses this whole config.
    #
    # Each statement is a folded block scalar (>-): a string, never a mapping (test_collector_config.py), and every
    # continuation line has the same indent, so folding joins them with one space and never inside a string literal.
    transform/adk_model_content:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - >-
              set(cache["adk_req"], ParseJSON(attributes["gcp.vertex.agent.llm_request"]))
              where IsMatch(name, "^generate_content") and attributes["gcp.vertex.agent.llm_request"] != nil
              and HasPrefix(attributes["gcp.vertex.agent.llm_request"], "{\"Model\":")
              and HasSuffix(attributes["gcp.vertex.agent.llm_request"], "}")
            - >-
              set(cache["adk_resp"], ParseJSON(attributes["gcp.vertex.agent.llm_response"]))
              where IsMatch(name, "^generate_content") and attributes["gcp.vertex.agent.llm_response"] != nil
              and HasPrefix(attributes["gcp.vertex.agent.llm_response"], "{\"Content\":")
              and HasSuffix(attributes["gcp.vertex.agent.llm_response"], "}")
            # Input: one message per ADK Content. ADK's "model" is the semconv's assistant, and a user turn that
            # carries a functionResponse is the tool's turn.
            - >-
              set(attributes["gen_ai.input.messages"], String(MapEach(Filter(cache["adk_req"]["Contents"],
              (_, c) => IsMap(c) and ContainsValue(Keys(c), "parts") and IsList(c["parts"])),
              (_, c) => ParseJSON(Concat(["{\"role\":\"",
              When(() => ContainsValue(Keys(c), "role") and c["role"] == "model", "assistant",
              When(() => Any(c["parts"], (_, p) => IsMap(p) and ContainsValue(Keys(p), "functionResponse")), "tool", "user")),
              "\",\"parts\":",
              String(MapEach(Filter(c["parts"], (_, p) => IsMap(p) and (ContainsValue(Keys(p), "text")
              or ContainsValue(Keys(p), "functionCall") or ContainsValue(Keys(p), "functionResponse"))),
              (_, p) => When(() => ContainsValue(Keys(p), "text"),
              {"type": When(() => ContainsValue(Keys(p), "thought") and p["thought"] == true, "reasoning", "text"), "content": p["text"]},
              When(() => ContainsValue(Keys(p), "functionCall"),
              ParseJSON(Concat(["{\"type\":\"tool_call\",", TrimPrefix(String(MapKeys(Filter(p["functionCall"],
              (k, _) => k == "id" or k == "name" or k == "args"), (k, _) => When(() => k == "args", "arguments", k))), "{")], "")),
              ParseJSON(Concat(["{\"type\":\"tool_call_response\",", TrimPrefix(String(Filter(p["functionResponse"],
              (k, _) => k == "id" or k == "response")), "{")], "")))))),
              "}"], "")))))
              where attributes["gen_ai.input.messages"] == nil and IsMap(cache["adk_req"]) and IsList(cache["adk_req"]["Contents"])
            - >-
              set(attributes["gen_ai.system_instructions"], String(MapEach(Filter(cache["adk_req"]["Config"]["systemInstruction"]["parts"],
              (_, p) => IsMap(p) and ContainsValue(Keys(p), "text")), (_, p) => {"type": "text", "content": p["text"]})))
              where attributes["gen_ai.system_instructions"] == nil and IsMap(cache["adk_req"]) and IsMap(cache["adk_req"]["Config"])
              and ContainsValue(Keys(cache["adk_req"]["Config"]), "systemInstruction") and IsMap(cache["adk_req"]["Config"]["systemInstruction"])
              and ContainsValue(Keys(cache["adk_req"]["Config"]["systemInstruction"]), "parts")
              and IsList(cache["adk_req"]["Config"]["systemInstruction"]["parts"])
            - >-
              set(cache["adk_fns"], Filter(cache["adk_req"]["Config"]["tools"], (_, t) => IsMap(t)
              and ContainsValue(Keys(t), "functionDeclarations") and IsList(t["functionDeclarations"])))
              where IsMap(cache["adk_req"]) and IsMap(cache["adk_req"]["Config"])
              and ContainsValue(Keys(cache["adk_req"]["Config"]), "tools") and IsList(cache["adk_req"]["Config"]["tools"])
            - >-
              set(attributes["gen_ai.tool.definitions"], String(MapEach(Filter(cache["adk_fns"][0]["functionDeclarations"],
              (_, d) => IsMap(d) and ContainsValue(Keys(d), "name") and IsString(d["name"])),
              (_, d) => When(() => ContainsValue(Keys(d), "description") and IsString(d["description"]),
              {"type": "function", "name": d["name"], "description": d["description"]},
              {"type": "function", "name": d["name"]}))))
              where attributes["gen_ai.tool.definitions"] == nil and IsList(cache["adk_fns"]) and Len(cache["adk_fns"]) > 0
              and Len(cache["adk_fns"][0]["functionDeclarations"]) > 0
            # Output: the one Content, as the assistant, with the semconv finish_reason. ADK leaves FinishReason ""
            # when the model adapter did not set one; then a reply that calls a tool is tool_call and any other stop.
            - >-
              set(cache["adk_ok"], true) where IsMap(cache["adk_resp"]) and IsMap(cache["adk_resp"]["Content"])
              and ContainsValue(Keys(cache["adk_resp"]["Content"]), "parts") and IsList(cache["adk_resp"]["Content"]["parts"])
            - 'set(cache["adk_fr"], "stop") where cache["adk_ok"] == true'
            - >-
              set(cache["adk_fr"], "tool_call") where cache["adk_ok"] == true
              and Any(cache["adk_resp"]["Content"]["parts"], (_, p) => IsMap(p) and ContainsValue(Keys(p), "functionCall"))
            - >-
              set(cache["adk_fr"], When(() => cache["adk_resp"]["FinishReason"] == "STOP", "stop",
              When(() => cache["adk_resp"]["FinishReason"] == "MAX_TOKENS", "length",
              When(() => IsMatch(cache["adk_resp"]["FinishReason"], "^(SAFETY|RECITATION|BLOCKLIST|PROHIBITED_CONTENT|SPII|IMAGE_SAFETY)$"),
              "content_filter", ToLowerCase(cache["adk_resp"]["FinishReason"])))))
              where cache["adk_ok"] == true and ContainsValue(Keys(cache["adk_resp"]), "FinishReason")
              and IsString(cache["adk_resp"]["FinishReason"]) and cache["adk_resp"]["FinishReason"] != ""
            - >-
              set(attributes["gen_ai.output.messages"], String(ParseJSON(Concat(["[{\"role\":\"assistant\",\"parts\":",
              String(MapEach(Filter(cache["adk_resp"]["Content"]["parts"], (_, p) => IsMap(p) and (ContainsValue(Keys(p), "text")
              or ContainsValue(Keys(p), "functionCall") or ContainsValue(Keys(p), "functionResponse"))),
              (_, p) => When(() => ContainsValue(Keys(p), "text"),
              {"type": When(() => ContainsValue(Keys(p), "thought") and p["thought"] == true, "reasoning", "text"), "content": p["text"]},
              When(() => ContainsValue(Keys(p), "functionCall"),
              ParseJSON(Concat(["{\"type\":\"tool_call\",", TrimPrefix(String(MapKeys(Filter(p["functionCall"],
              (k, _) => k == "id" or k == "name" or k == "args"), (k, _) => When(() => k == "args", "arguments", k))), "{")], "")),
              ParseJSON(Concat(["{\"type\":\"tool_call_response\",", TrimPrefix(String(Filter(p["functionResponse"],
              (k, _) => k == "id" or k == "response")), "{")], "")))))),
              ",", TrimPrefix(String({"finish_reason": cache["adk_fr"]}), "{"), "]"], ""))))
              where attributes["gen_ai.output.messages"] == nil and cache["adk_ok"] == true
    # One BurritoBot turn is one root in Agent Observability (#746), and APM keeps the true path. Datadog converts
    # the gen_ai spans of an APM trace into Agent Observability on its own, drops every span with no gen_ai.*
    # attribute, and maps parent_span_id to parent_id as it is (docs.datadoghq.com/llm_observability/instrument/
    # otel_instrumentation, read 2026-11-01). The four hops between guard-proxy and kagent (agent.forward, the urllib
    # POST, the gateway's POST / and Http) carry none, so kagent's request span named a parent that was never kept and
    # Agent Observability drew it as a second root: 14 ms, no content, holding every tool call. The guard root, kind llm
    # with no token counts, read cost_estimate_status:skipped_tokens_missing. Question 1034 kept APM's parentage, and
    # it stays kept: this processor marks every span for APM only, and the copy below is the one Agent Observability
    # reads. The same page: "An explicit false on any span prevents conversion of the entire trace."
    transform/llmobs_apm_off:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - 'set(attributes["dd_llmobs_enabled"], false)'
    # The code of conduct's term list, masked in the conversation on every profile, whatever the guardrails are set to
    # (#1277, chosen by the #1267 spike, docs/research/2026-11-09-coc-floor/README.md). The stage projects Datadog's
    # traces and Agent Observability, and Tempo holds the same spans, so an expletive or a slur typed into /chat, or one
    # the bot repeats, would be on the screen. This is the last traces processor (before burn's transform/scrub_pii),
    # after transform/adk_model_content and transform/adk_tool_content have made their gen_ai.* copies, and before
    # every exporter: Tempo, Datadog, and forward/llmobs, so Agent Observability's copy is masked too.
    #
    # It reads the eight keys burn's scrub keeps (the messages, the tool call's arguments and result, and the four
    # gcp.vertex.agent.* attributes they are copied from), on spans and span events, copied to the cache, masked there
    # and merged back, so ids and every other attribute stay whole. A term becomes [redacted]; the JSON around it is
    # untouched, so Datadog still parses the messages. The pattern is the spike's floor: guard-proxy's 1,253 terms
    # (#1316) as whole words, letters repeatable, leetspeak stand-ins, * for a vowel, or spelt out one separator apart.
    # Groups 1 and 3 are the word edges it consumes, so the replacement puts them back ($$ is a literal $ in collector
    # config, as is every $ in the pattern), and each pattern runs twice so that two terms one separator apart are both
    # masked; the second pass only where the first masked something, since otherwise it would find nothing either.
    # RE2 cannot fold text first, so look-alike letters, accents and zero-width characters get past it. None of the
    # stage's texts matches, HC-666's ticket among them.
    #
    # The floor is cut into 36 patterns of at most 4,000 characters, floor.portable_patterns(), applied in turn (#1328).
    # The collector parses an OTTL string in CPU time that grows with the square of its length, and #1316's single
    # 108,437-character statement, four times over, cost about 46 s of CPU at every start; cut, the config builds in
    # about 6 s. The patterns run longest terms first, so a term that holds a shorter one is masked whole, and they mask
    # what the single form masks on the abuse set, the slang fixture, the stage texts and the hard negatives
    # (verify/test_collector_coc_split.py). Go's regexp takes about 16 ms on a 2,480-character reply with no term,
    # against about 4 ms for the single form: each pattern is one more scan of the text.
    #
    # Generated: `python3 verify/coc_pattern_copies.py write` rewrites the statements here and the pattern in the
    # admission policy (gitops/namespaces/code-of-conduct-names.yaml) from the spike's list, and
    # verify/test_coc_pattern_copies.py fails until every copy is the floor's (#1289). verify/test_collector_coc_mask.py
    # holds the statements equal to coc_mask_cases.statements() and holds the placement; the tier tests
    # verify/test_collector_coc_mask_e2e.py and verify/test_collector_coc_parse_cpu_e2e.py run them through the pinned
    # otelcol-contrib.
    transform/coc_mask:
      error_mode: ignore
      trace_statements:
        - context: span
          statements: &coc_mask_statements
            - 'set(cache["coc"], attributes)'
            - 'keep_keys(cache["coc"], ["gen_ai.input.messages", "gen_ai.output.messages", "gen_ai.tool.call.arguments", "gen_ai.tool.call.result", "gcp.vertex.agent.llm_request", "gcp.vertex.agent.llm_response", "gcp.vertex.agent.tool_call_args", "gcp.vertex.agent.tool_response"])'
