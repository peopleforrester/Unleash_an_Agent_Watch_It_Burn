    # The Agent Observability copy (pipeline traces/llmobs, fed by forward/llmobs after every processor above has run,
    # PII scrub on burn included). The Datadog overlay sends it to Datadog's OTLP intake with dd-otlp-source: llmobs.
    # It never reaches Tempo or the service map, so moving a parent here changes no waterfall there.
    #
    # The copy is a trace of its own (#783): its first statement replaces the trace id with the first 32 hex digits of
    # the SHA-256 of the original. With the original id, the copy and APM's copy were one trace at Datadog. The intake
    # wrote the copy into the APM trace too (the overlap Datadog's page warns of): APM trace
    # a2b544f7bbf6e12cfca75d8927f01f13, 2026-11-01 16:42 UTC, had two POST roots, APM's POST /chat and the copy's
    # under its derived id. APM's spans in that same trace carry dd_llmobs_enabled false, and "an explicit false on
    # any span prevents conversion of the entire trace", so from this change's rollout (2026-11-01 ~15:55 UTC) Agent
    # Observability received no BurritoBot turn at all. Under its own trace id the copy shares no trace with a marked
    # span. The hash is the same on every node for every span of a turn, so the turn's spans stay one trace.
    #
    # The collector sees one span at a time, and the guard's spans and kagent's are handled on different nodes, so the
    # link cannot be looked up. It is computed instead: the guard span that holds the turn takes the low 64 bits of
    # the copy's trace id as its span id, and kagent's invocation names the same id as its parent. Both come from the
    # trace id alone. The span that holds the turn is POST /chat, the storefront's turn (proxy.py, pin fb6e2bf, _handle_chat),
    # or sanitize on the raw A2A pass-through (_handle_post), whose own POST / server span has no gen_ai.* attribute.
    # Either one carries the prompt and the final reply, and lasts the whole turn. It becomes invoke_agent, Datadog's
    # agent kind: guard-proxy makes no model call of its own, and as an llm row with no tokens it made the trace
    # PARTIAL COST. The token counts are on kagent's generate_content spans (adk-go v2.1.0 TraceGenerateContentResult),
    # which now sit under the root, and Datadog prices those once transform/llmobs_model names their system id (#784).
    # A self-heal retry forwards again inside the same turn, so its invocation lands under the same root. An A2A
    # message that did not come through guard-proxy names a parent that is not there and shows as its own root, as
    # every kagent turn did before this; transform/llmobs_root_service below files that root under burritobot (#1163).
    # verify/test_trace_shape_e2e.py runs both copies through the collector.
    transform/llmobs_one_root:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - 'set(trace_id.string, Substring(SHA256(trace_id.string), 0, 32))'
            - 'delete_key(attributes, "dd_llmobs_enabled")'
            - 'set(span_id.string, Substring(trace_id.string, 16, 16)) where resource.attributes["service.name"] == "burritobot" and attributes["gen_ai.operation.name"] == "chat" and ((kind == SPAN_KIND_SERVER and IsMatch(name, "^POST /chat/?$")) or name == "sanitize")'
            - 'set(attributes["gen_ai.operation.name"], "invoke_agent") where resource.attributes["service.name"] == "burritobot" and attributes["gen_ai.operation.name"] == "chat" and ((kind == SPAN_KIND_SERVER and IsMatch(name, "^POST /chat/?$")) or name == "sanitize")'
            - 'set(parent_span_id.string, Substring(trace_id.string, 16, 16)) where IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$") and name == "invocation" and not IsRootSpan()'
    # The copy's model calls name the model Datadog can price (#784). Live, each Bedrock ModelConfig calls this
    # cluster's tagged application profile (#513), so kagent's generate_content spans name an ARN like
    # arn:aws:bedrock:us-west-2:<account>:application-inference-profile/5l72jg8rnz71. Datadog's catalog has no price
    # for that name: on 2026-11-05 every such row in the sandbox org read cost_estimate_status
    # skipped_unsupported_model_pricing, with its token counts present, while a row of the same spans named
    # us.amazon.nova-pro-v1:0 (burritobot-public, 2026-11-03, while its ModelConfig still called the system id) read
    # success with an estimated_total_cost. A profile is a tagged copy of its system profile and bills at its price, so the copy names
    # the system id the ModelConfig commits in gitops/ai-layer/resources.yaml; APM's copy keeps the ARN, which is what
    # the bill's tags trace, and the copy keeps it as witb.bedrock.application_profile (#876). The ARNs are per cluster
    # and known only after apply, so they come from the environment:
    # fleet.sh pin_bedrock_profiles writes them to the monitoring/bedrock-profile-models ConfigMap, one
    # WIB_BEDROCK_PROFILE_<TIER> key per Bedrock ModelConfig, which extraEnvsFrom below loads. A cluster without the
    # ConfigMap gets the default "unpinned", which no model name equals, so the copy goes out as it came. A key that is
    # present but empty reads as "", not as the default (otelcol-contrib 0.160.0), so each rule first requires its key
    # to be non-empty: a map written by hand from a ModelConfig that was missing never renames a call with no model
    # to that tier (#876).
    # verify/test_collector_llmobs_model.py holds the tiers against resources.yaml and fleet.sh, and
    # verify/test_collector_llmobs_model_e2e.py runs a turn through the real collector.
    transform/llmobs_model:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - 'set(attributes["witb.bedrock.application_profile"], attributes["gen_ai.request.model"]) where "${env:WIB_BEDROCK_PROFILE_NOVA:-unpinned}" != "" and attributes["gen_ai.request.model"] == "${env:WIB_BEDROCK_PROFILE_NOVA:-unpinned}"'
            - 'set(attributes["gen_ai.request.model"], "us.amazon.nova-pro-v1:0") where "${env:WIB_BEDROCK_PROFILE_NOVA:-unpinned}" != "" and attributes["gen_ai.request.model"] == "${env:WIB_BEDROCK_PROFILE_NOVA:-unpinned}"'
            - 'set(attributes["gen_ai.response.model"], "us.amazon.nova-pro-v1:0") where "${env:WIB_BEDROCK_PROFILE_NOVA:-unpinned}" != "" and attributes["gen_ai.response.model"] == "${env:WIB_BEDROCK_PROFILE_NOVA:-unpinned}"'
            - 'set(name, "generate_content us.amazon.nova-pro-v1:0") where "${env:WIB_BEDROCK_PROFILE_NOVA:-unpinned}" != "" and name == "generate_content ${env:WIB_BEDROCK_PROFILE_NOVA:-unpinned}"'
            - 'set(attributes["witb.bedrock.application_profile"], attributes["gen_ai.request.model"]) where "${env:WIB_BEDROCK_PROFILE_HAIKU:-unpinned}" != "" and attributes["gen_ai.request.model"] == "${env:WIB_BEDROCK_PROFILE_HAIKU:-unpinned}"'
            - 'set(attributes["gen_ai.request.model"], "us.anthropic.claude-haiku-4-5-20251001-v1:0") where "${env:WIB_BEDROCK_PROFILE_HAIKU:-unpinned}" != "" and attributes["gen_ai.request.model"] == "${env:WIB_BEDROCK_PROFILE_HAIKU:-unpinned}"'
            - 'set(attributes["gen_ai.response.model"], "us.anthropic.claude-haiku-4-5-20251001-v1:0") where "${env:WIB_BEDROCK_PROFILE_HAIKU:-unpinned}" != "" and attributes["gen_ai.response.model"] == "${env:WIB_BEDROCK_PROFILE_HAIKU:-unpinned}"'
            - 'set(name, "generate_content us.anthropic.claude-haiku-4-5-20251001-v1:0") where "${env:WIB_BEDROCK_PROFILE_HAIKU:-unpinned}" != "" and name == "generate_content ${env:WIB_BEDROCK_PROFILE_HAIKU:-unpinned}"'
            - 'set(attributes["witb.bedrock.application_profile"], attributes["gen_ai.request.model"]) where "${env:WIB_BEDROCK_PROFILE_SONNET:-unpinned}" != "" and attributes["gen_ai.request.model"] == "${env:WIB_BEDROCK_PROFILE_SONNET:-unpinned}"'
            - 'set(attributes["gen_ai.request.model"], "us.anthropic.claude-sonnet-4-6") where "${env:WIB_BEDROCK_PROFILE_SONNET:-unpinned}" != "" and attributes["gen_ai.request.model"] == "${env:WIB_BEDROCK_PROFILE_SONNET:-unpinned}"'
            - 'set(attributes["gen_ai.response.model"], "us.anthropic.claude-sonnet-4-6") where "${env:WIB_BEDROCK_PROFILE_SONNET:-unpinned}" != "" and attributes["gen_ai.response.model"] == "${env:WIB_BEDROCK_PROFILE_SONNET:-unpinned}"'
            - 'set(name, "generate_content us.anthropic.claude-sonnet-4-6") where "${env:WIB_BEDROCK_PROFILE_SONNET:-unpinned}" != "" and name == "generate_content ${env:WIB_BEDROCK_PROFILE_SONNET:-unpinned}"'
            - 'set(attributes["witb.bedrock.application_profile"], attributes["gen_ai.request.model"]) where "${env:WIB_BEDROCK_PROFILE_OPUS:-unpinned}" != "" and attributes["gen_ai.request.model"] == "${env:WIB_BEDROCK_PROFILE_OPUS:-unpinned}"'
            - 'set(attributes["gen_ai.request.model"], "us.anthropic.claude-opus-4-8") where "${env:WIB_BEDROCK_PROFILE_OPUS:-unpinned}" != "" and attributes["gen_ai.request.model"] == "${env:WIB_BEDROCK_PROFILE_OPUS:-unpinned}"'
            - 'set(attributes["gen_ai.response.model"], "us.anthropic.claude-opus-4-8") where "${env:WIB_BEDROCK_PROFILE_OPUS:-unpinned}" != "" and attributes["gen_ai.response.model"] == "${env:WIB_BEDROCK_PROFILE_OPUS:-unpinned}"'
            - 'set(name, "generate_content us.anthropic.claude-opus-4-8") where "${env:WIB_BEDROCK_PROFILE_OPUS:-unpinned}" != "" and name == "generate_content ${env:WIB_BEDROCK_PROFILE_OPUS:-unpinned}"'
    # What else leaves the Agent Observability copy. guard-proxy's chat span is the storefront turn's inner wrapper: the
    # same prompt and reply as its root, an llm row with no tokens. kagent's server span is the 14 ms message/send row
    # whose invocation now hangs from the root. Every span with no gen_ai.* attribute is one Datadog would drop anyway,
    # so it is not sent twice.
    #
    # And every gateway span (#877). The only ones filter/drop_noise lets through with a gen_ai.* attribute are the MCP
    # tools/call pair, the SERVER span on :3001 and its "tools/call workshop-mcp_<tool>" CLIENT child, which carry
    # gen_ai.tool.name. The intake made no Agent Observability row of them, but it wrote them into APM under the
    # copy's derived trace id, so each tool call showed there as two parentless traces with the same span ids: APM
    # trace ba4d717c4482c8c0598202c7238ecc7f and its copy be12f808f25277a4fcbe7c7c993df2c2 (the SHA-256 prefix of
    # the first), read from both Tempo and Datadog on burritobot-private 2026-11-05. Agent Observability has the same
    # call as kagent's execute_tool row, so the copy loses nothing, and APM keeps the gateway's own pair.
    filter/llmobs_one_root:
      error_mode: ignore
      traces:
        span:
          - 'resource.attributes["service.name"] == "burritobot" and name == "chat" and kind == SPAN_KIND_INTERNAL'
          - 'IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$") and kind == SPAN_KIND_SERVER and attributes["gen_ai.operation.name"] == nil'
          - 'not Any(Keys(attributes), (_, k) => HasPrefix(k, "gen_ai."))'
          - 'IsMatch(resource.attributes["service.name"], "^(burritobot-gateway|agentgateway)$")'
    # One ml_app, burritobot (#1163). Datadog sets a trace's ml_app from its root span's service.name
    # (docs.datadoghq.com/llm_observability/instrumentation/otel_instrumentation, read 2026-11-09: "automatically set to
    # the value of your OpenTelemetry root span's service attribute"; no attribute overrides it). A turn that came
    # through guard-proxy has the guard's span as its root, so it files under burritobot. An A2A message sent to
    # agentgateway or kagent directly has no guard span: kagent's invocation names a parent that is not there, Datadog
    # takes it as the root, and the turn files under burritobot-agent. Whitney's sandbox org had 140 such traces from
    # 2026-11-01 to 2026-11-08, all on ml_app burritobot-agent: 139 rooted at invocation, one at kagent's POST server
    # span, from research scripts and dispatched runs that post message/send to agentgateway past guard-proxy
    # (docs/research/2026-11-08-ask-user/a2a_asks.py over a port-forward, sessions rec74-, r18448-, a2a-). Run 18497 saw
    # one in check 4 of verify/test_datadog_sandbox_live.py.
    #
    # So in this copy, and only here, the kagent spans that can be a root go out under service burritobot: invocation,
    # a kagent server span the filter above let through, and any kagent span with no parent at all. service.name is a
    # resource attribute shared by every span of the batch, so the three steps move those spans to a resource of their
    # own first: transform/llmobs_root_mark names the service on the span, groupbyattrs/llmobs_root moves that
    # attribute up to a new resource holding the rest of kagent's resource and those spans alone, and
    # transform/llmobs_root_service makes it the resource's service.name. kagent's other rows (invoke_agent,
    # generate_content, execute_tool) keep burritobot-agent, so the brief's service:burritobot-agent still names kagent's
    # model calls. In a guard turn the invocation row reads service burritobot under the guard's root and its ml_app
    # does not change. They run after filter/llmobs_one_root, whose rules match kagent by its own service name.
    # APM's copy and Tempo keep burritobot-agent on every kagent span. verify/test_llmobs_one_ml_app.py holds the rules
    # and verify/test_trace_shape_e2e.py sends a turn that skipped guard-proxy through the real collector.
    transform/llmobs_root_mark:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - 'set(attributes["witb.llmobs.root_service"], "burritobot") where IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$") and (name == "invocation" or kind == SPAN_KIND_SERVER or IsRootSpan())'
    groupbyattrs/llmobs_root:
      keys:
        - witb.llmobs.root_service
    transform/llmobs_root_service:
      error_mode: ignore
      trace_statements:
        - context: resource
          statements:
            - 'set(attributes["service.name"], attributes["witb.llmobs.root_service"]) where attributes["witb.llmobs.root_service"] != nil'
            - 'delete_key(attributes, "witb.llmobs.root_service")'
    # The lab-marker contract (#150), applied before anything is exported. The route is public, so the collector
    # does not trust the page: anything not named lab.* is dropped, span events are dropped, the resource is
    # reset to burritobot-lab, and only the attributes gitops/ai-layer/web/lab-events.js documents survive.
    # verify/test_lab_events.py keeps this list and the page's list identical.
    filter/lab_contract:
      error_mode: ignore
      traces:
        span:
          - 'not IsMatch(name, "^lab[.][a-z]+([.][a-z]+)?$")'
        spanevent:
          - 'IsMatch(name, ".*")'
    transform/lab_contract:
      error_mode: ignore
      trace_statements:
        - context: resource
          statements:
            - 'keep_keys(attributes, ["service.name"])'
            - 'set(attributes["service.name"], "burritobot-lab")'
        - context: span
          statements:
            - 'keep_keys(attributes, ["session.id", "witb.lab.alias", "witb.lab.role", "witb.lab.challenge", "witb.lab.item", "witb.lab.kind", "witb.lab.control"])'
            - 'truncate_all(attributes, 64)'
  exporters:
    prometheusremotewrite:
      endpoint: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
      tls:
        insecure: true
      resource_to_telemetry_conversion:
        enabled: true
    # otlp_grpc, not otlp: the chart renames the old name when it renders relay.yaml (a deprecation it warns
    # about), and the Datadog overlay below does not go through that rewrite. Written as otlp/tempo, the
    # overlay named an exporter that no longer existed after the rename and the collector refused the config
    # ('references exporter "otlp/tempo" which is not configured', otelcol-contrib 0.160.0). One name everywhere.
    otlp_grpc/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
    # The PRIMARY sink, Datadog, is NOT defined here. It lives in the Datadog overlay below
    # (extraManifests, otel-collector-datadog), which the datadog-gate init container switches on only
    # when datadog-secret exists. This file on its own is the Datadog-free collector: Tempo + Prometheus.
    # The burn profile installs neither, so values-burn.yaml takes both out of every pipeline list (#476).
    debug:
      verbosity: basic
      sampling_initial: 5
      sampling_thereafter: 200
  connectors:
    # Generates RED metrics from spans. add_resource_attributes propagates the UST resource
    # attributes (deployment.environment.name -> env, service.version) onto the generated
    # metrics; it defaults to false, and without it Datadog "View related logs" from a
    # span-derived metric silently finds nothing (the research spikes (removed 2026-08-30; see `git log --diff-filter=D -- research/`), the research spikes (removed 2026-08-30; see `git log --diff-filter=D -- research/`)).
    # Connector key is `span_metrics` (the current OTel semconv name; `spanmetrics` is the
    # deprecated alias slated for removal). add_resource_attributes is supported on contrib 0.158.2.
    span_metrics:
      add_resource_attributes: true
    # Counts of lab markers, as metrics, for the instructor dashboard (#150). Metrics because a dashboard over
    # a two-hour session needs every event, and metrics are kept whole where indexed spans are sampled.
    # Arrives in Datadog as witb.lab.calls tagged span.name, kube_cluster_name and the dimensions below.
    # session.id is deliberately NOT a dimension: one series per browser tab is cardinality for nothing.
    # Used only by the lab pipelines in the Datadog overlay; unused (and not started) without it.
    span_metrics/lab:
      namespace: witb.lab
      add_resource_attributes: true
      metrics_flush_interval: 15s
      dimensions:
        - name: witb.lab.alias
        - name: witb.lab.role
        - name: witb.lab.challenge
        - name: witb.lab.kind
        - name: witb.lab.control
    # The traces pipeline's spans, after its processors, into traces/llmobs: Agent Observability's copy (#746).
    forward/llmobs: {}
    # datadog/connector (APM trace.* metrics) is in the Datadog overlay below, with the exporter it feeds.
  service:
    telemetry:
      logs:
        level: info
      metrics:
        # Collector 0.159.0 (chart 0.172.1) REMOVED service.telemetry.metrics.address and fails to
        # start on it: "'migration.MetricsConfigV030' has invalid keys: address". The replacement is
        # a Prometheus reader, which expresses the same thing (scrape endpoint on :8888) in the
        # config shape the new version accepts. Found on a live upgrade, #389.
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
    # The Datadog-free pipelines. The Datadog overlay restates the receivers and exporters lists (the
    # collector replaces lists when it merges configs, as Helm does), so a change to either list here
    # must be made in the overlay too; verify/test_collector_no_datadog.py fails until it is.
    pipelines:
      metrics:
        receivers:
          - otlp
          - span_metrics # RED metrics generated from spans (carry UST tags for correlation)
        processors:
          - memory_limiter
          - transform/kagent_service_name # #634: kagent's workshop_agent becomes burritobot-agent
          - batch
          - resource
          - transform/set_genai_provider # stamp gen_ai.provider.name=aws.bedrock where N/A
        exporters:
          - prometheusremotewrite # the fallback, and the only metrics sink without Datadog
          - debug
      # OTLP logs, accepted and dropped (#903). The chart's default config has had this pipeline all along; it is
      # stated here because the workshop-agent's log exporter depends on it (gitops/workshop-agent/agent.yaml), and
      # a chart bump that dropped it would bring back a 404 on /v1/logs. Without a logs pipeline the receiver does
      # not serve the path. Its records go to debug and no further, on every profile, with or without Datadog. The
      # Datadog Agent already ships every pod's own log lines. The agent's records are ADK's gen_ai events and
      # carry the prompt and reply, which the traces pipeline's redaction and burn's transform/scrub_pii never see.
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - transform/kagent_service_name # #634: before every rule that matches burritobot-agent
          - filter/drop_noise
          - batch
          - resource
          - transform/set_peer_service # PRD #27 M3: peer.service fallback for the agentgateway->kagent edge
          - transform/set_llmobs_workflow # promote call_llm to invoke_agent so LLM Obs shows clean hierarchy
          - transform/set_genai_provider # after the line above, so the spans it names get aws.bedrock too
          - transform/adk_tool_content # tool args/result under gen_ai.*, and a failed tool call as its one error
          - transform/http_server_error # #894: a server span that answered 5xx is an error, the dropped chat's root
          - transform/adk_model_content # #721: the model call's request and reply as gen_ai.input/output.messages
          - transform/llmobs_apm_off # #746: APM's copy makes no Agent Observability rows; traces/llmobs does
          - transform/coc_mask # #1277: the code of conduct's terms masked in the conversation, before every exporter
        exporters:
          - otlp_grpc/tempo # the fallback, and the only trace sink without Datadog
          - span_metrics  # feed the connector so it can derive metrics from these spans
          - forward/llmobs # #746: the Agent Observability copy
          - debug
      # Agent Observability's copy of the traces (#746), one root per turn. Without Datadog it ends at debug, as the
      # lab pipelines do; the Datadog overlay below adds the intake.
      traces/llmobs:
        receivers:
          - forward/llmobs
        processors:
          - transform/llmobs_one_root
          - transform/llmobs_model # #784: the model calls name the system id Datadog prices, not the profile ARN
          - filter/llmobs_one_root
          - transform/llmobs_root_mark # #1163: the kagent spans that can be a root, under service burritobot,
          - groupbyattrs/llmobs_root # so a turn that skipped guard-proxy files under ml_app burritobot too
          - transform/llmobs_root_service
        exporters:
          - debug
      # Lab progress markers (#150). Defined here with their processors, exporting to debug only, so a cluster
      # with no datadog-secret receives the markers and drops them. The Datadog overlay below adds the org they
      # are for, the same way it does for traces and metrics.
      traces/lab:
        receivers:
          - otlp/lab
        processors:
          - memory_limiter
          - filter/lab_contract
          - transform/lab_contract
          - resource
          - batch
        exporters:
          - span_metrics/lab
          - debug
      metrics/lab:
        receivers:
          - span_metrics/lab
        processors:
          - memory_limiter
          - resource
          - batch
        exporters:
          - debug

# ---- Datadog, switched on by the presence of datadog-secret (#500) ----
#
# The collector used to name the datadog exporter in this file and read DD_API_KEY with a NON-optional
# secretKeyRef. With no datadog-secret, which is every cluster brought up before a Datadog org pool exists
# (#454), the pod could not start at all, so Tempo and Prometheus, the fallback, died with the primary. And
# making the reference optional alone does not help: the exporter refuses an empty key ("exporters::datadog:
# api.key is not set", measured against otelcol-contrib 0.160.0, this chart's appVersion) and that fails the
# whole config, used in a pipeline or not.
#
# So the Datadog half is a second collector config file, loaded after relay.yaml with a second --config. The
# datadog-gate init container decides what that file holds: the overlay below when datadog-secret exists, an
# empty config when it does not, and it says which in its log. The same profile therefore runs Datadog-free
# today and ships to Datadog once the key is loaded, with no repo change: write datadog-secret (deploy-full-idp
# or fleet.sh converge does) and restart the collector pods (infra/reload-datadog-consumers.sh).
#
#   kubectl -n monitoring logs ds/otel-collector-opentelemetry-collector-agent -c datadog-gate
#
# The collector replaces lists when it merges, so the overlay restates in full the exporter lists it changes
# (traces, metrics, the two lab pipelines, #150, and traces/llmobs, #746) and the metrics receivers; the processors lists are not
# touched and come from relay.yaml. values-dual.yaml (attendee) restates
# this ConfigMap with Tempo taken out (the attendee profile has no Tempo, #475), and adds a second file,
# datadog-dual.yaml, with the instructor org added; the gate loads that one only when datadog-admin-secret
# exists (#587). values-burn.yaml (burn) restates it with Tempo and Prometheus removed.

extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: otel-collector-datadog
    data:
      datadog.yaml: |
        exporters:
          # PRIMARY telemetry sink when present: Datadog (Whitney's account). DD_API_KEY / DD_SITE come from
          # datadog-secret (BYO; never stored in this repo) and the DD_SITE env below.
          datadog:
            api:
              key: ${env:DD_API_KEY}
              site: ${env:DD_SITE}
          # Agent Observability's own intake (#746), for traces/llmobs: Datadog's OTLP traces endpoint for the site
          # (otlp_trace_endpoint in DataDog/documentation shared/regions.yaml, read 2026-11-01: otlp.<site>), with
          # the header that routes spans to Agent Observability. Protobuf over HTTP, the only encoding it documents.
          otlp_http/llmobs:
            traces_endpoint: https://otlp.${env:DD_SITE}/v1/traces
            headers:
              dd-api-key: ${env:DD_API_KEY}
              dd-otlp-source: llmobs
        connectors:
          # datadog/connector computes APM Trace Metrics (the trace.* namespace used by SLOs/monitors).
          # Required since otelcol-contrib v0.95.0: the Datadog exporter no longer derives these itself.
          # compute_stats_by_span_kind so stats are computed for client/server/etc. spans (PRD #13 M2).
          datadog/connector:
            traces:
              compute_stats_by_span_kind: true
              peer_tags_aggregation: true   # surface external service dependencies (e.g. Bedrock) on the Datadog Service Map
        service:
          pipelines:
            metrics:
              receivers:
                - otlp
                - span_metrics
                - datadog/connector # APM trace.* metrics (compute_stats_by_span_kind); PRD #13 M2
              exporters:
                - datadog               # primary
                - prometheusremotewrite # secondary / fallback
                - debug
            traces:
              exporters:
                - datadog      # primary
                - otlp_grpc/tempo # secondary / fallback
                - span_metrics
                - datadog/connector # feed the APM-stats connector (trace.* metrics); PRD #13 M2
                - forward/llmobs    # #746: the Agent Observability copy
                - debug
            # Agent Observability's copy (#746): relay.yaml ends it at debug; this adds the intake.
            traces/llmobs:
              exporters:
                - otlp_http/llmobs
                - debug
            # Lab progress markers (#150). relay.yaml has the two lab pipelines exporting to debug only; this adds
            # Datadog, which on this profile (admin and full, the instructor clusters) IS the instructor org.
            # values-dual.yaml's datadog-dual.yaml sends them to datadog/admin instead, so on an attendee cluster
            # with an org of its own the markers reach the instructor's fleet view and never the student's org.
            traces/lab:
              exporters:
                - datadog
                - span_metrics/lab
                - debug
            metrics/lab:
              exporters:
                - datadog
                - debug
initContainers:
  - name: datadog-gate
    # The signed busybox mirror the platform already admits (verify-image-signatures, registry allowlist).
    image: ghcr.io/peopleforrester/watch-it-burn:busybox-1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: ["sh", "-c"]
    args:
      - |
        if [ -n "${DD_API_KEY:-}" ] && [ -n "${DD_ADMIN_API_KEY:-}" ] && [ -f /datadog-overlay/datadog-dual.yaml ]; then
          cp /datadog-overlay/datadog-dual.yaml /datadog-gate/datadog.yaml
          echo "datadog-gate: datadog-secret and datadog-admin-secret found. Datadog export ON, dual: traces and metrics to the cluster's own org and to the instructor org, lab markers to the instructor org only."
        elif [ -n "${DD_API_KEY:-}" ]; then
          cp /datadog-overlay/datadog.yaml /datadog-gate/datadog.yaml
          echo "datadog-gate: datadog-secret found. Datadog export ON: traces and metrics to Datadog, and to Tempo and Prometheus on the profiles that install them."
        else
          echo '{}' > /datadog-gate/datadog.yaml
          echo "datadog-gate: no datadog-secret. Datadog export OFF: traces to Tempo, metrics to Prometheus only, on the profiles that install them (burn installs neither and exports to debug only). Known gap until a Datadog key is loaded (#454); write datadog-secret and restart this pod to turn it on."
        fi
    env:
      - name: DD_API_KEY
        valueFrom:
          secretKeyRef:
            name: datadog-secret
            key: api-key
            optional: true
      # Only the attendee ConfigMap has a datadog-dual.yaml to choose. infra/datadog-cluster-identity.sh writes
      # this secret only when the instructor org is a different org from the cluster's own: with one org for
      # both (a pool row from the instructor key, question 926), a second exporter would count everything twice.
      - name: DD_ADMIN_API_KEY
        valueFrom:
          secretKeyRef:
            name: datadog-admin-secret
            key: api-key
            optional: true
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
    volumeMounts:
      - name: datadog-overlay
        mountPath: /datadog-overlay
        readOnly: true
      - name: datadog-gate
        mountPath: /datadog-gate
command:
  extraArgs:
    - --config=/datadog-gate/datadog.yaml
    # transform/adk_model_content's MapEach, Filter, Any and When are OTTL lambdas, alpha behind this gate (#721).
    # verify/collector_render.py reads this list, so the E2E tier runs the collector with the same gates.
    - --feature-gates=ottl.functions.enableLambda
extraVolumes:
  - name: datadog-overlay
    configMap:
      name: otel-collector-datadog
  - name: datadog-gate
    emptyDir:
      sizeLimit: 1Mi
extraVolumeMounts:
  - name: datadog-gate
    mountPath: /datadog-gate
    readOnly: true
# A change to the overlay rolls the collector, as a change to relay.yaml already does through the chart's own
# checksum. Without it an edited overlay sat unused until something else restarted the pods.
podAnnotations:
  checksum/datadog-overlay: '{{ .Values.extraManifests | toJson | sha256sum }}'
# Datadog Unified Service Tagging (#662): the Datadog Agent names the collector's own logs from these labels; without
# them they went out as the image short name, outside BurritoBot in the shared sandbox org. Every profile's
# collector (otel-collector, -burn, -attendee) reads this file.
podLabels:
  tags.datadoghq.com/service: burritobot-otel-collector
  tags.datadoghq.com/env: burritobot-kubecon-na-26
# DD_API_KEY is optional: the collector starts without datadog-secret, and only the overlay reads it. DD_SITE is
# that account's site (e.g. datadoghq.com, us5.datadoghq.com, datadoghq.eu).
extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: datadog-secret
        key: api-key
        optional: true
  - name: DD_SITE
    value: "datadoghq.com"
  - name: WIB_CLUSTER_NAME
    valueFrom:
      configMapKeyRef:
        name: cluster-identity
        key: datadog-cluster-name  # burritobot-<role>, the name the Agents report (#629)
        optional: true   # absent on a cluster bootstrapped before #242; rebuilt clusters always have it
# The cluster's Bedrock application profile ARNs, one WIB_BEDROCK_PROFILE_<TIER> per Bedrock ModelConfig, which
# transform/llmobs_model reads (#784). fleet.sh pin_bedrock_profiles writes the ConfigMap when it pins the profiles and
# restarts the collector when it changes. Optional: until then every key reads as "unpinned" and nothing is renamed.
extraEnvsFrom:
  - configMapRef:
      name: bedrock-profile-models
      optional: true
service:
  enabled: true
  type: ClusterIP
# Startup is mostly OTTL parsing, and the parse costs the square of a statement's length (#1326). transform/coc_mask
# carried #1316's 108,437-character statement four times, so building the config cost about 46 s of CPU, against 3 s
# before #1316. Measured on watch-it-burn-community 2026-11-11 with this image and the live relay.yaml, `validate` took
# 110 s at a 500m limit and 30 s at 2 CPUs. The liveness probe alone (k8s defaults: every 10 s, 3 failures) killed
# the container at about 30 s, before it ever logged, so the DaemonSet crashlooped and no trace left the cluster. The
# startup probe holds liveness off for up to 300 s, and the 2-CPU limit keeps a restart's gap in traces near 30 s.
# #1328 cut the statements short: the pinned binary's `validate` builds each profile's config in about 6 s of CPU.
# verify/test_collector_startup_budget.py holds the budget to the config's own statements.
startupProbe:
  httpGet:
    port: 13133
    path: /
  periodSeconds: 5
  failureThreshold: 60
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 512Mi
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  # The otlp/lab receiver (#150): the console's /lab-events route proxies here.
  otlp-lab:
    enabled: true
    containerPort: 4319
    servicePort: 4319
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP
