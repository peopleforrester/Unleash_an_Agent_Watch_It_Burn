# ABOUTME: Shared Helm values for the OpenTelemetry Collector DaemonSet, used by BOTH otel-collector
# ABOUTME: Applications (instructor and attendee). Attendee clusters layer values-dual.yaml on top (#242).
# The collector image is not here: it is lab-platform's mirror/ copy of otel/opentelemetry-collector-contrib, and
# only an app file's Helm values can name it through the root's imageRegistry (#623). Each of the three
# gitops/bootstrap/apps/otel-collector*.yaml files sets image.repository and image.tag.
mode: daemonset
presets:
  kubernetesAttributes:
    enabled: true
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    # Lab progress markers from the lab page (#150), via the console's /lab-events route. A receiver of its own
    # so that a browser-reachable endpoint feeds ONE pipeline (traces/lab) that enforces a contract, and can
    # never inject into the traces pipeline the student reads in Agent Observability. That pipeline lives in
    # the Datadog overlay, so with no datadog-secret this receiver is unused and not started: /lab-events then
    # answers 502 and the lab page, which never waits on it, is unaffected.
    otlp/lab:
      protocols:
        http:
          endpoint: 0.0.0.0:4319
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 100
    batch:
      timeout: 5s
      send_batch_size: 1024
      send_batch_max_size: 2048
    resource:
      attributes:
        - key: cluster.name
          value: watch-it-burn
          action: upsert
        # The cluster's real name, from the cluster-identity ConfigMap deploy-full-idp writes. The Datadog
        # exporter maps k8s.cluster.name to kube_cluster_name, which is what every Datadog view groups
        # by; without it all sixty clusters collapse into "watch-it-burn" in the admin org (#242).
        - key: k8s.cluster.name
          value: ${env:WIB_CLUSTER_NAME}
          action: upsert
    # OTTL fallback (PRD #27 M3): stamp peer.service on third-party component CLIENT spans so the
    # Datadog Service Map draws the agentgateway -> kagent edge, IF agentgateway doesn't emit it
    # natively. guard-proxy sets its OWN peer.service in code (M2), so it is intentionally NOT
    # matched here. error_mode: ignore so a mismatched condition is a harmless no-op (peer.service
    # simply stays unset) and can NEVER drop spans from the traces pipeline.
    #
    # verify-at-build: confirm against REAL spans (search_datadog_spans) before relying on this:
    #   (a) whether agentgateway already sets peer.service natively (if so this statement is inert);
    #   (b) the exact resource service.name value emitted by agentgateway.
    # The kagent -> Bedrock edge is deliberately NOT forced here: kagent reaches Bedrock via the AWS
    # SDK, and Datadog AUTO-INFERS that external dependency from the aws-api spans. Forcing
    # peer.service="bedrock" would risk a DUPLICATE node alongside Datadog's inferred one. PRD #27
    # M5 permits 3 internal edges (guard-proxy->agentgateway->kagent) when Bedrock is external-only.
    # If verify-at-build shows Bedrock is NOT inferred, add:
    #   set(attributes["peer.service"], "bedrock") where attributes["peer.service"] == nil
    #     and resource.attributes["service.name"] == "burritobot-agent" and kind == SPAN_KIND_CLIENT
    #     and (IsMatch(attributes["url.full"], ".*bedrock.*") or attributes["rpc.service"] == "BedrockRuntime")
    filter/drop_noise:
      error_mode: ignore
      traces:
        span:
          - 'name == "GET /.well-known/agent-card.json"'
          # Drop A2A event queue micro-spans (25-65µs, ~170/hr) — these carry
          # gen_ai.conversation.id/task.id which triggers LLM Obs classification,
          # causing them to appear as orphaned "No content" root entries in the
          # LLM Obs trace list. They are A2A protocol internals with no LLM content.
          - 'name == "a2a.server.events.event_queue.EventQueue.enqueue_event"'
          # Every other A2A protocol internal and both shapes of the agent-card fetch (#264). They are
          # emitted without a parent, so each one showed up as its own trace beside the real one and
          # a student saw "three more traces generated at the same time" (Whitney, 2026-09-06). What
          # remains is the interaction: the guard-proxy root, invoke_agent, call_llm, execute_tool.
          - 'IsMatch(name, "^a2a[.]")'
          - 'IsMatch(name, "^GET /[.]well-known/agent-card[.]json")'
          # agentgateway's MCP session lifecycle (#265). kagent opens a fresh MCP session per tool use:
          # initialize, notifications/initialized, tools/list, the call, delete_session, each an HTTP
          # request agentgateway traces WITHOUT the agent's context, so every one is its own empty trace.
          # Measured 2026-09-06 on one cluster in 40 minutes: 114 POST and 38 DELETE roots, 133 "No
          # content" traces on Whitney's page. Only a real tool call (tools/call) is kept.
          # BOTH names on purpose: the gateway is a Rust binary that has reported "agentgateway" whatever
          # the OTel env says, so a condition pinned to the new name alone would silently stop filtering
          # and the empty MCP-session traces would return (#265).
          - 'IsMatch(resource.attributes["service.name"], "^(burritobot-gateway|agentgateway)$") and not IsMatch(name, "^tools/call")'
          # kagent's own agent-card GET server spans (the client side is dropped above), and every other
          # HTTP verb from the agent's ASGI instrumentation. Measured 2026-09-07 against the live org: 37 of
          # 50 sampled burritobot-agent spans were POST, "POST /", DELETE, "POST / http send" or
          # "POST / http receive". They carry http and asgi attributes and NO gen_ai attributes at all, so
          # Datadog has no operation name to classify them by, files each as a generic workflow, and renders
          # it in Agent Observability as "input: No content / output: No content". That is what buried a
          # student's own hello in a list of blank rows. The conversation is unaffected: it lives on the
          # generate_content spans, which carry gen_ai.input.messages and gen_ai.output.messages.
          - 'IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$") and IsMatch(name, "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)( /.*)?$")'
          - 'IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$") and IsMatch(name, " http (send|receive)$")'
          # The AWS SDK's own span for the Bedrock call. It is a LEAF under generate_content with no
          # gen_ai attributes and no children, so it renders as one more "No content" row per model call
          # and tells a student nothing the parent does not. Measured 2026-09-07: a tool-using interaction
          # is nine spans, seven of them empty, and two of those seven are this.
          #
          # Only the leaves are dropped here. call_llm and invocation are also empty, and are PARENTS of
          # the spans that carry the conversation; removing a parent leaves its children with a dangling
          # reference and can re-root them into separate entries, which is the opposite of the goal.
          # Those get measured before they are touched.
          # The rule below matched NOTHING and the spans kept shipping, which the previous comment here
          # half-diagnosed and then repeated: it warned that Datadog renames the span, then still matched
          # on Datadog's rendered name. The collector never sees the word "Converse" anywhere.
          #
          # Measured out of Tempo, 2026-09-07. The AWS SDK's span is named `chat <model>` per the GenAI
          # semconv, and Datadog RENDERS it as "Converse Bedrock Runtime". So match the real name, and
          # require the span to be empty, because `chat` is a legitimate GenAI operation and a future
          # instrumentation that puts the conversation on it must not be dropped:
          #   chat us.amazon.nova-pro-v1:0        gen_ai.input.messages absent   <- 3 of these per turn
          #   generate_content us.amazon.nova-...  gen_ai.input.messages present  <- the conversation
          - 'IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$") and IsMatch(name, "^chat ") and attributes["gen_ai.input.messages"] == nil'
          # call_llm and invocation were dropped here as empty parents, "on the understanding that the
          # children may re-root; that is measured below and reverted if the trace reads worse than it did
          # with them". Measured in the Datadog UI on 2026-09-07, and the drop is REVERTED, but be precise
          # about what that did and did not fix.
          #
          # The trace detail opens on "Trace contains multiple root spans ... this trace has 2 errors",
          # shows two spans, and puts the blocked tool call in a different root of the same trace. A
          # student who clicks their interaction gets a fragment. Restoring these two spans was tried as
          # the fix and DID NOT resolve it: the warning is still there afterwards, so the split is not
          # caused by the missing parents. It is between the guard-proxy spans and the kagent spans, and
          # is tracked separately.
          #
          # They are restored anyway, on their own merits rather than as a fix. They are the agent's own
          # call hierarchy, transform/set_llmobs_workflow stamps gen_ai.operation.name=invoke_agent on
          # both so Datadog classifies them as agent spans rather than generic workflows, and an empty
          # parent costs one click while a missing one costs the shape of the subtree.

          # guard-proxy's badge poll. read_controls() asks the Kubernetes API every few seconds whether each
          # C1/C2/C3/C7 control object exists, and a 404 IS the answer for "not installed yet" — the Python
          # catches it and renders an un-lit badge. The HTTP client instrumentation records the 404 as a
          # failed span first, so a cluster in its normal starting state emits a steady drip of error spans
          # (10 in 25 minutes, measured 2026-09-07). That buries the one error that matters, a blocked tool
          # call, and puts guard-proxy's error rate up for behaving correctly.
          - 'IsMatch(resource.attributes["service.name"], "^burritobot$") and IsMatch(name, "^(GET|POST|PATCH)$") and (IsMatch(attributes["http.url"], "kubernetes.default.svc") or IsMatch(attributes["url.full"], "kubernetes.default.svc"))'
    transform/set_peer_service:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - set(attributes["peer.service"], "burritobot-agent") where attributes["peer.service"] == nil and IsMatch(resource.attributes["service.name"], "^(burritobot-gateway|agentgateway)$") and kind == SPAN_KIND_CLIENT
    # The kagent ADK token metric and the guard-proxy cost metric ship gen_ai.provider.name
    # unset / "N/A" (Datadog renders it as the literal tag value N/A). The model is a Bedrock model
    # (us.anthropic.claude-*), so per the OTel GenAI semconv the provider MUST be aws.bedrock
    # (https://opentelemetry.io/docs/specs/semconv/gen-ai/aws-bedrock/). Stamp it where missing,
    # on both metric datapoints and spans (LLM Observability + the Grafana provider filter).
    transform/set_genai_provider:
      error_mode: ignore
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["gen_ai.provider.name"], "aws.bedrock") where attributes["gen_ai.provider.name"] == nil or attributes["gen_ai.provider.name"] == "N/A"
      trace_statements:
        - context: span
          statements:
            - set(attributes["gen_ai.provider.name"], "aws.bedrock") where (attributes["gen_ai.provider.name"] == nil or attributes["gen_ai.provider.name"] == "N/A") and attributes["gen_ai.operation.name"] != nil
    # Promote kagent's call_llm span to LLM Obs workflow level so the LLM Obs trace detail
    # shows a clean invoke_agent → generate_content hierarchy instead of the full 85-span
    # HTTP trace. Without this, ml_app is derived from the guard-proxy root span and LLM Obs
    # shows all infrastructure spans (A2A protocol, tool call POSTs, DELETEs) as noise.
    # gen_ai.operation.name=invoke_agent maps to the "workflow" kind in Datadog LLM Obs.
    transform/set_llmobs_workflow:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            # "invocation" is kagent's outer wrapper. It carries gen_ai.conversation and gen_ai.task but not
            # gen_ai.operation.name, and Datadog says so itself: "No operation was reported, so this span
            # defaults to a generic workflow instead of being classified as an LLM, tool, retrieval, or
            # agent span." This rule already did the right thing for call_llm and simply never matched it.
            - set(attributes["gen_ai.operation.name"], "invoke_agent") where (name == "call_llm" or name == "invocation") and IsMatch(resource.attributes["service.name"], "^(burritobot-agent|kagent)$")
    # Make a blocked tool call visible (#265). kagent's execute_tool span is a stub (name and id only);
    # the tool RESULT, including workshop-mcp's "command FAILED" (#261), arrives as a tool-role message in
    # the NEXT model call's gen_ai.input.messages. Marking that model span as an error is what turns the
    # trace red so a student can find the blocked exfiltration; the message itself is readable in the
    # conversation. Measured 2026-09-06: the failure text is present there and nowhere else on the span.
    transform/mark_tool_failure:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - set(status.code, STATUS_CODE_ERROR) where attributes["gen_ai.input.messages"] != nil and IsMatch(attributes["gen_ai.input.messages"], "command FAILED")
            - set(status.message, "a tool call failed (see the tool result in this conversation)") where attributes["gen_ai.input.messages"] != nil and IsMatch(attributes["gen_ai.input.messages"], "command FAILED")
    # The execute_tool span is NOT a stub. Measured on watch-it-burn-michael-admin, 2026-09-07, by reading
    # the trace out of Tempo rather than out of Datadog: the span carries the full tool arguments and the
    # full tool result, including the exfiltrated payload and the blocked curl's exact failure. ADK writes
    # them under its own gcp.vertex.agent.* prefix instead of the OTel GenAI semconv names, so Datadog,
    # which reads gen_ai.*, has nothing to render and shows the tool call as empty. The data was on the
    # wire the whole time under a name nobody was looking at.
    #
    # This is the thing Whitney asked for as a student and could not get (#316): "see BurritoBot's tool
    # calls and responses". Copy, never move: the ADK names stay so anything already keyed on them keeps
    # working, and so the origin of the values remains visible.
    transform/adk_tool_content:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            # Every statement is a SINGLE-QUOTED YAML scalar, like the filter rules above. An unquoted
            # statement containing `": true"` parses as a YAML mapping, and the collector then refuses the
            # whole config with "expected type 'string', got unconvertible type 'map[string]interface {}'"
            # and CrashLoops. Caught on michael-admin before it reached anything else.
            - 'set(attributes["gen_ai.tool.call.arguments"], attributes["gcp.vertex.agent.tool_call_args"]) where attributes["gcp.vertex.agent.tool_call_args"] != nil'
            - 'set(attributes["gen_ai.tool.call.result"], attributes["gcp.vertex.agent.tool_response"]) where attributes["gcp.vertex.agent.tool_response"] != nil'
            # MCP reports a failed tool with isError, and the tool span itself carried no status at all, so
            # a blocked exfiltration and a successful one looked identical on the span named after the tool.
            # Marking it here puts the error on the span a student actually clicks, rather than only on the
            # model call that read the result afterwards. The `.` in the pattern matches the closing quote
            # of the JSON key, which keeps a backslash out of a YAML scalar that is already fiddly.
            - 'set(status.code, STATUS_CODE_ERROR) where attributes["gcp.vertex.agent.tool_response"] != nil and IsMatch(attributes["gcp.vertex.agent.tool_response"], "isError.: true")'
            - 'set(status.message, "the tool call failed (see gen_ai.tool.call.result)") where attributes["gcp.vertex.agent.tool_response"] != nil and IsMatch(attributes["gcp.vertex.agent.tool_response"], "isError.: true")'
    # The lab-marker contract (#150), applied before anything is exported. The route is public, so the collector
    # does not trust the page: anything not named lab.* is dropped, span events are dropped, the resource is
    # reset to burritobot-lab, and only the attributes gitops/ai-layer/web/lab-events.js documents survive.
    # verify/test_lab_events.py keeps this list and the page's list identical.
    filter/lab_contract:
      error_mode: ignore
      traces:
        span:
          - 'not IsMatch(name, "^lab[.][a-z]+([.][a-z]+)?$")'
        spanevent:
          - 'IsMatch(name, ".*")'
    transform/lab_contract:
      error_mode: ignore
      trace_statements:
        - context: resource
          statements:
            - 'keep_keys(attributes, ["service.name"])'
            - 'set(attributes["service.name"], "burritobot-lab")'
        - context: span
          statements:
            - 'keep_keys(attributes, ["session.id", "witb.lab.alias", "witb.lab.role", "witb.lab.challenge", "witb.lab.item", "witb.lab.kind", "witb.lab.control"])'
            - 'truncate_all(attributes, 64)'
  exporters:
    prometheusremotewrite:
      endpoint: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
      tls:
        insecure: true
      resource_to_telemetry_conversion:
        enabled: true
    # otlp_grpc, not otlp: the chart renames the old name when it renders relay.yaml (a deprecation it warns
    # about), and the Datadog overlay below does not go through that rewrite. Written as otlp/tempo, the
    # overlay named an exporter that no longer existed after the rename and the collector refused the config
    # ('references exporter "otlp/tempo" which is not configured', otelcol-contrib 0.160.0). One name everywhere.
    otlp_grpc/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
    # The PRIMARY sink, Datadog, is NOT defined here. It lives in the Datadog overlay below
    # (extraManifests, otel-collector-datadog), which the datadog-gate init container switches on only
    # when datadog-secret exists. This file on its own is the Datadog-free collector: Tempo + Prometheus.
    # The burn profile installs neither, so values-burn.yaml takes both out of every pipeline list (#476).
    debug:
      verbosity: basic
      sampling_initial: 5
      sampling_thereafter: 200
  connectors:
    # Generates RED metrics from spans. add_resource_attributes propagates the UST resource
    # attributes (deployment.environment.name -> env, service.version) onto the generated
    # metrics; it defaults to false, and without it Datadog "View related logs" from a
    # span-derived metric silently finds nothing (the research spikes (removed 2026-08-30; see `git log --diff-filter=D -- research/`), the research spikes (removed 2026-08-30; see `git log --diff-filter=D -- research/`)).
    # Connector key is `span_metrics` (the current OTel semconv name; `spanmetrics` is the
    # deprecated alias slated for removal). add_resource_attributes is supported on contrib 0.158.2.
    span_metrics:
      add_resource_attributes: true
    # Counts of lab markers, as metrics, for the instructor dashboard (#150). Metrics because a dashboard over
    # a two-hour session needs every event, and metrics are kept whole where indexed spans are sampled.
    # Arrives in Datadog as witb.lab.calls tagged span.name, kube_cluster_name and the dimensions below.
    # session.id is deliberately NOT a dimension: one series per browser tab is cardinality for nothing.
    # Used only by the lab pipelines in the Datadog overlay; unused (and not started) without it.
    span_metrics/lab:
      namespace: witb.lab
      add_resource_attributes: true
      metrics_flush_interval: 15s
      dimensions:
        - name: witb.lab.alias
        - name: witb.lab.role
        - name: witb.lab.challenge
        - name: witb.lab.kind
        - name: witb.lab.control
    # datadog/connector (APM trace.* metrics) is in the Datadog overlay below, with the exporter it feeds.
  service:
    telemetry:
      logs:
        level: info
      metrics:
        # Collector 0.159.0 (chart 0.172.1) REMOVED service.telemetry.metrics.address and fails to
        # start on it: "'migration.MetricsConfigV030' has invalid keys: address". The replacement is
        # a Prometheus reader, which expresses the same thing (scrape endpoint on :8888) in the
        # config shape the new version accepts. Found on a live upgrade, #389.
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
    # The Datadog-free pipelines. The Datadog overlay restates the receivers and exporters lists (the
    # collector replaces lists when it merges configs, as Helm does), so a change to either list here
    # must be made in the overlay too; verify/test_collector_no_datadog.py fails until it is.
    pipelines:
      metrics:
        receivers:
          - otlp
          - span_metrics # RED metrics generated from spans (carry UST tags for correlation)
        processors:
          - memory_limiter
          - batch
          - resource
          - transform/set_genai_provider # stamp gen_ai.provider.name=aws.bedrock where N/A
        exporters:
          - prometheusremotewrite # the fallback, and the only metrics sink without Datadog
          - debug
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - filter/drop_noise
          - batch
          - resource
          - transform/set_peer_service # PRD #27 M3: peer.service fallback for the agentgateway->kagent edge
          - transform/set_genai_provider # stamp gen_ai.provider.name=aws.bedrock on spans where N/A
          - transform/set_llmobs_workflow # promote call_llm to invoke_agent so LLM Obs shows clean hierarchy
          - transform/mark_tool_failure # a model call that received a failed tool result renders as an error
          - transform/adk_tool_content # surface ADK's tool args/result under gen_ai.* so Datadog renders them
        exporters:
          - otlp_grpc/tempo # the fallback, and the only trace sink without Datadog
          - span_metrics  # feed the connector so it can derive metrics from these spans
          - debug
      # Lab progress markers (#150). Defined here with their processors, exporting to debug only, so a cluster
      # with no datadog-secret receives the markers and drops them. The Datadog overlay below adds the org they
      # are for, the same way it does for traces and metrics.
      traces/lab:
        receivers:
          - otlp/lab
        processors:
          - memory_limiter
          - filter/lab_contract
          - transform/lab_contract
          - resource
          - batch
        exporters:
          - span_metrics/lab
          - debug
      metrics/lab:
        receivers:
          - span_metrics/lab
        processors:
          - memory_limiter
          - resource
          - batch
        exporters:
          - debug

# ---- Datadog, switched on by the presence of datadog-secret (#500) ----
#
# The collector used to name the datadog exporter in this file and read DD_API_KEY with a NON-optional
# secretKeyRef. With no datadog-secret, which is every cluster brought up before a Datadog org pool exists
# (#454), the pod could not start at all, so Tempo and Prometheus, the fallback, died with the primary. And
# making the reference optional alone does not help: the exporter refuses an empty key ("exporters::datadog:
# api.key is not set", measured against otelcol-contrib 0.160.0, this chart's appVersion) and that fails the
# whole config, used in a pipeline or not.
#
# So the Datadog half is a second collector config file, loaded after relay.yaml with a second --config. The
# datadog-gate init container decides what that file holds: the overlay below when datadog-secret exists, an
# empty config when it does not, and it says which in its log. The same profile therefore runs Datadog-free
# today and ships to Datadog once the key is loaded, with no repo change: write datadog-secret (deploy-full-idp
# or fleet.sh converge does) and restart the collector pods (infra/reload-datadog-consumers.sh).
#
#   kubectl -n monitoring logs ds/otel-collector-opentelemetry-collector-agent -c datadog-gate
#
# The collector replaces lists when it merges, so the overlay restates in full the exporter lists it changes
# (traces, metrics, and the two lab pipelines, #150) and the metrics receivers; the processors lists are not
# touched and come from relay.yaml. values-dual.yaml (attendee) restates
# this ConfigMap with the instructor org added and Tempo taken out (the attendee profile has no Tempo, #475),
# and values-burn.yaml (burn) with Tempo and Prometheus removed.

extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: otel-collector-datadog
    data:
      datadog.yaml: |
        exporters:
          # PRIMARY telemetry sink when present: Datadog (Whitney's account). DD_API_KEY / DD_SITE come from
          # datadog-secret (BYO; never stored in this repo) and the DD_SITE env below.
          datadog:
            api:
              key: ${env:DD_API_KEY}
              site: ${env:DD_SITE}
        connectors:
          # datadog/connector computes APM Trace Metrics (the trace.* namespace used by SLOs/monitors).
          # Required since otelcol-contrib v0.95.0: the Datadog exporter no longer derives these itself.
          # compute_stats_by_span_kind so stats are computed for client/server/etc. spans (PRD #13 M2).
          datadog/connector:
            traces:
              compute_stats_by_span_kind: true
              peer_tags_aggregation: true   # surface external service dependencies (e.g. Bedrock) on the Datadog Service Map
        service:
          pipelines:
            metrics:
              receivers:
                - otlp
                - span_metrics
                - datadog/connector # APM trace.* metrics (compute_stats_by_span_kind); PRD #13 M2
              exporters:
                - datadog               # primary
                - prometheusremotewrite # secondary / fallback
                - debug
            traces:
              exporters:
                - datadog      # primary
                - otlp_grpc/tempo # secondary / fallback
                - span_metrics
                - datadog/connector # feed the APM-stats connector (trace.* metrics); PRD #13 M2
                - debug
            # Lab progress markers (#150). relay.yaml has the two lab pipelines exporting to debug only; this adds
            # Datadog, which on this profile (admin and full, the instructor clusters) IS the instructor org.
            # values-dual.yaml adds datadog/admin instead, so on attendee clusters the markers reach the
            # instructor's fleet view and never the student's own org.
            traces/lab:
              exporters:
                - datadog
                - span_metrics/lab
                - debug
            metrics/lab:
              exporters:
                - datadog
                - debug
initContainers:
  - name: datadog-gate
    # The signed busybox mirror the platform already admits (verify-image-signatures, registry allowlist).
    image: ghcr.io/peopleforrester/watch-it-burn:busybox-1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: ["sh", "-c"]
    args:
      - |
        if [ -n "${DD_API_KEY:-}" ]; then
          cp /datadog-overlay/datadog.yaml /datadog-gate/datadog.yaml
          echo "datadog-gate: datadog-secret found. Datadog export ON: traces and metrics to Datadog, and to Tempo and Prometheus on the profiles that install them."
        else
          echo '{}' > /datadog-gate/datadog.yaml
          echo "datadog-gate: no datadog-secret. Datadog export OFF: traces to Tempo, metrics to Prometheus only, on the profiles that install them (burn installs neither and exports to debug only). Known gap until a Datadog key is loaded (#454); write datadog-secret and restart this pod to turn it on."
        fi
    env:
      - name: DD_API_KEY
        valueFrom:
          secretKeyRef:
            name: datadog-secret
            key: api-key
            optional: true
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
    volumeMounts:
      - name: datadog-overlay
        mountPath: /datadog-overlay
        readOnly: true
      - name: datadog-gate
        mountPath: /datadog-gate
command:
  extraArgs:
    - --config=/datadog-gate/datadog.yaml
extraVolumes:
  - name: datadog-overlay
    configMap:
      name: otel-collector-datadog
  - name: datadog-gate
    emptyDir:
      sizeLimit: 1Mi
extraVolumeMounts:
  - name: datadog-gate
    mountPath: /datadog-gate
    readOnly: true
# A change to the overlay rolls the collector, as a change to relay.yaml already does through the chart's own
# checksum. Without it an edited overlay sat unused until something else restarted the pods.
podAnnotations:
  checksum/datadog-overlay: '{{ .Values.extraManifests | toJson | sha256sum }}'
# DD_API_KEY is optional: the collector starts without datadog-secret, and only the overlay reads it. DD_SITE is
# that account's site (e.g. datadoghq.com, us5.datadoghq.com, datadoghq.eu).
extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: datadog-secret
        key: api-key
        optional: true
  - name: DD_SITE
    value: "datadoghq.com"
  - name: WIB_CLUSTER_NAME
    valueFrom:
      configMapKeyRef:
        name: cluster-identity
        key: datadog-cluster-name  # burritobot-<role>, the name the Agents report (#629)
        optional: true   # absent on a cluster bootstrapped before #242; rebuilt clusters always have it
service:
  enabled: true
  type: ClusterIP
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  # The otlp/lab receiver (#150): the console's /lab-events route proxies here.
  otlp-lab:
    enabled: true
    containerPort: 4319
    servicePort: 4319
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP
