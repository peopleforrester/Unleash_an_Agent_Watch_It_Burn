# ABOUTME: ArgoCD Application that syncs KubeArmorPolicy CRs from policies/kubearmor/. Split from the
# ABOUTME: engine app (mirrors kyverno / kyverno-policies) so the deny rule is versioned as plain
# ABOUTME: manifests, separate from the operator install.
#
# Wave 4: after the KubeArmor operator + CRDs (kubearmor app, wave -6), the agent namespace (namespaces,
# wave -10), and the workshop-mcp workload (ai-layer, wave 3). ServerSideApply + retry tolerate the CRD/pod
# not being ready on the first reconcile. Only the ADMIN app-of-apps pulls this app. The attendee and full
# profiles exclude it, because it is the C3 control a student installs as the fix (#281), and BURN (the
# community cluster) omits it, so that cluster gets no C3 enforcement even though the KubeArmor engine runs.
#
# This is the SOLE C3 inline-prevention block since Tetragon was retired 2026-08-30. KubeArmor's enforcer
# was proven to engage on our AL2023/containerd nodes (2026-07-18 and 2026-08-30, both live). Enforcement
# depends on workshop-mcp being admitted after the KubeArmor webhook is up: the ai-layer PreSync gate
# (gitops/ai-layer/kubearmor-ordering-gate.yaml) guarantees that ordering.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubearmor-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
    targetRevision: staging
    path: policies/kubearmor
  destination:
    server: https://kubernetes.default.svc
    namespace: agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
