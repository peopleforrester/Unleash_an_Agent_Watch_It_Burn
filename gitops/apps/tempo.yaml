# ABOUTME: ArgoCD Application for Grafana Tempo distributed tracing backend.
# ABOUTME: Receives traces from OTel Collector, queryable via Grafana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: tempo
    # The tempo single-binary chart moved from grafana/helm-charts to
    # grafana-community/helm-charts on 2026-01-30; the old path is a dead stub.
    repoURL: https://grafana-community.github.io/helm-charts
    # Staying on the single-binary 2.x line by decision (2026-09-10). Tempo 3.0.3 exists but only
    # through the tempo-distributed chart (3.5.1), which is a microservices deployment (distributor,
    # ingester, querier, compactor) rather than one pod. At fifty clusters that resource cost is
    # multiplied fifty times for no workshop benefit, so 3.x is deliberately not taken. See PRD #389.
    targetRevision: "2.3.0" # app 2.10.8 (single-binary; tempo-distributed tracks app 3.0)
    helm:
      valuesObject:
        tempo:
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
              wal:
                path: /var/tempo/wal
          retention:
            24h
        persistence:
          enabled: true
          size: 5Gi
          storageClassName: gp2
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
