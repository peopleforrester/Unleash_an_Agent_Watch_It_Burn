# ABOUTME: ArgoCD Application for OpenTelemetry Collector DaemonSet.
# ABOUTME: ATTENDEE/presenter profile: dual-ships to the student's org AND the instructor org (#242).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: "0.158.2"
      helm:
        # Values live in the repo so the instructor and attendee Applications share one config and
        # differ by one overlay file (gitops/otel-collector/values-dual.yaml). Argo CD multi-source:
        # the second source is a ref, never deployed, only read for the value files.
        valueFiles:
          - $values/gitops/otel-collector/values.yaml
          - $values/gitops/otel-collector/values-dual.yaml
    - repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
      targetRevision: staging
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
