# ABOUTME: Dual telemetry (#174). Ships every cluster's traces and metrics to a SECOND Datadog org, the
# ABOUTME: instructor fleet org, alongside the attendee's own. Off by default; see the toggle below.
#
# THE PROBLEM THIS SOLVES. Every attendee gets their own Datadog org, which is right for them and useless
# for us: during the workshop there is no single view of the room, so nothing can be narrated live. Whitney
# raised it as the central observability gap, and the games were deliberately designed to resolve on signals
# the room can see directly precisely because this did not exist.
#
# THE SHAPE. The Datadog exporter is per-destination, not per-key, so a second org is a second exporter
# added to the same pipelines. Both receive the same spans and metrics; neither is aware of the other. The
# attendee's org stays PRIMARY and is listed first, so if the fleet org is rate-limited or its trial has
# lapsed, the attendee's own telemetry is unaffected.
#
# WHY THIS FILE IS NOT WIRED INTO ARGOCD. Same reason as otel-collector-act2-overlay.yaml: it must never be
# the default startup state. The Datadog exporter FAILS VALIDATION on an empty api key, so a cluster that
# has this config but no fleet key does not degrade, it CrashLoops the collector and loses the attendee's
# telemetry as well. An opt-in that can take down all 250 clusters' observability is not something to leave
# armed. Turning it on is a deliberate act, taken once the fleet key is confirmed to exist.
#
# TURNING IT ON (one commit, fleet-wide, because every cluster tracks the same branch):
#   1. Confirm the secret exists and the key validates:
#        AWS_PROFILE=accen-dev aws secretsmanager get-secret-value \
#          --secret-id watch-it-burn/datadog-fleet --region us-west-2 --query SecretString --output text
#        curl -s -o /dev/null -w '%{http_code}\n' -H "DD-API-KEY: <key>" https://api.datadoghq.com/api/v1/validate
#      A 200 here proves the key works. It does NOT prove the web UI still works; see #175.
#   2. Paste the `datadog/fleet` exporter below into the `exporters:` block of otel-collector.yaml.
#   3. Add `datadog/fleet` to the metrics and traces pipelines, AFTER `datadog`, so the attendee's own org
#      is always written first.
#   4. Paste the two extraEnvs below into the collector's `extraEnvs:` list.
#   5. Commit. Argo CD rolls it out; `verify/fleet-drift-audit.sh` should then report both exporters.
#
# TURNING IT OFF: revert the commit. There is no partial state to clean up.
#
# COST NOTE: this doubles ingested spans and metrics for the fleet org's account, not the attendees'. At
# 250 clusters that is a real bill on one org, so check the fleet org's plan before the event rather than
# discovering it afterwards.
---
# 1. The second exporter. Paste into `exporters:` in otel-collector.yaml.
exporters:
  datadog/fleet:
    api:
      key: ${env:DD_FLEET_API_KEY}
      site: ${env:DD_FLEET_SITE}
    # Retry and queue are deliberately SHORTER than the defaults. This is the secondary destination and it
    # must never apply backpressure that delays the attendee's own export: a full sending queue blocks the
    # pipeline for every exporter on it, so a slow fleet org would degrade the org the student is watching.
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      queue_size: 200

---
# 2. Pipeline wiring. The attendee's org is listed FIRST in both pipelines; order is the failure-isolation
#    decision, not cosmetics.
service:
  pipelines:
    metrics:
      exporters:
        - datadog # the attendee's own org, primary
        - datadog/fleet # the instructor fleet org, secondary
        - prometheusremotewrite
        - debug
    traces:
      exporters:
        - datadog # the attendee's own org, primary
        - datadog/fleet # the instructor fleet org, secondary
        - otlp/tempo
        - debug

---
# 3. Credentials. Paste into the collector's `extraEnvs:` list.
#    `datadog-fleet-secret` DOES NOT EXIST YET. It needs an ExternalSecret in eso-resources.yaml pulling
#    from watch-it-burn/datadog-fleet in AWS Secrets Manager, added in the SAME change as the exporter
#    above. Adding the ExternalSecret on its own, before that Secrets Manager entry exists, puts the
#    external-secrets app into SecretSyncError and shows the whole fleet as Degraded in the drift audit,
#    which is why it is described here rather than shipped ahead of the decision.
extraEnvs:
  - name: DD_FLEET_API_KEY
    valueFrom:
      secretKeyRef:
        name: datadog-fleet-secret
        key: api-key
  - name: DD_FLEET_SITE
    value: "datadoghq.com"

---
# 4. Telling the two apart once both are receiving. Every cluster already stamps its own identity via the
#    UST resource attributes, so in the fleet org each attendee appears as a distinct `kube_cluster_name`.
#    Narrating the room is then a group-by on that tag rather than 250 separate dashboards.
#
#    Useful starting queries in the fleet org:
#      sum:witb_cost_usd{*} by {kube_cluster_name}          # the cost race, live, per attendee
#      sum:trace.*.hits{*} by {kube_cluster_name}           # who is actually driving their agent
#      count:falco.events{*} by {kube_cluster_name,rule}    # who just tripped a runtime rule
#
#    NOTE `witb_cost_usd` is exposed but not currently scraped; that gap is tracked separately and would
#    need closing before the cost race can be narrated from this org.
