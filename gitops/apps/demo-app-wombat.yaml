# ABOUTME: ArgoCD Application for the demo-app-wombat demo app owned by ecommerce-team.
# ABOUTME: Deploys demo-app-wombat manifests to the apps namespace via GitOps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-wombat
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/peopleforrester/Unleash_an_Agent_Watch_It_Burn.git
    targetRevision: staging
    path: gitops/manifests/demo-app-wombat
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
