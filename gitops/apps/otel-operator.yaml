# ABOUTME: ArgoCD Application for the OpenTelemetry Operator (PRD #20 M2). Owns the Instrumentation CRD
# ABOUTME: and injects the Python OTel SDK into annotated pods (guard-proxy), so app images stay slim.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-operator
  namespace: argocd
  annotations:
    # Wave 2: cert-manager (wave 1) must be up first; the Operator's admission webhook uses a
    # cert-manager-issued cert by default. The Operator installs the Instrumentation + OpenTelemetryCollector
    # CRDs that gitops/ai-layer-otel/instrumentation.yaml depends on. That CR is its own Application
    # (ai-layer-otel) in this same wave, and is omitted from the burn profile precisely because this
    # Operator and its cert-manager dependency are.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    # HELD at 0.122.0 (app 0.158.0). 0.123.0 was taken in af91d05 and backed out after a controlled
    # test on 2026-09-19 (#405): same node, same platform, same node pressure, one variable changed.
    #
    #                        0.123.0            0.122.0
    #   operator restarts    28                 0
    #   ai-layer sync        Running, forever   Succeeded
    #   OTel injection       0 pods             2 pods
    #   node cpu limits      371%               371%
    #   node memory limits   121%               120%
    #
    # The failure mode is what makes this worth holding rather than living with. The operator fails to
    # reach the API server on startup, its admission webhook never serves, the otel-gate sync hook waits
    # on that webhook forever, and the ai-layer Application parks in Running. Every later change to
    # ai-layer is then blocked, with nothing reporting an error: a committed and synced fix to
    # agentgateway-config was observed unable to reach its pod for exactly this reason.
    #
    # Re-test before taking 0.123.0 again. verify/version-drift.py will keep reporting this as behind,
    # which is correct and deliberate.
    targetRevision: "0.122.0"
    helm:
      valuesObject:
        # The manager image's collector tag must be pinned (the chart requires it explicitly).
        manager:
          collectorImage:
            repository: otel/opentelemetry-collector-k8s
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
        admissionWebhooks:
          certManager:
            enabled: true  # cert-manager is in the stack (gitops/apps/cert-manager.yaml)
        crds:
          create: true  # install the Instrumentation + OpenTelemetryCollector CRDs
  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
