# ABOUTME: The villain Deployment the agent is induced to apply (Beat 2). On Cluster 1 it comes up; on
# ABOUTME: Cluster 2 the Kyverno registry allowlist refuses the image (a watch-it-burn joker- tag is refused).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: villain-app
  namespace: apps
  labels: { app: villain-app, workshop.beat: "02-villain-app" }
spec:
  replicas: 1
  selector: { matchLabels: { app: villain-app } }
  template:
    metadata: { labels: { app: villain-app } }
    spec:
      containers:
        - name: villain
          image: ghcr.io/peopleforrester/watch-it-burn:joker-busybox-1.38.0 # C6's Joker; its joker- tag -> C2 refuses
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: villain-app
  namespace: apps
spec:
  selector: { app: villain-app }
  ports: [{ port: 80, targetPort: 8080 }]
